# Static tests. No host is contacted and nothing is installed.
#
# Two checks, both of which only need `inventories/test`, so they run
# in CI without the vault password:
#
#   1. Every meta/argument_specs.yml is validated. This catches a role
#      and its inventory drifting apart - in particular that
#      overriding a role's top-level dict REPLACES the role default
#      rather than merging into it, so an override that forgets one
#      key breaks the role at run time.
#
#   2. Every template in every role is rendered. This catches Jinja
#      errors and undefined variables without needing a host. It has
#      already caught a comparison against the wrong type that
#      silently rendered an IPv4 ruleset into the IPv6 file.
#      Templates whose output branches are rendered once per branch,
#      and the Grafana dashboards are parsed as JSON afterwards:
#      Grafana logs a malformed dashboard and carries on without it,
#      so that failure is a missing page rather than a failed run.
#
# Variables come from the test inventory only, not from role
# defaults - so a template referencing something the inventory does
# not define fails here. That is deliberate: it keeps
# `inventories/test` a complete, working example of what every role
# expects.
#
# Run with `invoke test-static`.
- name: Static checks
  hosts: testhost
  gather_facts: false
  # ansible.cfg escalates by default, for the real hosts. Nothing
  # here touches a real host or needs root, and escalating would just
  # prompt for a sudo password.
  become: false
  vars:
    repo: "{{ playbook_dir | dirname }}"
    rendered: /tmp/ansible-render-test
    hostvars_plain: "{{ hostvars[inventory_hostname] | to_json | from_json }}"
    # Values a role sets at run time, which templates therefore
    # cannot get from the inventory. Applied to every template;
    # harmless for the ones that do not use them.
    cloud_php_version: "8.3"
    http_php_version: "8.3"
    cloud_fpm_socket: /run/php/nextcloud-fpm.sock
    # notify_push ships one prebuilt binary per architecture, so the
    # unit file names the host's. Detected by `uname -m` at run time.
    cloud_push_arch: x86_64
    ip_version: 4
    # roles/monitoring renders a service and a timer per textfile
    # collector, with the name and its interval passed in as
    # `collector` / `collector_interval`.
    collector: fail2ban
    collector_interval: 1min
    # roles/monitoring renders one EnvironmentFile per enabled
    # exporter, with the entry passed in as `exporter`; supply the
    # first one from the role's own table.
    exporter:
      name: nginx
      args:
        - --web.listen-address=127.0.0.1:9113
        - --nginx.scrape-uri=http://127.0.0.1:8080/stub_status
    # roles/nsd renders one zone file per entry in nsd.zones, with the
    # entry passed in as `zone`; supply the first one here. The
    # per-zone render below covers the rest.
    zone: "{{ nsd.zones[0] }}"
    # Facts, which this play does not gather - no host is contacted.
    # roles/system checks its own addresses against these before
    # writing them to /etc/hosts, and is deliberately strict about it
    # rather than defaulting them away: on a real run a missing fact
    # means the host lines would be silently dropped, which is worth a
    # hard failure. Both inventory addresses are listed so that both
    # branches render here.
    #
    # Supplied under `ansible_facts` rather than as top-level
    # `ansible_*` names: those are injected by INJECT_FACTS_AS_VARS,
    # which ansible-core deprecates and will default to false.
    ansible_facts:
      all_ipv4_addresses: "{{ [ip_v4] }}"
      all_ipv6_addresses: "{{ [ip_v6] }}"
      # The release codename roles/monitoring's updates collector
      # names the OVAL feed by.
      distribution_release: noble
    site:
      name: default
      subdomains:
        - ""
        - www
      root: /var/www/html
      include_locations: true
  tasks:
    - name: Find roles that declare an argument spec
      ansible.builtin.find:
        paths: "{{ repo }}/roles"
        patterns: argument_specs.yml
        recurse: true
      register: specs

    - name: Fail if no argument specs were found
      # A path typo would otherwise make this playbook pass by
      # checking nothing at all.
      ansible.builtin.assert:
        that:
          - specs.files | length > 0
        fail_msg: "No meta/argument_specs.yml found under roles/"

    - name: Validate argument specs against the test inventory
      vars:
        spec: "{{ lookup('ansible.builtin.file', item.path) | from_yaml }}"
      ansible.builtin.validate_argument_spec:
        argument_spec: "{{ spec.argument_specs.main.options }}"
        provided_arguments: >-
          {{ hostvars_plain | dict2items
             | selectattr('key', 'in',
                          spec.argument_specs.main.options.keys() | list)
             | items2dict }}
      loop: "{{ specs.files | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | dirname | dirname | basename }}"

    - name: Find every template
      ansible.builtin.find:
        paths: "{{ repo }}/roles"
        patterns: "*.j2"
        recurse: true
      register: templates

    - name: Fail if no templates were found
      ansible.builtin.assert:
        that:
          - templates.files | length > 0
        fail_msg: "No templates found under roles/"

    - name: Create the render directory
      ansible.builtin.file:
        path: "{{ rendered }}"
        state: directory
        mode: "0700"

    - name: Render every template
      ansible.builtin.template:
        src: "{{ item.path }}"
        dest: >-
          {{ rendered }}/{{ item.path | relpath(repo) | replace('/', '_') }}
        mode: "0600"
      loop: "{{ templates.files | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | relpath(repo) }}"

    - name: Render the firewall rules for IPv6 as well
      # The only template rendered twice: the v4/v6 branch is exactly
      # where a silent wrong-output bug lived before.
      ansible.builtin.template:
        src: "{{ repo }}/roles/firewall/templates/iptables.rules.j2"
        dest: "{{ rendered }}/firewall_rules.v6"
        mode: "0600"
      vars:
        ip_version: 6

    - name: Confirm the two address families really differ
      ansible.builtin.command:
        cmd: >-
          diff -q {{ rendered }}/roles_firewall_templates_iptables.rules.j2
          {{ rendered }}/firewall_rules.v6
      register: firewall_diff
      changed_when: false
      failed_when: firewall_diff.rc == 0

    - name: Render the zone file for every zone
      # The generic render above only covers nsd.zones[0], through the
      # `zone` play var. This host is authoritative for more than one
      # zone, and a second one is exactly where a template that quietly
      # assumed a single zone would show up.
      ansible.builtin.template:
        src: "{{ repo }}/roles/nsd/templates/zone.j2"
        dest: "{{ rendered }}/nsd_{{ item.name }}.zone"
        mode: "0600"
      loop: "{{ nsd.zones }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        zone: "{{ item }}"

    - name: Read the rendered transfer keys
      ansible.builtin.slurp:
        src: "{{ rendered }}/roles_nsd_templates_tsig.conf.j2"
      register: nsd_tsig

    - name: Confirm every zone got a transfer key of its own
      # One key per zone, not one per server, which is what the role
      # used to emit. A single shared block would leave both zones
      # transferring under the same name - and would silently break the
      # moment a secondary derives the name from the zone, as Hetzner's
      # console does.
      vars:
        key_names: >-
          {{ nsd_tsig.content | b64decode
             | regex_findall('name: "([^"]+)"') | unique }}
      ansible.builtin.assert:
        that:
          - key_names | length == nsd.zones | length
        fail_msg: >-
          tsig.conf renders {{ key_names | length }} distinct key
          name(s) for {{ nsd.zones | length }} zone(s): {{ key_names }}

    - name: Note what roles/monitoring looks like with every option off
      # A fact rather than a play var, deliberately: a var defined in
      # terms of `monitoring` and then used *as* `monitoring` is a
      # recursive lookup. set_fact resolves it once, here, against the
      # inventory value.
      ansible.builtin.set_fact:
        monitoring_off: >-
          {{ monitoring | combine({'blackbox': {'enabled': false},
                                   'exporters': monitoring_exporters_off},
                                  recursive=true) }}
      vars:
        # Every exporter the inventory names, switched off without
        # listing them here - a hand-written list would go stale the
        # moment one is added, and would do so silently.
        # `listen_address` is filtered out by taking only the entries
        # that are dicts.
        monitoring_exporters_off: >-
          {{ monitoring.exporters | dict2items
             | selectattr('value', 'mapping')
             | map('combine', {'value': {'enabled': false}})
             | items2dict }}

    - name: Render the uptime dashboard with every option off
      # The panels for the blackbox probes and for the self-reporting
      # exporters are rendered conditionally, so the inventory above -
      # which has all of them on - only ever exercises one branch. The
      # other branch is where a missing comma would sit, and a
      # dashboard Grafana cannot parse is a missing page rather than a
      # failed run. Same reasoning as the IPv6 firewall render.
      vars:
        monitoring: "{{ monitoring_off }}"
        dashboards: "{{ repo }}/roles/monitoring/templates/grafana/dashboards"
      ansible.builtin.template:
        src: "{{ dashboards }}/uptime.json.j2"
        dest: "{{ rendered }}/monitoring_uptime_minimal.json"
        mode: "0600"

    - name: Find the rendered grafana dashboards
      ansible.builtin.find:
        paths: "{{ rendered }}"
        patterns: "*_dashboards_*.json.j2"
      register: grafana_dashboards

    - name: Fail if no dashboards were found
      ansible.builtin.assert:
        that:
          - grafana_dashboards.files | length > 0
        fail_msg: "No rendered dashboards found in {{ rendered }}"

    - name: Every rendered dashboard is valid JSON
      # The same check the role makes with `validate:` before
      # installing one, moved to where it costs nothing and needs no
      # host. Grafana logs a malformed dashboard and carries on
      # without it, so the failure it catches is silent by nature.
      ansible.builtin.command:
        cmd: python3 -m json.tool {{ item }} /dev/null
      loop: >-
        {{ (grafana_dashboards.files | map(attribute='path') | list)
           + [rendered ~ '/monitoring_uptime_minimal.json'] }}
      loop_control:
        label: "{{ item | basename }}"
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ specs.files | length }} argument specs validated,
          {{ templates.files | length }} templates rendered
