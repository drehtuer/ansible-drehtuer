# Mirrors the role defaults, because the static tests render templates
# from this inventory alone - without role defaults - so anything a
# template reads has to be defined here or the render fails.
#
# The image digest and the mod pins are the real ones rather than
# placeholders: both are public information, and a fake would make
# this file stop being a working example of what the role expects.
#
# The password is deliberately fake, deliberately unencrypted, and
# deliberately long enough to satisfy the five-character minimum the
# server enforces. Nothing here is ever deployed.
valheim:
  image: ghcr.io/community-valheim-tools/valheim-server
  tag: "1.4.0"
  digest: >-
    sha256:f3ccde9a4e292663cf5096d502ff33cc9617015f6d70b6a9ca0968543f165ef2
  compose_dir: /etc/valheim
  config_dir: /srv/valheim/config
  data_dir: /srv/valheim/data
  server:
    name: testhost-valheim
    world: TestWorld
    password: test-valheim-join
    public: false
    port: 2456
    timezone: Etc/UTC
    # Non-empty on purpose: ADMINLIST_IDS is rendered by joining this
    # list, and an empty one would leave that branch untested
    # everywhere in the repo.
    admin_ids:
      - "76561190000000000"
    # Non-empty on purpose, for the same reason as admin_ids above:
    # SERVER_ARGS is rendered by joining this list, and an empty one
    # would leave that branch untested everywhere in the repo. It
    # also shows the ordering the real inventory warns about.
    args:
      - "-preset normal"
      - "-modifier raids less"
  webmap:
    # 8091, not the mod default of 3000, which Grafana holds.
    port: 8091
    subdomain: valheim

# Two real entries out of the role default's list, not all of them:
# enough for the argument spec to validate the shape - including the
# optional `directory` - without repeating the whole list here, which
# would be one more copy to bump on every update.
valheim_mods:
  - name: ValheimModding-Jotunn
    version: "2.30.2"
    sha256: 8aae92da2be0eb6820cd4cf57e2f6c1d6ad0d738d4915966e7c3d7a94e9a9b0f
  - name: f00d4tehg0dz-ValheimWebMap
    version: "2.1.6"
    sha256: 1ce6e3ac26b1b39e9be05d88db32efb454c273d544ced696f631476794052ef2
    directory: WebMap
