firewall:
  rate_limit:
    seconds: 10
    hitcount: 10
  docker:
    enabled: true
    # A literal here rather than the default-route fact, so the static
    # tests do not depend on the machine they run on.
    wan_interface: eth0
    # Non-empty on purpose, though this host publishes nothing: the
    # DOCKER-USER RETURN rules are rendered in a loop, and empty lists
    # leave that branch unrendered anywhere in the repo. Production
    # carried the only real entries until the Satisfactory server was
    # removed on 2026-09-13, which is what made this the sole cover.
    published:
      tcp:
        - port: 7777
          comment: "Example published container port"
      udp:
        - port: 7777
          comment: "Example published container port"
  wireguard:
    enabled: true
    interface: wg0
    # A literal, for the same reason as docker.wan_interface above.
    wan_interface: eth0
    network:
      ip4: "{{ wireguard.network.ip4 }}"
      ip6: "{{ wireguard.network.ip6 }}"
    listen_port: "{{ wireguard.listen_port }}"
    redirect_port: "{{ wireguard.redirect_port }}"
  rules:
    tcp:
      - port: 22
        comment: "SSH"
        rate_limit: true
      - port: 443
        comment: "HTTPS"
    udp:
      - port: 53
        comment: "DNS"
      - port: 51820
        comment: "WireGuard (roles/wireguard)"
