fail2ban:
  defaults:
    bantime: 1h
    findtime: 10m
    maxretry: 5
  jails:
    - name: recidive
      port: all
      filter: recidive
      backend: auto
      logpath: /var/log/fail2ban.log
      bantime: 1w
      findtime: 1d
      maxretry: 3
    - name: sshd
      port: ssh
      filter: sshd
      backend: systemd
    # Carries `options` deliberately: it is the only jail here that
    # does, and without one the template's options loop is never
    # rendered by the static test. The real postfix jail depends on
    # that loop to emit its `journalmatch` override, so leaving the
    # branch uncovered would mean the one mechanism the fix relies on
    # was never exercised.
    - name: postfix
      port: smtp,submission
      filter: "postfix[mode=normal]"
      backend: systemd
      options:
        journalmatch: _SYSTEMD_UNIT=postfix@-.service
    # The SASL half of the same service. Also the only jail here whose
    # `filter` differs from its `name`, which is the shape the render
    # would otherwise never exercise.
    - name: postfix-auth
      port: smtp,submission
      filter: "postfix[mode=auth]"
      backend: systemd
      options:
        journalmatch: _SYSTEMD_UNIT=postfix@-.service
    - name: nginx-404
      port: https
      filter: nginx-404
      backend: auto
      logpath: /var/log/nginx/access.log
      maxretry: 20
