http:
  port_http: 80
  port_https: 443
  # Derived exactly as production does, and `domain_aliases` in
  # ../../machines.yml holds one entry - so the static tests still
  # render the multi-domain path, now in the same shape the real
  # inventory uses.
  domains: "{{ [domain] + domain_aliases }}"
  letsencrypt:
    email: postmaster@test.invalid
    webroot_path: /var/www/certbot
    cert_name: "{{ hostname_fqdn }}"
    subdomains:
      - cloud
      # The fail2ban web UI vhost, see roles/fail2ban_ui. The role
      # builds server_name from its own `subdomain`, so the two must
      # agree or the vhost is served with a mismatched certificate.
      - f2b
      - mail
      # The spam role renders a spam.<domain> vhost, so the fixture
      # has to cover it too or it describes a host whose certificate
      # does not match its own vhosts.
      - spam
      - status
      # The Valheim web map vhost, see roles/valheim. The role builds
      # server_name from its own `webmap.subdomain`, so the two must
      # agree or the vhost is served with a mismatched certificate.
      - valheim
      # The GoAccess report vhost, see roles/analytics. The role
      # builds server_name from its own `subdomain`, so the two must
      # agree or the vhost is served with a mismatched certificate.
      - weblog
      - www
  # nginx's status page for prometheus-nginx-exporter, loopback only.
  stub_status:
    enabled: true
    listen_address: 127.0.0.1
    port: 8080
    path: /stub_status
  sites:
    - name: default
      subdomains:
        - ""
        - www
      root: /var/www/html
      include_locations: true
    - name: status
      subdomains:
        - status
      root: /var/www/html
      include_locations: false
