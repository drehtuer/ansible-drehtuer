dns:
  vpn:
    # On, so the static tests render the branch that has something in
    # it. The off branch is the role default.
    enabled: true
    server:
      ip4: "{{ wireguard.server.ip4 }}"
      ip6: "{{ wireguard.server.ip6 }}"
    network:
      ip4: "{{ wireguard.network.ip4 }}"
      ip6: "{{ wireguard.network.ip6 }}"
