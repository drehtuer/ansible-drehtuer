cloud:
  mysql:
    nextcloud:
      database: nextcloud
      user: nextcloud
      password: test-nextcloud-password
    root:
      user: root
      password: test-root-password
  nextcloud:
    version: "34.0.4"
    checksum: >-
      00f226e6364f96e0918ab06157158f66601b8cedc25af777f5ee5a3056f42b83
    path: /var/www/nextcloud
    cron_minute: "*/5"
    data_dir: /var/www/nextcloud/data
    admin:
      user: admin
      password: test-nextcloud-admin-password
    updater:
      keep_backups: 0
    upgrade:
      dump_dir: /var/backups/nextcloud
      repair_commands:
        - db:add-missing-indices
        - db:add-missing-columns
        - db:add-missing-primary-keys
    log_rotate_size: 104857600
  push:
    port: 7867
  mail:
    enabled: true
    classify_importance: false
  ocr:
    languages:
      - eng
      - deu
  redis:
    dbindex: 1
    timeout: 1.5
  php:
    memory_limit: 512M
    opcache:
      enable: 1
      interned_strings_buffer: 12
      memory_consumption: 128
    pool:
      max_children: 5
      start_servers: 2
      min_spare_servers: 1
      max_spare_servers: 3
