cloud:
  mysql:
    nextcloud:
      database: nextcloud
      user: nextcloud
      password: test-nextcloud-password
    root:
      user: root
      password: test-root-password
  nextcloud:
    version: "35.0.2"
    checksum: >-
      dfc7955eaec5621de90e031d10f76006173b3f3e31d5d6e174821d1da14f162d
    path: /var/www/nextcloud
    cron_minute: "*/5"
    data_dir: /var/www/nextcloud/data
    admin:
      user: admin
      password: test-nextcloud-admin-password
    updater:
      keep_backups: 0
    integrity:
      max_passes: 120
      cleanup_prefixes:
        - 3rdparty
        - core
        - dist
        - lib
        - ocs
    upgrade:
      dump_dir: /var/backups/nextcloud
      repair_commands:
        - db:add-missing-indices
        - db:add-missing-columns
        - db:add-missing-primary-keys
    log_rotate_size: 104857600
  push:
    port: 7867
  apps:
    - calendar
    - checksum
    - contacts
    - files_pdfviewer
    - files_sharing
    - gpoddersync
    - mail
    - music
    - tasks
  mail:
    classify_importance: false
  # How Nextcloud itself sends mail; see roles/cloud/defaults.
  smtp:
    host: 127.0.0.1
    port: 25
    tls_name: "mail.{{ domain }}"
    from_address: nextcloud
    domain: "{{ domain }}"
  ocr:
    languages:
      - eng
      - deu
  redis:
    dbindex: 1
    timeout: 1.5
  php:
    memory_limit: 512M
    opcache:
      enable: 1
      interned_strings_buffer: 12
      memory_consumption: 128
    pool:
      max_children: 5
      start_servers: 2
      min_spare_servers: 1
      max_spare_servers: 3
