# Mirrors the role defaults, because the static tests render
# templates from this inventory alone - without role defaults - so
# anything a template reads has to be defined here or the render
# fails.
monitoring:
  subdomain: status
  prometheus:
    path: /prometheus/
    listen_address: 127.0.0.1
    port: 9090
    scrape_interval: 15s
    evaluation_interval: 15s
    retention_time: 90d
    retention_size: 8GB
    config_file: /etc/prometheus/prometheus.yml
    # Upstream release rather than the distro package: the packaged
    # server ships no modern web UI. See roles/monitoring/tasks.
    version: "3.14.0"
    checksums:
      amd64: f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d
      arm64: 077f3781ab7245dc04c9a3c9b78ba120fc8e41aa0dc97489b0af67247e50ba83
    install_dir: /opt
    data_dir: /var/lib/prometheus/metrics2
    rules_dir: /etc/prometheus/rules
  # Textfile collectors: fail2ban's jail counters (failed SSH logins
  # among them) and the packet filter's own per-rule counters.
  textfile:
    fail2ban:
      enabled: true
      interval: 1min
    packetfilter:
      enabled: true
      interval: 1min
    # Zone serials, what the delegated nameservers are actually
    # serving, and DNSSEC signature expiry. A coarse interval because
    # this is the one collector that queries off-host.
    nsd:
      enabled: true
      interval: 15min
    # The tunnel: whether the interface is up, and when each device
    # last completed a handshake. Nothing else on this host measures
    # either - wg-quick's unit being active says the interface was
    # created, not that a peer can reach it.
    wireguard:
      enabled: true
      interval: 1min
  # Per-service exporters, all on loopback. Ports are the exporters'
  # own defaults; what is wired here is which ones this host runs and
  # the two secrets that come from elsewhere rather than being
  # duplicated.
  exporters:
    listen_address: 127.0.0.1
    nginx:
      enabled: true
      port: 9113
      # Must match http.stub_status.
      status_url: http://127.0.0.1:8080/stub_status
    mysqld:
      enabled: true
      port: 9104
      user: prometheus
      socket: /var/run/mysqld/mysqld.sock
      my_cnf: /etc/prometheus/mysqld-exporter.my.cnf
      # Creating the account needs root; the credentials come from the
      # database role's own variables rather than a second copy here.
      root_user: "{{ database.mysql.root.user }}"
      root_password: "{{ database.mysql.root.password }}"
    redis:
      enabled: true
      port: 9121
      addr: redis://127.0.0.1:6379
    postfix:
      enabled: true
      port: 9154
      logfile: /var/log/mail.log
      showq: /var/spool/postfix/public/showq
    # Dovecot exports its own metrics; this port must match
    # imap.metrics.port, which is a role default rather than an
    # inventory value and so cannot be referenced from here.
    dovecot:
      enabled: true
      port: 9166
    # As does RSpamd, on its controller port and behind its controller
    # password - both taken from the spam role rather than copied.
    rspamd:
      enabled: true
      port: "{{ spam.http_port }}"
      password: "{{ spam.controller_password }}"
  # End-to-end probes. Everything else here measures a service from
  # the inside; this asks whether the name answers, with the right
  # certificate, from a client's side of the socket. Certificate
  # expiry comes with it, measured where each certificate is *served*.
  blackbox:
    enabled: true
    listen_address: 127.0.0.1
    port: 9115
    config_file: /etc/prometheus/blackbox.yml
    timeout: 5s
    web:
      public:
        - ""
        - www
        - mail
        - cloud
      guarded:
        - spam
        - f2b
        - status
    mail:
      host: "mail.{{ domain }}"
      starttls_ports:
        - 25
        - 587
      imaps_ports:
        - 993
    dns:
      authoritative:
        enabled: true
        # NSD binds the public addresses; unbound has loopback.
        server: "{{ ip_v4 }}:53"
        # Taken from the nsd role's own zone list rather than a second
        # copy, the same wiring the mysqld and rspamd exporters use.
        zones: "{{ nsd.zones | map(attribute='name') | list }}"
        # The VPN endpoint, both families. Every peer configuration
        # names it rather than an address, so the record missing is
        # the tunnel unreachable - and no zone check sees that: the
        # zone kept answering its SOA correctly throughout, which is
        # exactly how these records were absent from the deployed
        # zone from 2026-08-23 until they were noticed on 2026-08-24.
        records:
          - {name: "vpn.{{ domain }}", type: A}
          - {name: "vpn.{{ domain }}", type: AAAA}
      recursive:
        enabled: true
        server: 127.0.0.1:53
        query_name: one.one.one.one
  alertmanager:
    listen_address: 127.0.0.1
    port: 9093
    config_file: /etc/prometheus/alertmanager.yml
    mail:
      smarthost: 127.0.0.1:25
      from: "monitoring@{{ domain }}"
      to: "root@{{ domain }}"
      require_tls: false
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 24h
    resolve_timeout: 5m
    watchdog_interval: 24h
  node_exporter:
    listen_address: 127.0.0.1
    port: 9100
    collectors:
      - systemd
    textfile_dir: /var/lib/prometheus/node-exporter
  grafana:
    image: grafana/grafana-oss
    tag: "13.0.2"
    # The real digest rather than a placeholder: it is public
    # information, and a fake would stop this being a working example
    # of what the role expects.
    digest: >-
      sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    compose_dir: /etc/grafana
    data_dir: /opt/grafana
    uid: 472
    listen_address: 127.0.0.1
    port: 3000
    admin_user: admin
    admin_password: test-grafana-admin-password
    datasource_uid: prometheus
  alerts:
    # Per-service thresholds, generous on purpose: they exist to catch
    # a state that persists rather than to report a busy hour.
    backup:
      # roles/backup writes these; nothing else does. Off for a host
      # that does not run it, since an alert on a metric no exporter
      # produces can never fire and reports nothing wrong forever.
      enabled: true
      # 36h rather than 24 for a daily backup: the timer carries a
      # randomized delay and Persistent=true catches up after a
      # reboot, so a day and a half is the first figure that means
      # something went wrong rather than something ran late.
      stale_hours: 36
      unverified_days: 10
    services:
      deferred_queue: 50
      auth_failures_per_minute: 30
    zones:
      propagation_for: 1h
    probes:
      cert_expiry_warning_days: 14
      cert_expiry_critical_days: 5
      cert_skew_hours: 24
    disk:
      warning_percent: 10
      critical_percent: 5
      predict_window: 6h
      predict_horizon_days: 4
      predict_below_percent: 30
    inodes:
      warning_percent: 10
    memory:
      available_percent: 10
    load:
      per_cpu: 2.0
    clock:
      max_offset_seconds: 0.05
    network:
      # A literal here rather than the default-route fact, so the
      # static tests do not depend on the machine they run on. Same
      # reasoning as firewall.docker.wan_interface in this tree.
      interface: eth0
      egress_mbit: 500
      ingress_mbit: 800
      window: 15m
