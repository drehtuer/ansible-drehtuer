firewall:
  rate_limit:
    seconds: 10
    hitcount: 10
  docker:
    # carcosa runs Docker, so the DOCKER-USER chain is managed.
    enabled: true
    wan_interface: "{{ ansible_facts['default_ipv4'].interface }}"
    # Anything forwarded in from the internet is dropped until a port
    # is listed here. Empty is the correct state while no container
    # publishes a port: `DOCKER-USER` then drops everything arriving
    # on wan_interface, which is what makes `docker run -p` safe by
    # default rather than exposed. The list is what admits container
    # traffic, not `rules` below - a published port is DNATed and
    # traverses FORWARD, so the INPUT allow-list never sees it. The
    # Satisfactory server was the one entry here and was removed on
    # 2026-09-13 with the game server itself; `roles/valheim` is what
    # put entries back.
    #
    # Note what is deliberately *not* also added to `rules.udp` below:
    # nothing. The Satisfactory episode ended by removing exactly those
    # duplicate INPUT rules, having established they never admitted a
    # byte of the traffic they appeared to be for. Listing a published
    # port in both places looks thorough and only makes the chain that
    # matters harder to find.
    published:
      tcp: []
      udp:
        # The Valheim dedicated server, roles/valheim. Three
        # consecutive ports and all three are needed: 2456 is the
        # game, 2457 is Steam's query port - without it the server
        # answers nothing the client asks before connecting - and 2458
        # is the RPC port mods use, which WebMap is. Opening only the
        # first two gives a server that plays fine and a map nobody
        # can load.
        #
        # The map's own port is absent on purpose: it is published to
        # 127.0.0.1, so it never arrives on wan_interface and nginx is
        # the only route to it.
        - port: 2456
          comment: "Valheim game (roles/valheim)"
        - port: 2457
          comment: "Valheim Steam query (roles/valheim)"
        - port: 2458
          comment: "Valheim mod RPC, needed by WebMap (roles/valheim)"
  wireguard:
    # carcosa terminates the VPN, so wg0 traffic is forwarded and
    # masqueraded and the nat table is emitted. Values come from the
    # `wireguard` dict rather than being repeated, so the ranges the
    # tunnel hands out and the ranges that get masqueraded cannot
    # drift apart.
    enabled: true
    interface: "{{ wireguard.interface }}"
    wan_interface: "{{ ansible_facts['default_ipv4'].interface }}"
    network:
      ip4: "{{ wireguard.network.ip4 }}"
      ip6: "{{ wireguard.network.ip6 }}"
    listen_port: "{{ wireguard.listen_port }}"
    redirect_port: "{{ wireguard.redirect_port }}"
  rules:
    tcp:
      - port: 22
        comment: "SSH"
        rate_limit: true
      - port: 25
        comment: "SMTP(s)"
      - port: 80
        comment: "HTTP"
      - port: 443
        comment: "HTTPS"
      - port: 587
        comment: "SMTP(s) Submission"
      - port: 993
        comment: "IMAPS"
      - port: 3478
        comment: "TURN for Nextcloud Talk (roles/talk)"
      # DNS over TCP, which is not optional for an authoritative
      # server: AXFR is TCP-only, so without this Hetzner's
      # secondaries cannot transfer the zone at all, and any answer
      # too large for UDP is retried over TCP.
      - port: 53
        comment: "DNS (TCP - AXFR and large answers)"
    udp:
      - port: 53
        comment: "DNS"
      - port: 3478
        comment: "TURN for Nextcloud Talk (roles/talk) - the media path"
      # The tunnel itself. udp/443 is not listed: it is redirected to
      # this port in the nat table, and the redirect happens before
      # the filter table sees the packet, so a rule for 443 would
      # never match.
      - port: 51820
        comment: "WireGuard (roles/wireguard)"
