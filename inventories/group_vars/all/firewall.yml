firewall:
  rate_limit:
    seconds: 10
    hitcount: 10
  docker:
    # carcosa runs Docker, so the DOCKER-USER chain is managed.
    enabled: true
    wan_interface: "{{ ansible_facts['default_ipv4'].interface }}"
    # Anything forwarded in from the internet is dropped until a port
    # is listed here. The Satisfactory server publishes its ports
    # rather than using host networking, so its traffic is DNATed and
    # is disposed of in this chain - the matching `rules` entries
    # below never see it, and these are what actually let it in.
    published:
      tcp:
        - port: 7777
          comment: "Satisfactory game server"
        - port: 8888
          comment: "Satisfactory game server"
      udp:
        - port: 7777
          comment: "Satisfactory game server"
  wireguard:
    # carcosa terminates the VPN, so wg0 traffic is forwarded and
    # masqueraded and the nat table is emitted. Values come from the
    # `wireguard` dict rather than being repeated, so the ranges the
    # tunnel hands out and the ranges that get masqueraded cannot
    # drift apart.
    enabled: true
    interface: "{{ wireguard.interface }}"
    wan_interface: "{{ ansible_facts['default_ipv4'].interface }}"
    network:
      ip4: "{{ wireguard.network.ip4 }}"
      ip6: "{{ wireguard.network.ip6 }}"
    listen_port: "{{ wireguard.listen_port }}"
    redirect_port: "{{ wireguard.redirect_port }}"
  rules:
    tcp:
      - port: 22
        comment: "SSH"
        rate_limit: true
      - port: 25
        comment: "SMTP(s)"
      - port: 80
        comment: "HTTP"
      - port: 443
        comment: "HTTPS"
      - port: 587
        comment: "SMTP(s) Submission"
      - port: 993
        comment: "IMAPS"
      - port: 3478
        comment: "TURN for Nextcloud Talk (roles/talk)"
      # DNS over TCP, which is not optional for an authoritative
      # server: AXFR is TCP-only, so without this Hetzner's
      # secondaries cannot transfer the zone at all, and any answer
      # too large for UDP is retried over TCP.
      - port: 53
        comment: "DNS (TCP - AXFR and large answers)"
      - port: 7777
        comment: "Satisfactory game server"
      - port: 8888
        comment: "Satisfactory game server"
    udp:
      - port: 53
        comment: "DNS"
      - port: 3478
        comment: "TURN for Nextcloud Talk (roles/talk) - the media path"
      # The tunnel itself. udp/443 is not listed: it is redirected to
      # this port in the nat table, and the redirect happens before
      # the filter table sees the packet, so a rule for 443 would
      # never match.
      - port: 51820
        comment: "WireGuard (roles/wireguard)"
      # The game's own traffic. 8888 is TCP-only, so it has no
      # counterpart here.
      - port: 7777
        comment: "Satisfactory game server"
