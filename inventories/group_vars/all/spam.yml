# Promoted out of roles/spam/defaults/main.yml so that spam.milter_port
# and spam.http_port are in scope for playbooks/mail.yml and
# playbooks/imap.yml too - each playbook runs a single role, and role
# defaults are only in scope for the play that actually runs that role.
spam:
  controller_password: !vault |
    $ANSIBLE_VAULT;1.1;AES256
    39323639613436353763633965613234383233323034343331653637316435303234383466633966
    3164303962653530313236313265616464623135613930630a333461333838646432643739623132
    63653262646363383331373133383737373730363334323064643862313561653735343836303930
    3239363233393062650a303938373733393261613962386537326661333638356631353138363764
    61346239316135316434396630363432663866626165373633326562666537303333
  dkim:
    # Rotated from `mail` on 2026-08-16. One selector covers every
    # served domain, so this rotates both at once - which is the point
    # of it being a single setting: the signing config cannot drift out
    # of step with the keys on disk.
    #
    # The rotation was forced by drehtuer.net, whose `mail` key is
    # ed25519 - generated before the role settled on RSA, and never
    # replaced afterwards because the generator refuses to regenerate an
    # existing key. Gmail, Microsoft 365 and Yahoo do not verify
    # ed25519-sha256 at all (Gmail answers `dkim=neutral (no key)`), so
    # under DMARC p=reject that domain had no usable DKIM at the three
    # largest receivers and DMARC rested entirely on SPF - which is
    # exactly what forwarding breaks.
    #
    # Dated rather than a bare counter, so the next rotation is obvious
    # and the records sort. Leading letter because a DNS label starting
    # with a digit still trips some tooling.
    #
    # Changing this is a three-step operation, not an edit: generate the
    # keys, publish the records *alongside* the old ones, and only then
    # point signing at them. Doing it in one step signs mail against a
    # record that is not published yet.
    selector: s202608
    bits: 2048
  milter_port: 11332
  http_port: 11334
  # The local fuzzy storage worker. The port is RSpamd's own default
  # for `worker "fuzzy"`, repeated here because the fuzzy_check rule
  # that queries it has to name the same one - see
  # roles/spam/templates/rspamd/worker-fuzzy.inc.j2 for why the bind
  # side is left to RSpamd.
  fuzzy_port: 11335
  # Which fuzzy flag this host's own hashes are stored under. Read by
  # roles/imap too: its learn scripts post this flag to /fuzzyadd and
  # /fuzzydel, and a value that disagrees with the fuzzy_check rule
  # stores hashes nothing ever looks up, silently. Numbered away from
  # the 1/2/3 the public rspamd.com rule uses so the two are never
  # confused in a log line.
  fuzzy_flag: 11
