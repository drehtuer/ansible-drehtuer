# The test hosts serve a zone per fictional domain, so the role can be
# exercised without touching anything real. No secondary will ever pull
# them.
#
# Two zones rather than one, mirroring production: `lab.lan` stands in
# for the primary domain and `lab.test` for the alias domain, each with
# its own transfer key. That is what makes a deploy here exercise the
# multi-zone, one-key-per-zone path rather than the single-zone one.
nsd:
  listen:
    - "{{ ip_v4 }}"
  # Overriding the role's top-level dict replaces its defaults, so
  # every required key has to be repeated - see doc/STATUS.adoc.
  # The host itself, so a test can actually complete a transfer and the
  # TSIG check is what decides the outcome. Pointed at an address that
  # can never connect - a documentation-range one, say - every attempt
  # would be refused on source address before the key was even looked
  # at, and a broken key would pass the test.
  secondaries:
    - "{{ ip_v4 }}"
  # Same target as the transfer ACL: the lab has one peer and no
  # IPv4/IPv6 split to model.
  notify:
    - "{{ ip_v4 }}"
  rrl:
    size: 1000000
    ratelimit: 200
    whitelist_ratelimit: 2000
  # Boot ordering and restart tolerance for nsd.service, rendered into
  # a drop-in. The packaged unit starts before any address is
  # configured and gives up in under a second; see
  # roles/nsd/templates/boot-order.conf.j2.
  systemd:
    restart_sec: 5
    start_limit_burst: 12
    start_limit_interval_sec: 300
  propagation:
    check: true
    retries: 10
    delay: 6
  dnssec:
    enabled: false
    key_dir: /etc/nsd/keys
    signature_validity: 2592000
    resign:
      on_calendar: "Sun *-*-* 04:20:00"
      randomized_delay: 3600
    min_signature_days: 7
  zones:
    - name: "{{ domain }}"
      ttl: 3600
      serial: 2026081501
      # Throwaway secret: the lab has no real secondaries, and this
      # exists so the TSIG path is the one actually exercised in
      # testing rather than the NOKEY fallback. The key *name* follows
      # the shape Hetzner imposes in production ("<zone>.<primary-ip>."),
      # so the lab proves that shape parses rather than a simpler one.
      tsig:
        name: "{{ domain }}.{{ ip_v4 }}."
        algorithm: hmac-sha256
        secret: dGVzdC10c2lnLXNlY3JldC1ub3QtdXNlZC1hbnl3aGVyZQ==  # NOSONAR
      soa:
        primary: "{{ hostname_fqdn }}."
        contact: "postmaster.{{ domain }}."
        refresh: 86400
        retry: 10800
        expire: 3600000
        minimum: 3600
      nameservers:
        - "{{ hostname_fqdn }}."
      records:
        - {name: "@", type: A, value: "{{ ip_v4 }}"}
        - {name: mail, type: A, value: "{{ ip_v4 }}"}
        - {name: www, type: CNAME, value: "{{ domain }}."}
    # The alias domain, as its own zone with its own key - a different
    # secret, not only a different name, so that a run here would catch
    # the template emitting one zone's key for another.
    - name: "{{ domain_aliases[0] }}"
      ttl: 3600
      serial: 2026081601
      tsig:
        name: "{{ domain_aliases[0] }}.{{ ip_v4 }}."
        algorithm: hmac-sha256
        secret: bGFiLWFsaWFzLXRzaWctc2VjcmV0LW5vdC1yZWFsLWVpdGhlcg==  # NOSONAR
      soa:
        primary: "{{ hostname_fqdn }}."
        contact: "postmaster.{{ domain_aliases[0] }}."
        refresh: 86400
        retry: 10800
        expire: 3600000
        minimum: 3600
      nameservers:
        - "{{ hostname_fqdn }}."
      records:
        - {name: "@", type: A, value: "{{ ip_v4 }}"}
        - {name: mail, type: A, value: "{{ ip_v4 }}"}
        - {name: www, type: CNAME, value: "{{ domain_aliases[0] }}."}
