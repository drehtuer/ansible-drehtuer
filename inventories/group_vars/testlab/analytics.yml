# Mirrors roles/analytics/defaults/main.yml, because an inventory dict
# REPLACES the role default rather than merging into it. See
# doc/STATUS.adoc.
#
# Same shape as the production group_vars, so a deploy here exercises
# the real code path rather than a simplified one.
analytics:
  access_log: /var/log/nginx/access.log
  rotations: 14
  report_dir: /var/www/analytics
  report_file: index.html
  title: "{{ domain }} web traffic"
  subdomain: weblog
  ignore_crawlers: true
  anonymize_ip: true
  # The lab probes itself exactly as production does, and its logs are
  # otherwise empty - so without this the report here would be nothing
  # but monitoring.
  exclude_ips:
    - "{{ ip_v4 }}"
    - "{{ ip_v6 }}"
  # Off on the lab, and it has to be: the credentials are production's
  # and this is the machine that must never hold them. The report
  # simply renders without a Geo Location panel, which is the branch
  # of the script worth exercising here anyway.
  geoip:
    enabled: false
    account_id: ""
    license_key: ""
    editions:
      - GeoLite2-Country
    database_dir: /var/lib/GeoIP
    report_editions:
      - GeoLite2-Country
  schedule:
    on_calendar: "*:20"
    randomized_delay: 1m
