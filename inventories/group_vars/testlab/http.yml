# Same shape as the production host_vars, so a deploy here exercises
# the real multi-domain code path rather than a simplified one.
#
# `lab.sh seed-certs` derives the certificate names from exactly these
# values, so the self-signed certificate it installs matches what the
# http role asks certbot for - which is what makes the role's SAN
# comparison decide there is nothing to do and skip certbot. Change
# `domains` or `subdomains` and the certificate has to be re-seeded.
http:
  port_http: 80
  port_https: 443
  domains: "{{ [domain] + domain_aliases }}"
  letsencrypt:
    # Never used: certbot is not reached on this machine.
    email: postmaster@lab.lan
    webroot_path: /var/www/certbot
    cert_name: "{{ hostname_fqdn }}"
    subdomains:
      - cloud
      # The fail2ban web UI vhost, see roles/fail2ban_ui. The role
      # builds server_name from its own `subdomain`, so the two must
      # agree or the vhost is served with a mismatched certificate.
      - f2b
      - mail
      - spam
      - status
      # The GoAccess report vhost, see roles/analytics. The role
      # builds server_name from its own `subdomain`, so the two must
      # agree or the vhost is served with a mismatched certificate.
      - stats
      - www
  # nginx's status page for prometheus-nginx-exporter, loopback only.
  stub_status:
    enabled: true
    listen_address: 127.0.0.1
    port: 8080
    path: /stub_status
  sites:
    - name: default
      subdomains:
        - ""
        - www
      root: /var/www/html
      include_locations: true
    # `status` is deliberately absent: roles/monitoring serves that
    # name now. See the matching comment in the production host_vars.
    - name: mail
      subdomains:
        - mail
      root: /var/www/html
      include_locations: false
