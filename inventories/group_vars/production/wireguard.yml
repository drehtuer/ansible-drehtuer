  36336133383464646138616133616563636365336239383132326433386265663832653161363664
  6634303065646335383532333338393264353039353165656264

# One entry per device. This is the whole of what the repository knows
# about a peer: a public key and a preshared key, neither of which
# decrypts anything on its own. The private half lives on the device
# and nowhere else.
#
# These three were written by roles/wireguard/scripts/new-peer-local.sh
# because neither a Windows machine nor a phone can run new-peer.sh on
# itself; it generates the configuration on the controller, leaves it
# in the gitignored roles/wireguard/keys/, and prints the entry below.
# A device that can run new-peer.sh should still use it.
#
# Addresses are handed out in order; .1/::1 is the server itself. Two
# peers sharing one is refused by the role rather than by wg(8), which
# would simply stop delivering traffic to the second.
wireguard_peers:
