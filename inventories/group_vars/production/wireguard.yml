# The tunnel's server key.
#
# Generated on the controller rather than on the host, which is the
# same stance roles/sshd/scripts/generate_keys.sh takes: a rebuilt
# carcosa keeps its tunnel identity, so no peer has to be
# reconfigured afterwards.
#
# Replace it by re-running roles/wireguard/scripts/generate_keys.sh
# and pasting the block it prints - but note that this is no longer a
# self-contained change: every device's configuration names this key's
# public half, so rotating it means editing that line on each of them,
# and there is no copy here to edit it in.
wireguard_server_private_key: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  37306337303538366163643030393661333564313562616363353739366135613639353138373732
  3036373261353466643266373462646639376564303638380a343233626134653739356634656437
