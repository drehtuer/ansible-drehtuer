# Mirrors roles/analytics/defaults/main.yml, because an inventory dict
# REPLACES the role default rather than merging into it. See
# doc/STATUS.adoc.
analytics:
  access_log: /var/log/nginx/access.log
  rotations: 14
  report_dir: /var/www/analytics
  report_file: index.html
  title: "{{ domain }} web traffic"
  subdomain: weblog
  ignore_crawlers: true
  anonymize_ip: true
  # This host's own addresses, and on this host it is not a nicety.
  # roles/monitoring's blackbox exporter probes eight public names
  # every 15 seconds from the machine itself, and those requests reach
  # nginx from its own public address like anyone else's: measured on
  # 2026-09-13, 75274 of the day's 82018 logged requests - 92% - were
  # the host probing itself. A report without this line describes the
  # monitoring rather than the visitors.
  exclude_ips:
    - "{{ ip_v4 }}"
    - "{{ ip_v6 }}"
  # Geolocation is on here: this host has a MaxMind account, and the
  # credentials below are the whole of what it needs.
  geoip:
    enabled: true
    account_id: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      37626431386363346637383061333138393730393538643065366634306361353634656238393732
      6566323763323235303535323265613831663032653432330a303666313462323866613639313838
      62383734356661326132663266346166346235323436363265383362333932663132356636346139
      6535633930623638610a323635623533613964373962306461643132626138326335643761393036
      3136
    license_key: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      61386138316130633533643135393633346463666166393238626563396565303932616661396339
      3966643736396238396433646234376239633635356539390a633461626461333530316563323663
      33326564646232653939656235643731363864613136393334303265383763656637336136323330
      6330663461346164350a623738326238343530626136346131613932653736343630383936356138
      38626233396334313533613832303161323536303362303038363230613062616239326161366263
      3764633262306134636630633761623461363237316533306338
    # All three editions the account is entitled to, as MaxMind's own
    # GeoIP.conf listed them. Only GeoLite2-Country is read by the
    # report; the other two cost a download each Wednesday and
    # Saturday and are there to be used without a second sign-up -
    # GeoLite2-City is much the largest of them. Trim this list if
    # that trade stops being worth it.
    # GeoLite2-Country is deliberately absent: the City database
    # carries the same country data, so downloading both meant
    # fetching 8.2 MB twice a week to answer a question the 63 MB file
    # beside it already answered. Everything downloaded here is read.
    editions:
      - GeoLite2-ASN
      - GeoLite2-City
    database_dir: /var/lib/GeoIP
    # Country for the Geo Location panel, ASN for the network behind
    # each visitor - which is what distinguishes a hosting provider
    # scanning the site from somebody reading it, and the database was
    # already being downloaded for nothing.
    # City first, and the order is load-bearing - see the assert in
    # the role, and doc/STATUS.adoc for what it costs to get wrong.
    report_editions:
      - GeoLite2-City
      - GeoLite2-ASN
  schedule:
    on_calendar: "*:20"
    randomized_delay: 1m
