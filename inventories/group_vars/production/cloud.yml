  nextcloud:
    # Pinned rather than tracking `latest`, so a rebuild produces the
    # same version and the checksum can be verified. Bumping this does
    # not upgrade an existing installation - that needs `occ upgrade`,
    # which is not automated yet (doc/TODO.adoc).
    version: "34.0.3"
    checksum: "d7ed36ac0e14a2d9bbd167d6f6d4fc498f0f39fcccdf304e67e35bfc42e4506d"
    path: /var/www/nextcloud
    cron_minute: "*/5"
    # Overriding `cloud` replaces the role default wholesale, so
    # this key has to be repeated here too. Unset means no rotation.
    data_dir: /var/www/nextcloud/data
    admin:
      user: admin
      password: !vault |
        $ANSIBLE_VAULT;1.1;AES256
        35373337376538666233626565626562333737626634653937663136643536373763323739643932
        3062373234303163626363363365616165663532393136320a323764613637386331376536306131
        31363239666335653430623465363966353462383661366434613663373365353964646639643761
        3633313834643937310a313236376338666265613039356463663533636632613063643435356232
        30626438636263313532356634393261363234353565303838636662393832353966643666646231
        6661376131613030363639666132643432666238353830613237
    # Nextcloud's own updater copies the whole installation to
    # data/updater-<instanceid>/backups/ before an upgrade and never
    # removes one: three had built up here at 1.7 GB each, the oldest
    # for an upgrade completed 2026-06-04. Zero keeps none - the
    # release is pinned and re-extractable, `upgrade.dump_dir` below
    # holds the pre-upgrade dump, and the backup role snapshots the
    # host nightly.
    #
    # Overriding `cloud` replaces the role default wholesale, so this
    # key has to be repeated here too.
    updater:
      keep_backups: 0
    upgrade:
      dump_dir: /var/backups/nextcloud
      repair_commands:
        - db:add-missing-indices
        - db:add-missing-columns
        - db:add-missing-primary-keys
    log_rotate_size: 104857600
  push:
    port: 7867
  # Off, after the Mail app's importance classifier was found tagging
  # inbound mail with the IMAP keyword `$label1` - which Thunderbird
  # renders as its own "Important" tag. See doc/STATUS.adoc.
  mail:
    classify_importance: false
  ocr:
    # Tesseract training data for OCRmyPDF, one package per language.
    languages:
      - eng
      - deu
  redis:
    # Host and port come from database.redis; index 0 holds RSpamd's
    # data, so Nextcloud gets one of its own.
    dbindex: 1
    timeout: 1.5
  php:
    memory_limit: 512M
    opcache:
      enable: 1
      interned_strings_buffer: 12
      memory_consumption: 128
    pool:
      max_children: 5
      start_servers: 2
      min_spare_servers: 1
      max_spare_servers: 3
