http:
  port_http: 80
  port_https: 443
  # Derived from the host facts in inventories/machines.yml: the
  # primary `domain` plus every entry in `domain_aliases`. Adding a
  # domain there extends the certificate, every static vhost, the
  # cloud and spam vhosts and Postfix's virtual aliases at once.
  # Every name has to resolve to this host before the next run, or
  # certbot's challenge fails for it and takes the whole certificate
  # with it. See doc/STATUS.adoc.
  domains: "{{ [domain] + domain_aliases }}"
  letsencrypt:
    email: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      33326530333866353834303138386134346361333534616361336561663665633532663665376633
      3637363731333863386636663561373236313531353035340a633731363762313335353565396332
      36383539353532643133643839376332646164643531393763633134363465353130333633326136
      6461346638353536350a633433666635666461376234393063666630366338393962363038643632
      39313831353235346536663765383838393334613938393830303137383863666562
    webroot_path: /var/www/certbot
    # Keep in step with what mail/imap read from
    # /etc/letsencrypt/live/<cert_name>/.
    cert_name: "{{ hostname_fqdn }}"
    subdomains:
      - cloud
      # The fail2ban web UI vhost, see roles/fail2ban_ui. The role
      # builds server_name from its own `subdomain`, so the two must
      # agree or the vhost is served with a mismatched certificate.
      - f2b
      - mail
      - spam
      - status
      # roles/talk serves the signaling WebSocket here. Must match
      # talk.subdomain or the vhost gets a certificate that does not
      # cover it.
      - talk
      # The Valheim web map vhost, see roles/valheim. The role builds
      # server_name from its own `webmap.subdomain`, so the two must
      # agree or the vhost is served with a mismatched certificate.
      - valheim
      # The GoAccess report vhost, see roles/analytics. The role
      # builds server_name from its own `subdomain`, so the two must
      # agree or the vhost is served with a mismatched certificate.
      - weblog
      - www
  # nginx's status page for prometheus-nginx-exporter, loopback only.
  stub_status:
    enabled: true
    listen_address: 127.0.0.1
    port: 8080
    path: /stub_status
  sites:
    - name: default
      subdomains:
        - ""
        - www
      root: /var/www/html
      include_locations: true
    # `status` is deliberately absent: roles/monitoring serves that
    # name now. It stays in letsencrypt.subdomains above, since the
    # certificate still has to cover it. Note that dropping a site
    # from this list does not remove the vhost the http role already
    # wrote - roles/monitoring deletes that file itself.
    - name: mail
      subdomains:
        - mail
      root: /var/www/html
      include_locations: false
