argument_specs:
  main:
    short_description: Nextcloud on nginx, PHP-FPM and MariaDB
    description:
      - Creates the Nextcloud database and user, installs a pinned
        Nextcloud release, and adds its own PHP-FPM pool, nginx
        upstream and vhost. Runs the installer on a host that has none,
        and upgrades one whose pinned version has moved on - taking a
        database dump first, since the schema migration is the part
        that re-extracting files cannot undo.
    options:
      http:
        type: dict
        required: true
        description:
          - Shared HTTP settings, owned by the http role. This vhost
            reads `http.port_https` and `http.domains`, serving
            cloud.<domain> for each, and `http.sites` to work out
            which static vhosts also expose /nextcloud.
          - Deliberately declared without suboptions. Listing them
            would make validation reject every other key the http role
            puts in this dict, which fails the role outright.
      database:
        type: dict
        required: true
        description:
          - Shared with the database role, only database.redis.ip4 and
            database.redis.port are read here. Deliberately declared
            without suboptions - listing them would make validation
            reject every other key the database role itself requires.
      cloud:
        type: dict
        required: true
        description: Nextcloud settings.
        options:
          mysql:
            type: dict
            required: true
            description: Database settings.
            options:
              nextcloud:
                type: dict
                required: true
                description: Nextcloud's own database and account.
                options:
                  database:
                    type: str
                    required: true
                    description: Database name.
                  user:
                    type: str
                    required: true
                    description: Database user.
                  password:
                    type: str
                    required: true
                    description: Database password.
              root:
                type: dict
                required: true
                description: Credentials used to create the above.
                options:
                  user:
                    type: str
                    required: true
                    description: MariaDB administrative user.
                  password:
                    type: str
                    required: true
                    description: MariaDB administrative password.
          nextcloud:
            type: dict
            required: true
            description: Release and installation settings.
            options:
              version:
                type: str
                required: true
                description: Pinned release, e.g. 34.0.3.
              checksum:
                type: str
                required: true
                description: SHA-256 of the release tarball.
              path:
                type: str
                required: true
                description: Installation directory.
              cron_minute:
                type: str
                required: true
                description: Cron schedule for the background job.
              data_dir:
                type: str
                required: true
                description:
                  - Where user files live. On this host it sits inside
                    the installation directory, which is why the upgrade
                    extracts over the top and deletes nothing.
              admin:
                type: dict
                required: true
                description:
                  - First-run installer credentials, used only when
                    config/config.php is absent.
                options:
                  user:
                    type: str
                    required: true
                    description: Administrator account to create.
                  password:
                    type: str
                    required: true
                    description:
                      - Its password. The role refuses to install with
                        an empty one rather than creating an
                        administrator anybody could log in as.
              updater:
                type: dict
                required: true
                description:
                  - Housekeeping for Nextcloud's own updater, which is
                    not what this role uses to upgrade.
                options:
                  keep_backups:
                    type: int
                    required: true
                    description:
                      - How many of the updater's installation backups
                        under data/updater-<instanceid>/backups/ to
                        keep, newest first. The updater never removes
                        one itself. Zero keeps none.
              upgrade:
                type: dict
                required: true
                description: Upgrade behaviour.
                options:
                  dump_dir:
                    type: str
                    required: true
                    description:
                      - Where the pre-upgrade database dump is written.
                        The schema migration is the part of an upgrade
                        that cannot be undone by re-extracting files.
                  repair_commands:
                    type: list
                    elements: str
                    required: true
                    description:
                      - occ commands run after a successful upgrade,
                        e.g. db:add-missing-indices.
              log_rotate_size:
                type: int
                required: true
                description:
                  - Bytes before Nextcloud rotates its own log. Unset
                    or zero disables rotation entirely, which is the
                    upstream default and leaves nextcloud.log growing
                    without bound - it lives in the data directory, so
                    nothing packaged rotates it either. Nextcloud keeps
                    one previous file, so the real ceiling is twice
                    this.
          push:
            type: dict
            required: true
            description:
              - Client Push (the notify_push app). Replaces 30-second
                polling by every connected client with one WebSocket
                that Nextcloud pushes over.
            options:
              port:
                type: int
                required: true
                description:
                  - Loopback port the daemon listens on; nginx proxies
                    /push/ to it.
          mail:
            type: dict
            required: true
            description:
              - The Nextcloud Mail app. Not installed by this role, but
                configured by it where it is present.
            options:
              classify_importance:
                type: bool
                required: true
                description:
                  - Whether Mail's importance classifier may tag
                    messages. It writes the IMAP keyword `$label1` onto
                    the message itself, so the effect is visible in
                    every other IMAP client - Thunderbird shows it as
                    "Important". Governs accounts created after it is
                    set; an existing account keeps its own column.
          ocr:
            type: dict
            required: true
            description: OCRmyPDF settings.
            options:
              languages:
                type: list
                elements: str
                required: true
                description:
                  - Tesseract language codes to install training data
                    for, e.g. eng, deu. One apt package each.
          redis:
            type: dict
            required: true
            description:
              - Nextcloud's use of the shared Redis instance. The host
                and port it connects to come from database.redis.
            options:
              dbindex:
                type: int
                required: true
                description: Logical Redis database to use.
              timeout:
                type: float
                required: true
                description: Connection timeout in seconds.
          php:
            type: dict
            required: true
            description: PHP settings for the Nextcloud pool.
            options:
              memory_limit:
                type: str
                required: true
                description: PHP memory_limit.
              opcache:
                type: dict
                required: true
                description: Opcache tuning.
                options:
                  enable:
                    type: int
                    required: true
                    description: opcache.enable.
                  interned_strings_buffer:
                    type: int
                    required: true
                    description: opcache.interned_strings_buffer, in MB.
                  memory_consumption:
                    type: int
                    required: true
                    description: opcache.memory_consumption, in MB.
              pool:
                type: dict
                required: true
                description: php-fpm process manager settings.
                options:
                  max_children:
                    type: int
                    required: true
                    description: pm.max_children.
                  start_servers:
                    type: int
                    required: true
                    description: pm.start_servers.
                  min_spare_servers:
                    type: int
                    required: true
                    description: pm.min_spare_servers.
                  max_spare_servers:
                    type: int
                    required: true
                    description: pm.max_spare_servers.
