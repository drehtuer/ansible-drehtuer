cloud:  # noqa: var-naming[no-role-prefix] - see doc/STATUS.adoc
  mysql:
    nextcloud:
      database: nextcloud
      user: nextcloud
      password: ""
    root:
      user: root
      password: ""
  nextcloud:
    # Pinned rather than tracking `latest`, so a rebuild produces the
    # same version and the checksum below can be verified.
    version: "34.0.3"
    checksum: "d7ed36ac0e14a2d9bbd167d6f6d4fc498f0f39fcccdf304e67e35bfc42e4506d"
    path: /var/www/nextcloud
    # Nextcloud's own recommendation for the background job.
    cron_minute: "*/5"
    # Bytes before nextcloud.log is rotated. Upstream's documented
    # value; unset - the state this replaces - means zero, which
    # disables rotation rather than picking a default, and is why the
    # log on carcosa reached 94 MB spanning over a year.
    #
    # Nextcloud keeps exactly one previous file, so the real ceiling is
    # twice this. That is deliberate at 100 MB: the log runs about
    # 95 MB a year here, so two generations is roughly two years of
    # history for 200 MB of disk.
    log_rotate_size: 104857600
    # Where user files live. Note this sits *inside* the installation
    # directory on the current host, which is what makes an upgrade
    # delicate: the release tarball never contains `data/`, so
    # unpacking over the top cannot touch it, but any scheme that
    # cleaned up stale files by deleting what the tarball does not
    # contain would delete every user's data. That is why the upgrade
    # below extracts over the top and removes nothing.
    data_dir: /var/www/nextcloud/data
    # First-run installer credentials. Only ever used when
    # config/config.php does not exist, i.e. once per host - after that
    # the account is Nextcloud's to manage and changing this does
    # nothing. Empty by default so the role cannot silently create an
    # administrator with a guessable password.
    admin:
      user: admin
      password: ""
    updater:
      # How many of Nextcloud's *own* updater backups to keep. The
      # updater copies the whole installation to
      # data/updater-<instanceid>/backups/ before each upgrade and
      # never prunes them: three had built up on carcosa at 1.7 GB
      # each, the oldest for an upgrade completed months earlier.
      #
      # Zero, because every reason to keep one is already covered
      # better elsewhere. The release is pinned and re-extractable,
      # `upgrade.dump_dir` below holds the pre-upgrade database dump -
      # the only part re-extracting files cannot undo - and the backup
      # role snapshots the host nightly. What the updater's copy adds
      # is 1.7 GB per upgrade of a tree nothing reads.
      keep_backups: 0
    upgrade:
      # `occ upgrade` migrates the database schema, and that - not the
      # files - is the part of an upgrade that cannot be undone by
      # re-extracting a tarball. A dump is taken immediately before it,
      # named for the transition rather than a timestamp so it is
      # obvious what it can restore.
      dump_dir: /var/backups/nextcloud
      # Run after a successful upgrade. These are the commands behind
      # the admin overview's "missing indices/columns/primary keys"
      # warnings; each is idempotent and a no-op when there is nothing
      # to add.
      repair_commands:
        - db:add-missing-indices
        - db:add-missing-columns
        - db:add-missing-primary-keys
  # Client Push (the notify_push app). Without it every connected
  # client polls Nextcloud every 30 seconds, which is most of the idle
  # load a quiet instance carries and means a Talk call can ring up to
  # half a minute late; with it, clients hold one WebSocket open and
  # Nextcloud pushes. Served at /push/ on the Nextcloud vhost, which is
  # the path `occ notify_push:setup` expects.
  push:
    port: 7867
  # The Nextcloud Mail app. This role does not install it - it is an
  # app the user adds - but it does own this one setting when it is
  # present, because the default is surprising and its effect lands
  # outside Nextcloud entirely.
  mail:
    # Mail's importance classifier tags messages it predicts are
    # important with the IMAP keyword `$label1`. That keyword is not
    # Nextcloud's private bookkeeping: it is stored on the message in
    # the Maildir, so every IMAP client sees it, and Thunderbird maps
    # `$label1` to its own "Important" tag. The result is mail
    # sprouting tags in a client that was never told to tag anything.
    #
    # Off here, because a classifier that writes into shared IMAP
    # state should be opted into rather than out of. See
    # doc/STATUS.adoc for what this does *not* cover: the app default
    # governs accounts created after it is set, while an existing
    # account carries its own `classification_enabled` column that no
    # occ command exposes.
    classify_importance: false
  ocr:
    # Tesseract training data for OCRmyPDF, one package per language.
    languages:
      - eng
      - deu
  redis:
    # Host and port come from database.redis - this is only what is
    # specific to Nextcloud's use of that shared instance. Index 0 is
    # where RSpamd stores its data.
    dbindex: 1
    timeout: 1.5
  php:
    memory_limit: 512M
    opcache:
      enable: 1
      interned_strings_buffer: 12
      memory_consumption: 128
    # Dedicated pool, so Nextcloud's process limits are independent of
    # the distribution's `www` pool. Sharing the pool name with it was
    # a php-fpm startup error, not an override.
    pool:
      max_children: 5
      start_servers: 2
      min_spare_servers: 1
      max_spare_servers: 3
