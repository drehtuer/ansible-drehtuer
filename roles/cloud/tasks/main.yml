- name: Install Nextcloud and dependencies
  ansible.builtin.apt:
    install_recommends: false
    name: "{{ cloud_packages + cloud_ocr_packages }}"
  vars:
    cloud_packages:
      - php-mysql
      - php-zip
      - php-dom
      - php-mbstring
      - php-curl
      - php-gd
      - php-bcmath
      - php-imagick
      - php-intl
      - php-gmp
      # The two cache backends configured in cache.config.php below.
      # Nextcloud lists apcu as a recommended module and reports it as
      # missing without this.
      - php-apcu
      - php-redis
      - unzip
      - bzip2
      - curl
      - imagemagick
      # Nextcloud looks for the OCRmyPDF CLI on $PATH.
      - ocrmypdf
    # Tesseract ships its training data one package per language and
    # ocrmypdf only depends on English, so every other language has to
    # be installed explicitly.
    cloud_ocr_packages: >-
      {{ cloud.ocr.languages
         | map('regex_replace', '^', 'tesseract-ocr-') | list }}
  notify:
    # php-apcu and php-redis are only loaded once the running workers
    # are replaced.
    - Reload PHP-FPM
- name: Detect PHP version
  ansible.builtin.command:
    cmd: php -r "echo PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;"
  changed_when: false
  # Runs in check mode too. It is a read-only `php -r`, and every
  # later task that names a service or a config path depends on the
  # fact it sets - so skipping it (which check mode does to `command`
  # by default) left the version empty and made `invoke check-drift`
  # fail with "Could not find the requested service php-fpm" instead
  # of reporting drift. Same reason the certificate SAN read below
  # opts out.
  check_mode: false
  register: cloud_php_version_cmd
- name: Set PHP facts
  ansible.builtin.set_fact:
    cloud_php_version: "{{ cloud_php_version_cmd.stdout | trim }}"
    cloud_fpm_socket: /run/php/nextcloud-fpm.sock
    cloud_archive: "nextcloud-{{ cloud.nextcloud.version }}.tar.bz2"
- name: Create Nextcloud database
  community.mysql.mysql_db:
    name: "{{ cloud.mysql.nextcloud.database }}"
    state: present
    login_user: "{{ cloud.mysql.root.user }}"
    login_password: "{{ cloud.mysql.root.password }}"
- name: Create Nextcloud database user
  community.mysql.mysql_user:
    name: "{{ cloud.mysql.nextcloud.user }}"
    password: "{{ cloud.mysql.nextcloud.password }}"
    host: localhost
    column_case_sensitive: false
    priv: "{{ cloud.mysql.nextcloud.database }}.*:ALL"
    state: present
    login_user: "{{ cloud.mysql.root.user }}"
    login_password: "{{ cloud.mysql.root.password }}"
- name: Nextcloud folder
  ansible.builtin.file:
    path: "{{ cloud.nextcloud.path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
# Install only, never upgrade. Unpacking a newer release over a live
# installation without running `occ upgrade` breaks it, and that step
# is not automated yet (see doc/TODO.adoc), so the presence of
# version.php gates the whole download.
- name: Check whether Nextcloud is already installed
  ansible.builtin.stat:
    path: "{{ cloud.nextcloud.path }}/version.php"
  register: cloud_installed
- name: Download Nextcloud
  ansible.builtin.get_url:
    url: >-
      https://download.nextcloud.com/server/releases/{{ cloud_archive }}
    dest: "/tmp/{{ cloud_archive }}"
    checksum: "sha256:{{ cloud.nextcloud.checksum }}"
    owner: root
    group: root
    mode: "0644"
  when: not cloud_installed.stat.exists
- name: Extract Nextcloud
  # `--no-overwrite-dir` for the reason spelled out at the upgrade's
  # own extract below: it keeps tar from resetting an existing
  # directory's ownership to the archive's.
  ansible.builtin.unarchive:
    src: "/tmp/{{ cloud_archive }}"
    dest: "{{ cloud.nextcloud.path }}"
    remote_src: true
    extra_opts: [--strip-components=1, --no-overwrite-dir]
  when: not cloud_installed.stat.exists
- name: Set ownership for Nextcloud files
  # Same condition as the extraction above rather than a handler: the
  # files have to be owned correctly before php-fpm is pointed at
  # them, and a recursive chown of the whole tree on every run is
  # needlessly expensive.
  ansible.builtin.file:
    path: "{{ cloud.nextcloud.path }}"
    owner: www-data
    group: www-data
    recurse: true
  when: not cloud_installed.stat.exists
- name: Remove downloaded Nextcloud archive
  ansible.builtin.file:
    path: "/tmp/{{ cloud_archive }}"
    state: absent
- name: Nextcloud PHP-FPM pool
  ansible.builtin.template:
    src: templates/php-fpm-pool.conf.j2
    dest: "/etc/php/{{ cloud_php_version }}/fpm/pool.d/nextcloud.conf"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload PHP-FPM
- name: Nextcloud PHP configuration
  ansible.builtin.template:
    src: templates/php-nextcloud.ini.j2
    dest: "/etc/php/{{ cloud_php_version }}/{{ item }}/conf.d/99-nextcloud.ini"
    owner: root
    group: root
    mode: "0644"
  loop:
    - fpm
    # The CLI SAPI gets the same drop-in: the background job and occ
    # run through it, and APCu is off there by default, so without it
    # the local cache configured below exists for web requests only.
    - cli
  notify:
    - Reload PHP-FPM
- name: Validate PHP-FPM configuration
  # Same stance as `nginx -t`, `sshd -t` and `iptables-restore --test`
  # elsewhere in this repo. `template` has no validator of its own, and
  # the reload handler reports success even when the service then dies,
  # so a malformed pool file otherwise leaves the whole run green with
  # php-fpm down and every PHP vhost answering 502.
  ansible.builtin.command:
    cmd: "php-fpm{{ cloud_php_version }} -t"
  changed_when: false

- name: Check whether Nextcloud has been installed
  # config.php is written by the installer, so its absence is what
  # distinguishes "files unpacked" from "actually installed". version.php
  # above cannot tell them apart - it ships in the tarball.
  ansible.builtin.stat:
    path: "{{ cloud.nextcloud.path }}/config/config.php"
  register: cloud_configured

- name: Refuse to install without an administrator password
  # Rather than creating an administrator with an empty or defaulted
  # password on a host nobody is watching.
  ansible.builtin.assert:
    that:
      - cloud.nextcloud.admin.password | length > 0
    fail_msg: >-
      Nextcloud is not installed here and cloud.nextcloud.admin.password
      is empty. Set it in the inventory (vault-encrypted) before running
      this role, or the installer would create an administrator account
      with no password of its own.
  when: not cloud_configured.stat.exists

- name: Run the Nextcloud installer
  # The step that was previously done by hand, which is the gap that
  # mattered: everything else in this role reproduces on a new host, so
  # this was the one thing standing between the repo and a rebuild.
  #
  # no_log because the database and administrator passwords are
  # arguments - occ takes them no other way. The status read below is
  # what reports the outcome instead.
  ansible.builtin.command:
    cmd: >-
      sudo -u www-data php occ maintenance:install
      --database mysql
      --database-name {{ cloud.mysql.nextcloud.database }}
      --database-user {{ cloud.mysql.nextcloud.user }}
      --database-pass {{ cloud.mysql.nextcloud.password }}
      --admin-user {{ cloud.nextcloud.admin.user }}
      --admin-pass {{ cloud.nextcloud.admin.password }}
      --data-dir {{ cloud.nextcloud.data_dir }}
    chdir: "{{ cloud.nextcloud.path }}"
  when: not cloud_configured.stat.exists
  changed_when: true
  no_log: true

- name: Read the installed Nextcloud version
  # `versionstring` rather than `version`: the latter carries a fourth
  # component (34.0.3.2) that the inventory's pinned release does not.
  ansible.builtin.command:
    cmd: sudo -u www-data php occ status --output=json
    chdir: "{{ cloud.nextcloud.path }}"
  changed_when: false
  check_mode: false
  register: cloud_status

- name: Note the installed version
  ansible.builtin.set_fact:
    cloud_installed_version: >-
      {{ (cloud_status.stdout | from_json).versionstring }}

- name: Upgrade Nextcloud
  when: cloud_installed_version != cloud.nextcloud.version
  block:
    - name: Refuse to skip a major version
      # Nextcloud supports one major version per upgrade and refuses
      # more, but it refuses *after* the files have been replaced -
      # which leaves the installation unusable until someone puts the
      # old release back by hand. Checking first keeps that from
      # happening.
      ansible.builtin.assert:
        that:
          - (cloud.nextcloud.version.split('.')[0] | int)
            - (cloud_installed_version.split('.')[0] | int) <= 1
          - (cloud.nextcloud.version.split('.')[0] | int)
            >= (cloud_installed_version.split('.')[0] | int)
        fail_msg: >-
          Refusing to move from {{ cloud_installed_version }} to
          {{ cloud.nextcloud.version }}. Nextcloud upgrades one major
          version at a time and cannot go backwards; do it in steps,
          letting each one complete before bumping again.

    - name: Enable maintenance mode
      ansible.builtin.command:
        cmd: sudo -u www-data php occ maintenance:mode --on
        chdir: "{{ cloud.nextcloud.path }}"
      changed_when: true

    - name: Create the dump directory
      ansible.builtin.file:
        path: "{{ cloud.nextcloud.upgrade.dump_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Dump the database before migrating its schema
      # The files can be restored by re-extracting a tarball; the
      # schema migration cannot be undone. This is the only thing that
      # makes the upgrade reversible, and it is deliberately taken
      # after maintenance mode so nothing is writing during it.
      community.mysql.mysql_db:
        name: "{{ cloud.mysql.nextcloud.database }}"
        state: dump
        target: >-
          {{ cloud.nextcloud.upgrade.dump_dir }}/nextcloud-{{
          cloud_installed_version }}-to-{{ cloud.nextcloud.version }}.sql.gz
        single_transaction: true
        # Nextcloud's own account, not root. Two reasons, and the
        # second is not optional: it already holds every privilege on
        # this one database and nothing beyond it, and `root@localhost`
        # authenticates by unix_socket here - so handing mariadb-dump a
        # root password makes it fail with "Access denied (1698)" even
        # though the other tasks in this role connect as root happily,
        # because they go through the socket rather than forcing a
        # password login. Found on the lab, before it could happen here.
        login_user: "{{ cloud.mysql.nextcloud.user }}"
        login_password: "{{ cloud.mysql.nextcloud.password }}"

    - name: Download the new Nextcloud release
      ansible.builtin.get_url:
        url: >-
          https://download.nextcloud.com/server/releases/{{ cloud_archive }}
        dest: "/tmp/{{ cloud_archive }}"
        checksum: "sha256:{{ cloud.nextcloud.checksum }}"
        owner: root
        group: root
        mode: "0644"

    - name: Extract the new release over the old one
      # Over the top, removing nothing. The tarball contains no `data/`
      # or `config/`, so neither is touched - and on this host `data/`
      # holds every user's files inside the installation directory, so
      # any "delete what the tarball does not contain" cleanup would be
      # catastrophic. Stale files from the previous release are left
      # behind; they are inert, and that is the right trade.
      #
      # `--no-overwrite-dir` is what keeps the background job quiet
      # while this runs. tar as root restores a directory's ownership
      # from the archive, and the tarball does contain `config/` - it
      # ships `config.sample.php` - so a plain extract hands that
      # directory to root for the seconds until the chown below. The
      # five-minutely cron job landing in that window finds it cannot
      # write there and mails "Cannot write into config directory",
      # which is alarming and means nothing. Maintenance mode does not
      # suppress it: the writability check happens early enough in
      # bootstrap that the maintenance check never gets there. Seen
      # once on 2026-09-13, at 12:45:02, against an extract that
      # finished at 12:45:13.
      #
      # The flag says "preserve metadata of existing directories", so
      # `config/` keeps www-data and the file inside it is the only
      # thing that briefly belongs to root - which nothing checks.
      # Verified by extracting a tarball over a www-data-owned
      # directory with and without it.
      ansible.builtin.unarchive:
        src: "/tmp/{{ cloud_archive }}"
        dest: "{{ cloud.nextcloud.path }}"
        remote_src: true
        extra_opts: [--strip-components=1, --no-overwrite-dir]

    - name: Set ownership for the new files
      ansible.builtin.file:
        path: "{{ cloud.nextcloud.path }}"
        owner: www-data
        group: www-data
        recurse: true

    - name: Run the Nextcloud upgrade
      ansible.builtin.command:
        cmd: sudo -u www-data php occ upgrade
        chdir: "{{ cloud.nextcloud.path }}"
      changed_when: true

    - name: Add anything the new schema wants
      # The commands behind the admin overview's "missing indices",
      # "missing columns" and "missing primary keys" warnings. Each is
      # idempotent and does nothing when there is nothing to add.
      ansible.builtin.command:
        cmd: "sudo -u www-data php occ {{ item }}"
        chdir: "{{ cloud.nextcloud.path }}"
      loop: "{{ cloud.nextcloud.upgrade.repair_commands }}"
      changed_when: true

  always:
    - name: Leave maintenance mode
      # In `always`, so a failure anywhere above does not leave the
      # instance bricked behind a maintenance page. An upgrade that
      # failed is recoverable; one that failed *and* locked everyone
      # out needs someone at a terminal.
      ansible.builtin.command:
        cmd: sudo -u www-data php occ maintenance:mode --off
        chdir: "{{ cloud.nextcloud.path }}"
      changed_when: true

- name: Read the core integrity result
  # The upgrade extracts over the top and deletes nothing, for the
  # reason its own comment gives: the data directory lives *inside*
  # the installation directory here, so "delete whatever the tarball
  # does not contain" would delete every user's files. What that
  # leaves behind is the previous release's build output - 183 files
  # under `dist/` after 34.0.3 to 34.0.4 - and Nextcloud draws those
  # as a code-integrity failure in the admin overview.
  #
  # They are inert. The warning is not: this host has had a *genuine*
  # integrity failure before, from the PNG cleanup cron job that
  # truncated 1.7 GB of the installation, and a standing warning is
  # exactly what would hide the next one.
  #
  # Asking Nextcloud which files are stale, rather than working it out
  # here, is the whole safety of this: the list comes from comparing
  # the installation against the release's own signed manifest.
  ansible.builtin.command:
    cmd: sudo -u www-data php occ integrity:check-core --output=json
    chdir: "{{ cloud.nextcloud.path }}"
  register: cloud_integrity
  changed_when: false
  # `integrity:check-core` exits 1 exactly when it has something to
  # report, which is the case this task exists for - so a non-zero
  # return code here is the normal path, not a failure. The JSON is on
  # stdout either way. Anything other than 0 or 1 is a real failure
  # (no occ, no PHP, a broken installation) and still stops the run,
  # as does stdout that does not parse.
  failed_when: cloud_integrity.rc not in [0, 1]
  # Read-only, and the removal below needs its answer under
  # `invoke check-drift` too.
  check_mode: false

- name: Note which stale files may be removed
  # Two filters, and the second is the one that matters. `EXTRA_FILE`
  # means "present and not in the manifest", which is also true of
  # anything an administrator legitimately added - a custom theme
  # under `themes/`, a file left in `config/`. Only the directories
  # that hold code this role itself unpacked are eligible, so a file
  # nobody here created is reported by Nextcloud and left alone,
  # which is the correct outcome for something this role does not own.
  #
  # `..` and absolute paths are refused outright. Nextcloud has no
  # reason to emit either, and `state: absent` on one would delete
  # outside the installation.
  ansible.builtin.set_fact:
    cloud_stale_files: >-
      {{ cloud_integrity_extra
         | reject('search', '\.\.')
         | reject('match', '/')
         | select('match', cloud_integrity_prefixes)
         | list }}
  vars:
    cloud_integrity_parsed: >-
      {{ ((cloud_integrity.stdout | default('')) | trim or '{}')
         | from_json }}
    cloud_integrity_extra: >-
      {{ (cloud_integrity_parsed.EXTRA_FILE | default({}) | list)
         if cloud_integrity_parsed is mapping else [] }}
    cloud_integrity_prefixes: >-
      ^({{ cloud.nextcloud.integrity.cleanup_prefixes | join('|') }})/

- name: Remove the stale files the previous release left
  ansible.builtin.file:
    path: "{{ cloud.nextcloud.path }}/{{ item }}"
    state: absent
  loop: "{{ cloud_stale_files }}"
  loop_control:
    label: "{{ item }}"

- name: Re-read the integrity result so the admin overview agrees
  # Nextcloud stores the outcome of the last check and the overview
  # renders that, so deleting the files is only half of it - without
  # this the warning stays up until something else triggers a check.
  # Conditional on having removed something, because it is the one
  # part of this that costs a second.
  ansible.builtin.command:
    cmd: sudo -u www-data php occ integrity:check-core
    chdir: "{{ cloud.nextcloud.path }}"
  register: cloud_integrity_recheck
  changed_when: false
  failed_when: false
  when: cloud_stale_files | length > 0

- name: Nextcloud trusted domains
  # Same config/*.config.php mechanism as the cache settings below.
  ansible.builtin.template:
    src: templates/domains.config.php.j2
    dest: "{{ cloud.nextcloud.path }}/config/domains.config.php"
    owner: www-data
    group: www-data
    mode: "0640"
    validate: php -l %s
- name: Nextcloud trusted proxies
  # Client Push needs this; see the template. Deployed before the
  # self-test below, which fails without it.
  ansible.builtin.template:
    src: templates/proxy.config.php.j2
    dest: "{{ cloud.nextcloud.path }}/config/proxy.config.php"
    owner: www-data
    group: www-data
    mode: "0640"
    validate: php -l %s

- name: Nextcloud cache configuration
  # A config/*.config.php drop-in rather than config.php, which is
  # written by Nextcloud itself and is not managed here.
  ansible.builtin.template:
    src: templates/cache.config.php.j2
    dest: "{{ cloud.nextcloud.path }}/config/cache.config.php"
    owner: www-data
    group: www-data
    mode: "0640"
    validate: php -l %s
- name: Nextcloud log rotation
  # Nextcloud logs into its data directory, not /var/log, so nothing
  # packaged rotates it - and `log_rotate_size` defaults to unset,
  # which means no rotation at all. See the template.
  ansible.builtin.template:
    src: templates/logging.config.php.j2
    dest: "{{ cloud.nextcloud.path }}/config/logging.config.php"
    owner: www-data
    group: www-data
    mode: "0640"
    validate: php -l %s

- name: Detect the architecture notify_push ships a binary for
  ansible.builtin.command:
    cmd: uname -m
  register: cloud_push_arch_cmd
  changed_when: false
  check_mode: false

- name: Note the notify_push architecture
  ansible.builtin.set_fact:
    cloud_push_arch: "{{ cloud_push_arch_cmd.stdout | trim }}"

- name: Install the Client Push app
  # Ships the daemon as a prebuilt binary rather than needing a
  # toolchain, which is why this is an app install and not a build.
  ansible.builtin.command:
    cmd: sudo -u www-data php occ app:install notify_push
    chdir: "{{ cloud.nextcloud.path }}"
    creates: "{{ cloud.nextcloud.path }}/apps/notify_push/appinfo/info.xml"

- name: Client Push service
  ansible.builtin.template:
    src: templates/notify_push.service.j2
    dest: /etc/systemd/system/notify_push.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart notify_push

- name: Enable the Client Push service
  ansible.builtin.systemd_service:
    name: notify_push
    state: started
    enabled: true
    daemon_reload: true

- name: Nextcloud nginx upstream
  ansible.builtin.template:
    src: templates/nextcloud-fpm.conf.j2
    dest: /etc/nginx/conf.d/nextcloud-fpm.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx
- name: Nextcloud nginx location
  ansible.builtin.copy:
    src: files/nextcloud.conf
    dest: /etc/nginx/locations-available/nextcloud.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx
- name: Enable Nextcloud nginx location
  ansible.builtin.file:
    src: /etc/nginx/locations-available/nextcloud.conf
    dest: /etc/nginx/locations-enabled/nextcloud.conf
    state: link
  notify:
    - Reload nginx
- name: Cloud nginx site
  ansible.builtin.template:
    src: templates/cloud.conf.j2
    dest: /etc/nginx/sites-available/cloud.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx
- name: Enable cloud nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/cloud.conf
    dest: /etc/nginx/sites-enabled/cloud.conf
    state: link
  notify:
    - Reload nginx
- name: Remove duplicate Nextcloud background job
  # This role used to create the same job twice: once in www-data's
  # crontab and once in /etc/cron.d. Only the latter is kept.
  ansible.builtin.cron:
    name: "Nextcloud background job"
    user: www-data
    state: absent
- name: Nextcloud cron job
  ansible.builtin.cron:
    name: "Nextcloud cron job"
    user: www-data
    minute: "{{ cloud.nextcloud.cron_minute }}"
    job: "/usr/bin/php -f {{ cloud.nextcloud.path }}/cron.php"
    state: present
    cron_file: nextcloud_cron
- name: Remove the iCCP PNG rewriting cron job
  # Deleted rather than narrowed, because the cure was worse than the
  # disease. It ran weekly as www-data:
  #
  #   find /var/www/nextcloud -type f -name '*.png' -exec mogrify -strip {} +
  #
  # over the *whole* installation, to silence libpng's "known incorrect
  # sRGB profile" warning - which is cosmetic log noise.
  #
  # What it actually did, on 2026-08-16:
  #
  #   * Broke Nextcloud's code integrity check. `mogrify -strip`
  #     re-encodes the file, so every signed PNG in an app no longer
  #     matched its hash. The three INVALID_HASH entries reported all
  #     carried an mtime of 03:00:0x - exactly this job's schedule.
  #   * Rewrote user uploads. The data directory lives *inside* the
  #     installation directory on this host, so 2163 of the 2480 PNGs
  #     it touched each week were under data/, 425 of them files a user
  #     had uploaded. Verified on a copy that mogrify does change them:
  #     this was re-encoding people's images to tidy a log message.
  #
  # If the warning ever needs addressing again, it belongs at preview
  # generation and nowhere near either app code or user data.
  ansible.builtin.cron:
    name: "Remove iCCP profiles from PNG files"
    user: www-data
    cron_file: nextcloud_iccp_cleanup
    state: absent

# The two tasks below carry no `cron_file`, and that omission is the
# whole point of them.
#
# `ansible.builtin.cron` identifies an entry by (user, name,
# cron_file). Naming a cron_file therefore scopes the module to
# /etc/cron.d/<file> and to nothing else - so the removal above, and
# the "Nextcloud cron job" task before it, have only ever been able to
# see the copies there.
#
# Both jobs predate this role using cron_file at all. When it was
# added, Ansible wrote fresh entries under /etc/cron.d and silently
# stopped managing the originals in www-data's own crontab, which have
# sat in /var/spool/cron/crontabs/www-data ever since (installed
# 2026-08-15 20:29, by the last run that wrote them).
#
# What that cost, found on 2026-08-23 from a weekly mogrify error mail
# that should have stopped a week earlier:
#
#   * The PNG job removed on 2026-08-16 never stopped running. Only
#     the /etc/cron.d copy went; the crontab one kept firing every
#     Sunday at 03:00.
#   * The background job runs twice, on two schedules - */5 from
#     /etc/cron.d/nextcloud_cron and */15 from the crontab.
- name: Remove the iCCP PNG rewriting job from www-data's own crontab
  ansible.builtin.cron:
    name: "Remove iCCP profiles from PNG files"
    user: www-data
    state: absent

- name: Remove the duplicate background job from www-data's own crontab
  # The managed copy stays: it lives in /etc/cron.d/nextcloud_cron and
  # is written by the "Nextcloud cron job" task above, which names a
  # cron_file and so is untouched by this.
  ansible.builtin.cron:
    name: "Nextcloud cron job"
    user: www-data
    state: absent

# Nextcloud's *updater* - the web and CLI one, not this role, which
# extracts a tarball over the top - copies the entire installation to
# data/updater-<instanceid>/backups/nextcloud-<version>-<epoch>/ before
# it upgrades, and never removes one afterwards. Three had accumulated
# on carcosa at 1.7 GB each, the oldest from 2026-06-04, all of them
# rollback points for upgrades that completed months ago.
#
# They are also where the PNG damage survives: the copies were taken
# while the mogrify job was still running, so files it had zeroed or
# truncated are frozen there - which is what the weekly error mail was
# mostly reporting.
- name: Read the Nextcloud instance id
  # Names the updater directory. Read rather than derived, so the path
  # below is the one this instance actually uses.
  ansible.builtin.command:
    cmd: sudo -u www-data php occ config:system:get instanceid
    chdir: "{{ cloud.nextcloud.path }}"
  changed_when: false
  check_mode: false
  register: cloud_instanceid

- name: Find the updater's leftover backups
  # Scoped to one directory, matching one pattern, non-recursively.
  # That is deliberate given what the job removed above did with a
  # broad scope: this can only ever see `backups/nextcloud-*`, and a
  # path outside it cannot be reached from here even if the instance
  # id read above were wrong.
  ansible.builtin.find:
    paths: >-
      {{ cloud.nextcloud.data_dir }}/updater-{{
         cloud_instanceid.stdout | trim }}/backups
    patterns: nextcloud-*
    file_type: directory
    recurse: false
  # Runs under --check too, so `invoke check-drift` reports the
  # backups that would actually go rather than an empty list.
  check_mode: false
  register: cloud_updater_backups

- name: Choose which updater backups to remove
  # Newest first, then drop the ones being kept. `keep_backups: 0`
  # removes all of them, which is the default: this role installs a
  # pinned release it can re-extract, takes its own database dump
  # before `occ upgrade` - the half a file copy cannot undo - and the
  # backup role snapshots the host nightly.
  ansible.builtin.set_fact:
    cloud_updater_stale: >-
      {{ (cloud_updater_backups.files | sort(attribute='mtime', reverse=true))[
           cloud.nextcloud.updater.keep_backups | int:] }}

- name: Remove the updater's leftover backups
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ cloud_updater_stale }}"
  loop_control:
    # `find` returns the whole stat dict per entry, and a failure here
    # would print all of it per item. The directory name is the only
    # part worth reading.
    label: "{{ item.path | basename }}"

- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Apply nginx and service changes before the push self-test
  # `notify_push:setup` does not just write configuration - it connects
  # to the URL and verifies the whole path works. Running it before the
  # vhost reloads tests the old one.
  ansible.builtin.meta: flush_handlers

- name: Configure and self-test Client Push
  # Idempotent in effect: re-running re-verifies and rewrites the same
  # value. `changed_when: false` because it reports success either way
  # and there is nothing to compare against - the check it performs is
  # the point, not the write.
  ansible.builtin.command:
    cmd: >-
      sudo -u www-data php occ notify_push:setup
      https://cloud.{{ domain }}/push
    chdir: "{{ cloud.nextcloud.path }}"
  register: cloud_push_setup
  changed_when: false

- name: Install the apps this instance should have
  # `cloud.apps` is the answer to "what is a working installation
  # here", which the tarball alone does not settle: the release ships
  # the bundled apps and nothing else, so every calendar, contact and
  # task on a rebuilt host depends on someone remembering the list.
  # That is exactly the memory this repository exists to replace.
  #
  # Both kinds of app go through the same loop. A bundled one
  # (files_sharing, files_pdfviewer) is already unpacked, so `creates`
  # skips the install and only the enable below can act on it; an app
  # store one is fetched. `creates` rather than a read-before-write,
  # because `app:install` fails on an app that is already there and
  # the appinfo file is what "already there" means.
  #
  # An id the app store does not know, or one with no release
  # compatible with the pinned Nextcloud, fails the run. That is the
  # wanted behaviour: silently skipping it would leave a host missing
  # an app this list says it has.
  ansible.builtin.command:
    cmd: sudo -u www-data php occ app:install {{ item }}
    chdir: "{{ cloud.nextcloud.path }}"
    creates: "{{ cloud.nextcloud.path }}/apps/{{ item }}/appinfo/info.xml"
  loop: "{{ cloud.apps }}"

- name: Read which apps Nextcloud has enabled
  # Installed and enabled are two different states, and the loop above
  # only establishes the first: an app disabled in the web UI keeps its
  # appinfo file, so `creates` would skip forever and leave it present
  # and off - which is also the only state a bundled app can be
  # corrected from. `app:list` is asked rather than
  # `config:app:get <app> enabled`, because the JSON output states the
  # answer outright instead of relying on how that key is spelled.
  ansible.builtin.command:
    cmd: sudo -u www-data php occ app:list --output=json
    chdir: "{{ cloud.nextcloud.path }}"
  register: cloud_app_list
  changed_when: false
  # Read-only, and running it under --check is the point: it is what
  # makes `invoke check-drift` able to report a disabled app.
  check_mode: false

- name: Enable the apps this instance should have
  ansible.builtin.command:
    cmd: sudo -u www-data php occ app:enable {{ item }}
    chdir: "{{ cloud.nextcloud.path }}"
  # The guard is the comparison, so reaching this task means the app
  # is installed and not enabled. The read above is ordered after the
  # installs for that reason: `app:install` enables what it installs,
  # so a list taken before them would report a freshly installed app
  # as disabled and this task would re-enable it, reporting a change
  # that did nothing. Taken after, the only apps left here are the
  # ones somebody switched off.
  changed_when: true
  loop: "{{ cloud.apps }}"
  when: >-
    item not in (cloud_app_list.stdout | default('{}')
                 | from_json).enabled | default({})

- name: Note whether gpoddersync is installed
  # The schema correction below is about one app's own table, which
  # exists only once that app's migrations have run.
  ansible.builtin.stat:
    path: "{{ cloud.nextcloud.path }}/apps/gpoddersync/appinfo/info.xml"
  register: cloud_gpoddersync_app

- name: Correct gpoddersync's episode-action URL columns
  # gpoddersync keeps an episode action's feed URL, enclosure URL and
  # GUID in VARCHAR(500) columns, and silently discards every action
  # whose values do not fit. `EpisodeActionSaver::saveEpisodeActions`
  # catches the DbalException the oversized insert raises, asks whether
  # it was a unique-constraint violation, and - when it was not, as
  # here - falls out of the catch with no rethrow and no log.
  # `EpisodeActionController::create` then returns 200 whatever
  # happened. So the client is told its write succeeded, the server
  # stored nothing, and the episode stays unplayed in every client for
  # ever.
  #
  # The feeds that hit this are the paid, per-subscriber kind, which
  # sign each enclosure URL with a token: Supercast's run 516-517
  # characters, and an Acast one of 612 is what identified the cause
  # upstream (thrillfall/nextcloud-gpodder#81). The maintainer accepted
  # the fix there in 2022 - "Well increase the length then" - and it
  # was never made; 3.17.0 still creates the column at 500. Only
  # `gpodder_subscriptions.url` was ever widened, by that app's own
  # Version0006, which is why subscribing to such a feed works and
  # marking its episodes played does not.
  #
  # 1000 characters is that same Version0006 applied to this second
  # table rather than a number invented here. Its index prefix is not
  # copied with it, and that is deliberate - see below.
  #
  # Widening a column an index covers looks like it should fail:
  # InnoDB caps an index key at 3072 bytes and a full utf8mb4
  # VARCHAR(1000) is 4000 on its own. On MariaDB it does not. Since
  # 10.4 a unique index whose key outgrows that cap is implemented as
  # a hash over the whole value, and widening the column converts the
  # existing index in place - `SHOW CREATE TABLE` afterwards reads
  # `UNIQUE KEY ... USING HASH`. So no index work is needed here.
  #
  # Rebuilding the indexes over a 500-character prefix first, as
  # Version0006 does, would be worse than merely unnecessary: at that
  # point the columns still *are* 500, so the prefixes normalise away
  # and the statements do nothing. A prefix only survives if it is
  # added after the widen, which is how the app's own migration ends
  # up with `(url(500), user_id)` on the subscriptions table - Doctrine
  # emits the index against the final schema rather than in written
  # order.
  #
  # Taking the hash index rather than a prefix also makes the
  # constraint stricter than upstream's: uniqueness is on the whole
  # value, so two episode URLs sharing their first 500 characters are
  # two rows here and one row next door. Verified on mariadb:10.11,
  # the version this host runs.
  #
  # Note what that ties this to: MySQL has no such conversion and
  # refuses the widen outright with "Specified key was too long".
  # Both the production host and the lab run MariaDB
  # (roles/database).
  #
  # Re-asserted on every run, so an app update that recreates the
  # column at 500 is corrected the next time this role runs rather
  # than quietly resuming the data loss.
  when: cloud_gpoddersync_app.stat.exists
  block:
    - name: Read the database table prefix
      # `maintenance:install` writes it to config.php and this repo
      # never changes it, but reading it beats hardcoding `oc_` into a
      # statement that would then match nothing at all - and match
      # nothing silently, since ALTER against a missing table is the
      # one outcome this task would report as a plain failure.
      ansible.builtin.command:
        cmd: sudo -u www-data php occ config:system:get dbtableprefix
        chdir: "{{ cloud.nextcloud.path }}"
      register: cloud_db_prefix
      changed_when: false
      # Read-only, and the schema read below needs its answer under
      # `invoke check-drift` too.
      check_mode: false

    - name: Note the gpoddersync episode-action table
      ansible.builtin.set_fact:
        cloud_gpodder_table: >-
          {{ cloud_db_prefix.stdout | trim }}gpodder_episode_action

    - name: Read the episode-action column definition
      # `episode` stands for all three: they are only ever changed
      # together, and only by the task below, so its width is a
      # faithful record of whether that task has run. The charset and
      # collation are read rather than assumed because MODIFY takes a
      # whole column definition - anything left out is re-derived from
      # the table default, which would silently re-collate a column
      # that had one of its own.
      community.mysql.mysql_query:
        login_db: "{{ cloud.mysql.nextcloud.database }}"
        # Nextcloud's own account rather than root, for the reason the
        # pre-upgrade dump gives above: it already holds every
        # privilege on this one database and nothing beyond it.
        login_user: "{{ cloud.mysql.nextcloud.user }}"
        login_password: "{{ cloud.mysql.nextcloud.password }}"
        query: >-
          SELECT character_maximum_length AS width,
          character_set_name AS charset, collation_name AS collation
          FROM information_schema.columns
          WHERE table_schema = %s AND table_name = %s
          AND column_name = 'episode'
        positional_args:
          - "{{ cloud.mysql.nextcloud.database }}"
          - "{{ cloud_gpodder_table }}"
      register: cloud_gpodder_column
      changed_when: false
      check_mode: false

    - name: Widen the episode-action URL columns
      # Three statements and no index work: MariaDB converts the two
      # unique indexes to hash indexes as the columns widen past the
      # key limit, for the reason set out above.
      community.mysql.mysql_query:
        login_db: "{{ cloud.mysql.nextcloud.database }}"
        login_user: "{{ cloud.mysql.nextcloud.user }}"
        login_password: "{{ cloud.mysql.nextcloud.password }}"
        query:
          - >-
            ALTER TABLE `{{ cloud_gpodder_table }}`
            MODIFY `podcast` VARCHAR(1000) CHARACTER SET
            {{ cloud_gpodder_episode.charset }} COLLATE
            {{ cloud_gpodder_episode.collation }} NOT NULL
          - >-
            ALTER TABLE `{{ cloud_gpodder_table }}`
            MODIFY `episode` VARCHAR(1000) CHARACTER SET
            {{ cloud_gpodder_episode.charset }} COLLATE
            {{ cloud_gpodder_episode.collation }} NOT NULL
          - >-
            ALTER TABLE `{{ cloud_gpodder_table }}`
            MODIFY `guid` VARCHAR(1000) CHARACTER SET
            {{ cloud_gpodder_episode.charset }} COLLATE
            {{ cloud_gpodder_episode.collation }} DEFAULT NULL
      vars:
        cloud_gpodder_episode: >-
          {{ cloud_gpodder_column.query_result[0][0] | default({}) }}
      # The guard is the comparison, so reaching this task means the
      # columns are still the narrow ones. The emptiness check comes
      # first and has to: the app can be installed with its migrations
      # not yet run, and `when` conditions are evaluated in order.
      #
      # Worth knowing when reading `invoke check-drift`: mysql_query
      # does not support check mode, so this reports *skipped* there
      # whether it was guarded out or merely deferred. The read above
      # prints the live width either way, which is the answer.
      when:
        - cloud_gpodder_column.query_result[0] | length > 0
        - cloud_gpodder_episode.width | int < 1000
      changed_when: true

- name: Note whether the Mail app is installed
  # The Mail settings below are conditional on the app being present,
  # which a `cloud.apps` without it leaves it not being.
  # `config:app:set` would happily write a key for an app that is not
  # there, which is worse than useless: it would read as a managed
  # setting doing nothing.
  ansible.builtin.stat:
    path: "{{ cloud.nextcloud.path }}/apps/mail/appinfo/info.xml"
  register: cloud_mail_app

- name: Read the Mail app's importance-classification default
  # Read before write, so a converged host reports no change and
  # `invoke check-drift` stays readable. `config:app:get` exits
  # non-zero for a key that has never been set, which is not a
  # failure - it is the state this task exists to correct, and an
  # empty stdout compares unequal to either wanted value.
  ansible.builtin.command:
    cmd: >-
      sudo -u www-data php occ config:app:get mail
      importance_classification_default
    chdir: "{{ cloud.nextcloud.path }}"
  register: cloud_mail_classification
  changed_when: false
  failed_when: false
  # Reads nothing but the current setting, so it is safe under --check
  # and running it there is the point.
  check_mode: false
  when: cloud_mail_app.stat.exists

- name: Set the Mail app's importance-classification default
  # Mail's classifier tags what it predicts is important with the IMAP
  # keyword `$label1`. That keyword lives on the message in the
  # Maildir rather than in Nextcloud, so every IMAP client sees it and
  # Thunderbird draws it as its own "Important" tag - mail acquiring
  # tags in a client that was never asked to tag anything.
  #
  # The value is a string Mail compares with `=== 'yes'`, not a
  # boolean, so anything else reads as off.
  #
  # NOTE the limit of this, which is why doc/STATUS.adoc carries the
  # rest: this is the default applied to accounts *created after* it
  # is set. An account that already exists carries its own
  # `classification_enabled` column, seeded from this default by the
  # app's own migration, and no occ command exposes it - it is the
  # toggle in Mail's account settings. So this keeps the problem from
  # coming back on a rebuilt host; it cannot fix a host that already
  # has the account.
  ansible.builtin.command:
    cmd: >-
      sudo -u www-data php occ config:app:set mail
      importance_classification_default --value={{ cloud_mail_wanted }}
    chdir: "{{ cloud.nextcloud.path }}"
  vars:
    cloud_mail_wanted: >-
      {{ 'yes' if cloud.mail.classify_importance else 'no' }}
    cloud_mail_stored: >-
      {{ cloud_mail_classification.stdout | default('') | trim }}
  # The guard below is the comparison, so reaching this task at all
  # means the stored value differs from the wanted one.
  #
  # It compares *meanings* rather than spellings, and it has to.
  # Nextcloud's app config is typed since 30: this key is registered
  # as a boolean, so `--value=no` is stored as false and read back by
  # `config:app:get` as `0`, never as the `no` that was written.
  # Comparing those two strings always differed, so the task rewrote
  # the same value on every run - found on 2026-09-13 after the
  # 34.0.4 upgrade, by running the playbook twice and watching it
  # report `changed` both times. An empty read stays a reason to
  # write: a key that is absent leaves Mail's own default in force,
  # and that default is *on*.
  #
  # Worth knowing when reading `invoke check-drift`: a command task in
  # check mode reports *skipped* whether its condition was false or it
  # merely could not run, so drift in this setting does not reach the
  # recap. The two are distinguishable in `-v` output - a false
  # condition carries `skip_reason`, a deferred command carries
  # "Command would have run if not in check mode" - and the read task
  # above prints the live value either way.
  changed_when: true
  when:
    - cloud_mail_app.stat.exists
    - >-
      cloud_mail_stored == ''
      or (cloud_mail_stored in ['yes', '1', 'true'])
      != cloud.mail.classify_importance
