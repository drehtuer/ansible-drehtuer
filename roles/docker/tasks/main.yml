- name: Install docker
  ansible.builtin.apt:
    install_recommends: false
    name:
      - docker.io
      - docker-buildx
      - docker-compose-v2
      - pigz
- name: Config for docker daemon
  ansible.builtin.template:
    src: templates/daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"  # NOSONAR
  notify:
    - Restart docker
- name: Systemd enable docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
- name: Systemd enable containerd
  ansible.builtin.systemd_service:
    name: containerd
    state: started
    enabled: true
