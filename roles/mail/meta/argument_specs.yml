argument_specs:
  main:
    short_description: Postfix, TLS-only submission via Dovecot SASL
    description:
      - Installs Postfix, renders local and virtual alias maps, and
        wires RSpamd in as a milter on spam.milter_port
        (milter_default_action = accept, i.e. fails open if RSpamd is
        unreachable).
      - Accepts mail for the primary domain and every alias domain,
        all delivered into the same per-account mailbox.
    options:
      domain:
        type: str
        required: true
        description: Primary domain, used as $mydomain and in virtual aliases.
      domain_aliases:
        type: list
        elements: str
        required: true
        description:
          - Secondary domains this host also accepts mail for. Each is
            added to virtual_mailbox_domains alongside the primary and
            gets its own copy of every entry in mail.aliases, so an
            address behaves the same whichever domain it was sent to.
          - Delivery is by LMTP to Dovecot, which strips the domain
            before looking the account up, so every domain here shares
            one inbox per account rather than having its own.
      hostname_fqdn:
        type: str
        required: true
        description: Fully qualified host name, used as $myhostname.
      http:
        type: dict
        required: true
        description:
          - Shared HTTP settings, owned by the http role. The MTA-STS
            vhost reads `http.port_https` and `http.domains`, serving
            mta-sts.<domain> for each.
          - Declared without suboptions, as in roles/spam, so the keys
            the http role itself requires are not rejected here.
      mail:
        type: dict
        required: true
        description: Mail settings.
        options:
          aliases:
            type: list
            elements: dict
            required: true
            description: Local and virtual aliases.
            options:
              alias:
                type: str
                required: true
                description: Local address to forward.
              forwards:
                type: list
                elements: str
                required: true
                description: Accounts/addresses receiving the mail.
          mta_sts:
            type: dict
            required: true
            description:
              - MTA-STS policy served at
                https://mta-sts.<domain>/.well-known/mta-sts.txt for
                every served domain, naming mail.<domain> as its MX.
            options:
              mode:
                type: str
                required: true
                choices: [testing, enforce, none]
                description:
                  - testing reports TLS failures without refusing
                    delivery, enforce refuses, none withdraws the
                    policy.
              max_age:
                type: int
                required: true
                description: Seconds a sender may cache the policy.
          ssl:
            type: dict
            required: true
            description: TLS settings.
            options:
              cert:
                type: str
                required: true
                description: Certificate path.
              key:
                type: str
                required: true
                description: Private key path.
      spam:
        type: dict
        required: true
        description:
          - Shared with the spam role, only spam.milter_port is read
            here. Deliberately declared without suboptions - listing
            them would make validation reject every other key the
            spam role itself requires.
      users:
        type: dict
        required: true
        description:
          - Shared with the users role, only the `name` of each entry
            in users.users is read here. Every account is crossed with
            every served domain to build /etc/vmailbox, the list of
            recipients Postfix accepts at SMTP time - so an account
            missing from it has its mail refused rather than bounced
            after the fact.
          - The same names are the SASL logins in /etc/sender_logins,
            where each account owns its own address and every alias
            that delivers to it.
          - Declared without suboptions for the same reason as spam
            above - listing them would make validation reject every
            other key the users role itself requires.
