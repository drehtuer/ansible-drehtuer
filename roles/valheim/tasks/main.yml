# Needs roles/docker (the engine and Compose v2) and roles/http
# (nginx, the WebSocket upgrade map, and the certificate covering
# valheim.webmap.subdomain). Neither is asserted here - the ordering
# lives in playbooks/valheim.yml and in doc/STATUS.adoc with the other
# constraints.
#
# It also needs the three UDP game ports in firewall.docker.published,
# which belongs to roles/firewall and is deliberately not duplicated
# here: one chain, one owner.
- name: Create valheim directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ valheim.compose_dir }}", mode: "0755"}
    # The container's /config. Not world-readable: it holds the world
    # saves, the backups of them, and the admin list.
    - {path: "{{ valheim.config_dir }}", mode: "0700"}
    # Where BepInEx plugins are staged for the image to pick up. The
    # bootstrap rsyncs plugins/ and patchers/ in here into the live
    # tree on every container start, which is what makes updating a
    # mod a matter of writing here and restarting. The directory
    # itself is the live BepInEx/config, by symlink.
    - {path: "{{ valheim.config_dir }}/bepinex", mode: "0700"}
    - {path: "{{ valheim.config_dir }}/bepinex/plugins", mode: "0700"}
    - {path: "{{ valheim.config_dir }}/bepinex/patchers", mode: "0700"}
    # What library/thunderstore_package.py staged, one file per
    # package. Beside bepinex/ rather than in it, so the bootstrap
    # never syncs it anywhere.
    - {path: "{{ valheim_mods_state_dir }}", mode: "0700"}
    # The container's /opt/valheim - the game and the BepInEx install.
    - {path: "{{ valheim.data_dir }}", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"

- name: Stage the BepInEx mods
  # Downloads each pinned package, checks it against its SHA-256 and
  # stages it under config_dir/bepinex - see the module for how a
  # Thunderstore zip is mapped onto BepInEx's directories, which is
  # the part a plain get_url + unarchive gets wrong.
  #
  # Idempotent without touching the network: the module compares a
  # state file per package against the pin and does nothing when they
  # agree. Expect the first run to take a while; the full set is
  # close to a gigabyte, most of it the Therzie and MWL asset bundles.
  thunderstore_package:
    name: "{{ item.name }}"
    version: "{{ item.version }}"
    sha256: "{{ item.sha256 }}"
    directory: "{{ item.directory | default(omit) }}"
    bepinex_dir: "{{ valheim.config_dir }}/bepinex"
    state_dir: "{{ valheim_mods_state_dir }}"
  loop: "{{ valheim_mods }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  notify:
    - Restart valheim

- name: Find staged BepInEx mods
  ansible.builtin.find:
    paths: "{{ valheim_mods_state_dir }}"
    patterns: "*.json"
  register: valheim_mods_staged

- name: Remove BepInEx mods no longer listed
  # So that deleting an entry from valheim_mods is how a mod is
  # removed, rather than something to remember to do by hand. The
  # image's bootstrap then prunes the live copy on the next start,
  # from its own record of what it synced.
  thunderstore_package:
    name: "{{ item }}"
    bepinex_dir: "{{ valheim.config_dir }}/bepinex"
    state_dir: "{{ valheim_mods_state_dir }}"
    state: absent
  loop: >-
    {{ valheim_mods_staged.files | map(attribute='path')
       | map('basename') | map('splitext') | map('first')
       | difference(valheim_mods | map(attribute='name')) | sort }}
  notify:
    - Restart valheim

- name: Seed the WebMap configuration
  # `force: false` on purpose - see the template for why this file is
  # established once and then belongs to the host. In short: BepInEx
  # rewrites it on every start, so a file this repo owned would be a
  # permanent, meaningless diff in `invoke check-drift`.
  ansible.builtin.template:
    src: templates/webmap.cfg.j2
    dest: "{{ valheim.config_dir }}/bepinex/com.valheimwebmap.server.cfg"
    force: false
    owner: root
    group: root
    mode: "0644"

- name: Configure the valheim server environment
  # The join password and the admin list, and nothing else. no_log
  # because the diff would otherwise print both; the compose file
  # beside it stays readable precisely so that this is the only task
  # that has to be blind.
  #
  # This `no_log` is also the only one the role has, and that is not an
  # oversight: the same flag on the *argument spec* breaks role
  # validation outright against an inline `!vault` value. See
  # meta/argument_specs.yml.
  ansible.builtin.template:
    src: templates/server.env.j2
    dest: "{{ valheim.compose_dir }}/server.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify:
    - Restart valheim

- name: Configure the valheim compose stack
  ansible.builtin.template:
    src: templates/compose.yml.j2
    dest: "{{ valheim.compose_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start valheim
  # docker_compose_v2 rather than docker_container: it drives the
  # `docker compose` CLI the docker role already installs, so nothing
  # needs the Python docker SDK on the target, and the compose file
  # stays the readable description of what runs.
  community.docker.docker_compose_v2:
    project_src: "{{ valheim.compose_dir }}"
    state: present
    # Pull only what the pin asks for. `missing` and not `always`, so a
    # converged host does not reach out to the registry on every run -
    # the digest already decides which image this is.
    pull: missing

- name: Add htaccess for the valheim web map
  # Vault-encrypted and decrypted at deploy time, the same pattern as
  # the spam and fail2ban_ui roles. `copy` compares content, so
  # replacing the credential is picked up without a separate checksum.
  ansible.builtin.copy:
    src: files/nginx/valheim.htpasswd.aes256
    dest: /etc/nginx/sites-available/valheim.htpasswd
    decrypt: true
    owner: root
    group: root
    mode: "0644"

- name: Enable valheim htpasswd in nginx
  ansible.builtin.file:
    src: /etc/nginx/sites-available/valheim.htpasswd
    dest: /etc/nginx/sites-enabled/valheim.htpasswd
    state: link
  notify:
    - Reload nginx

- name: Add valheim web map rproxy in nginx
  ansible.builtin.template:
    src: templates/nginx/valheim.conf.j2
    dest: /etc/nginx/sites-available/valheim.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx

- name: Enable valheim site in nginx
  ansible.builtin.file:
    src: /etc/nginx/sites-available/valheim.conf
    dest: /etc/nginx/sites-enabled/valheim.conf
    state: link
  notify:
    - Reload nginx

- name: Validate nginx configuration
  # Same stance as the http, cloud and fail2ban_ui roles: a reload of a
  # broken config leaves the old one serving, so the run would go green
  # with the vhost not actually loaded.
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
