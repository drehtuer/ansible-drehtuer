valheim:  # noqa: var-naming[no-role-prefix] - see doc/STATUS.adoc
  # community-valheim-tools/valheim-server, the continuation of
  # lloesche/valheim-server-docker under the same maintainers. It is
  # the image the WebMap mod documents its own Docker install against,
  # which is worth something here: the plugin path this role uses is
  # the one both upstreams agree on.
  #
  # Pinned by tag *and* digest, the stance `fail2ban_ui` and `talk`
  # take. This is the multi-arch *index* digest rather than one
  # platform's, so the pin survives a host of another architecture.
  image: ghcr.io/community-valheim-tools/valheim-server
  tag: "1.4.0"
  digest: >-
    sha256:f3ccde9a4e292663cf5096d502ff33cc9617015f6d70b6a9ca0968543f165ef2
  # Three directories, three owners, deliberately not one:
  #
  #   compose_dir - this repository's. Rewritten every run.
  #   config_dir  - the container's /config: worlds, backups, BepInEx
  #                 configuration, and the staging copy of the plugin.
  #                 This is the one that must survive everything.
  #   data_dir    - the container's /opt/valheim: the game itself and
  #                 the BepInEx install. Rebuilt from Steam on demand
  #                 and worth nothing on its own.
  compose_dir: /etc/valheim
  config_dir: /srv/valheim/config
  data_dir: /srv/valheim/data
  server:
    name: Valheim
    # The world save under config_dir/worlds_local. Changing this does
    # not rename a world, it starts a different one - the old files
    # stay where they are and the server generates a new map.
    world: Dedicated
    # Whether to advertise in the in-game server browser. Players can
    # always reach it with Join by IP, so `false` is a listing
    # decision and not an access control one - the password is that.
    public: false
    # The first of three consecutive UDP ports. port+1 is Steam's
    # query port; port+2 is what mods use for RPC, which is precisely
    # why it is opened here and would not be for a vanilla server.
    port: 2456
    timezone: Europe/Berlin
    # SteamID64s that get admin in game. Empty is the safe default:
    # this grants ban, kick, no-cost building and the world-modifier
    # console commands to whoever is listed.
    admin_ids: []
    # Extra arguments appended to the server command line, joined with
    # spaces. This is where world modifiers go - a dedicated server
    # takes them here and nowhere else, since the client's
    # world-settings screen only appears when creating a world
    # locally. `-preset` must come before any `-modifier`, because it
    # overwrites them and logs nothing when it does.
    args: []
    # `password` has deliberately no default. It is the only thing
    # standing between a public UDP port and someone else's world, so
    # a host that forgets to set one should fail at the top of the
    # role rather than come up with a value this file chose for it.
    # See meta/argument_specs.yml, where it is required.
  webmap:
    # f00d4tehg0dz/valheim-webmap, MIT. A BepInEx plugin that serves a
    # live map of the world over HTTP, with no client-side install.
    # The plugin itself is one of `valheim_mods` below; what is here
    # is how this host exposes it.
    #
    # NOT the mod's own default, which is 3000, and the difference is
    # load bearing: `monitoring.grafana.port` is already 3000 on
    # 127.0.0.1, so a container publishing 3000 there fails to start
    # with "address already in use". That is what happened on the
    # first deploy to carcosa. 8091 continues the block this host
    # already uses for loopback web services - 8080 stub_status, 8081
    # talk, 8090 fail2ban_ui.
    #
    # Because this is not the mod's default, the seeded config in
    # templates/webmap.cfg.j2 is the only thing that tells the mod
    # about it. The two are halves of one number and nothing checks
    # that they agree; change them together or the vhost proxies to a
    # port nothing is listening on.
    #
    # Published to loopback only and reached through nginx - see the
    # compose template for why that means no `firewall.docker.published`
    # entry is needed for it, unlike the game ports.
    port: 8091
    # Serves <subdomain>.<domain> for every entry in http.domains.
    #
    # This has to also appear in `http.letsencrypt.subdomains`, or the
    # certificate will not cover the name this vhost answers for and
    # every request gets a name mismatch. Nothing enforces the pairing -
    # the same standing trap the `spam` and `fail2ban_ui` roles have.
    subdomain: valheim

# BepInEx packages from Thunderstore, staged by library/
# thunderstore_package.py into config_dir/bepinex, where the image's
# bootstrap syncs plugins/ and patchers/ into the live tree on every
# start. See doc/STATUS.adoc.
#
# A top-level variable rather than a key of `valheim` above, so the
# inventories do not have to repeat it: a `valheim` dict there
# REPLACES this file's rather than merging into it, and the list is
# neither secret nor different per environment.
#
# Each entry is pinned by version AND by the SHA-256 of the zip,
# which plays the part an image digest does: Thunderstore versions
# are immutable in principle, the checksum is what makes that so in
# practice. Bumping a version means bumping its checksum, and the
# module refuses a download that does not match. Neither is edited by
# hand:
#
#   invoke valheim-mods            # what is outdated, what is unmet
#   invoke valheim-mods --update   # move every pin to the latest
#
# The second rewrites version and checksum in place and deploys
# nothing; playbooks/valheim.yml does that, after a look at the diff.
#
# Removing an entry removes the mod on the next run - its staged
# directories, and any config file it shipped that nobody has edited.
#
# Dependencies are NOT resolved. Every package's dependencies are
# listed explicitly, apart from denikson-BepInExPack_Valheim, which
# the image installs itself (`BEPINEX: "true"` in the compose file).
#
# WHO HAS TO INSTALL WHAT. Grouped below by that, because "a mod on
# the server" covers three different things for a player:
#
#   server only    - vanilla clients join and play as normal.
#   admin client   - the server side, and the admin's own client for
#                    the console commands. Other players need nothing.
#   every client   - every player needs the same mod at the same
#                    version. Jotunn and ConditionalConfigSync refuse
#                    a connection that does not match, so a player
#                    missing one is turned away at the door rather
#                    than getting a subtly different game.
valheim_mods:
  # Libraries. Needed wherever anything below that depends on them
  # is - which, since that includes "every client" mods, means every
  # client.
  - name: ValheimModding-Jotunn
    version: "2.30.2"
