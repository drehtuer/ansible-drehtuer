- name: Install time packages
  ansible.builtin.apt:
    install_recommends: false
    name:
      - cron
      - ntpsec
      # hwclock
      - util-linux-extra
  notify:
    - Set HW clock
- name: Create the ntpd statistics directory
  # ntpd warns at every start that /var/log/ntpsec does not exist. The
  # path is compiled into ntpsec as the default statsdir, and the
  # Debian package ships a rotation timer for it but never creates the
  # directory itself, so on a fresh install it is simply missing.
  #
  # Owned by the user ntpd drops to, not root: it writes here itself
  # once any `statistics` directive is enabled. Nothing here enables
  # one yet, so this only silences the warning today - which is worth
  # it, because a daemon that complains on every restart trains you to
  # ignore what it says.
  ansible.builtin.file:
    path: /var/log/ntpsec
    state: directory
    owner: ntpsec
    group: ntpsec
    mode: "0755"  # NOSONAR
- name: Config for ntpd
  ansible.builtin.template:
    src: templates/ntp.conf.j2
    # ntpsec reads its config from /etc/ntpsec, not /etc/ntp.conf.
    dest: /etc/ntpsec/ntp.conf
    owner: root
    group: root
    mode: "0644"  # NOSONAR
  notify:
    - Restart ntpd
    - Set HW clock
- name: Remove stale /etc/ntp.conf
  # This role used to write here. Nothing reads it, so leaving it
  # behind only invites confusion when debugging the clock.
  ansible.builtin.file:
    path: /etc/ntp.conf
    state: absent
- name: Set timezone
  community.general.timezone:
    hwclock: "UTC"
    name: "{{ time.timezone }}"
  notify:
    - Restart crond
    - Set HW clock
