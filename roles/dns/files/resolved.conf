[Resolve]
DNS=127.0.0.1
# Off, because unbound already validates every answer before resolved
# sees it, and unbound is the only one of the two that can follow a
# root key rollover: its auto-trust-anchor-file tracks the root KSK by
# RFC 5011, while systemd-resolved has the anchor compiled in.
#
# allow-downgrade is NOT a lighter form of this. It only stops
# validating when the upstream cannot do DNSSEC, which unbound can, so
# resolved went on validating in full - until the root switched to
# KSK-2024 (key tag 38696) on 2026-10-11. systemd 255 knows only
# 20326, and from the morning of 2026-10-12 every lookup through the
# stub on carcosa came back SERVFAIL "missing-key" while unbound
# itself kept answering correctly. See doc/STATUS.adoc.
#
# Queries still go to unbound only - verified by stopping it, after
# which resolution fails rather than falling back to the
# DHCP-provided server.
DNSSEC=no
DNSStubListener=yes
