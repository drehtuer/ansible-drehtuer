firewall:  # noqa: var-naming[no-role-prefix] - see doc/STATUS.adoc
  # Connection-rate limiting applied to rules marked `rate_limit`.
  rate_limit:
    seconds: 10
    hitcount: 10
  docker:
    # Docker's published ports bypass INPUT entirely, so when Docker
    # is present the role also manages the DOCKER-USER chain. Turned
    # off, nothing about Docker is written to the rules file.
    enabled: false
    # Interface facing the internet. The default route's interface is
    # the right answer on a single-homed host.
    #
    # Deliberately no fallback: guessing wrong means the DROP below
    # matches nothing and every published container port is exposed,
    # which is silent. Failing to template is the safer error.
    wan_interface: "{{ ansible_facts['default_ipv4'].interface }}"
    # Container ports that may be reached from wan_interface.
    # Everything else forwarded in from outside is dropped.
    published:
      tcp: []
      udp: []
  wireguard:
    # A host terminating the tunnel forwards and masquerades peer
    # traffic, and gains a nat table it otherwise has no use for.
    # Turned off, nothing about the VPN is written to the rules file
    # and the nat table is not emitted at all.
    enabled: false
    interface: wg0
    # Same reasoning as docker.wan_interface above, and the same
    # deliberate absence of a fallback.
    wan_interface: "{{ ansible_facts['default_ipv4'].interface }}"
    # Peer ranges, masqueraded on the way out. Set from the matching
    # `wireguard` values in the inventory rather than repeated by
    # hand, so the two cannot drift.
    network:
      ip4: ""
      ip6: ""
    listen_port: 51820
    redirect_port: 443
  rules:
    tcp:
      - port: 22
        comment: "SSH"
        rate_limit: true
    udp:
      - port: 53
        comment: "DNS"
