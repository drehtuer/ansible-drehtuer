- name: Update apt repo(s)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
- name: Install base packages
  ansible.builtin.apt:
    install_recommends: false
    name: "{{ apt.packages }}"
- name: Upgrade all packages
  # Explicitly requested only, never a side effect of an untagged run.
  # Previously this hung off a handler notified by the cache refresh,
  # which made a full upgrade depend on how long ago the play last
  # ran rather than on intent. Routine security patching is handled by
  # unattended-upgrades.
  ansible.builtin.apt:
    upgrade: "full"
    autoremove: true
    autoclean: true
  tags:
    - never
    - package-upgrade

- name: Configure unattended upgrades
  ansible.builtin.template:
    src: "templates/{{ item.src }}"
    dest: "/etc/apt/apt.conf.d/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"  # NOSONAR
  loop:
    - src: 20auto-upgrades.j2
      dest: 20auto-upgrades
    - src: 51-unattended-origins.j2
      dest: 51-unattended-origins
    - src: 52-unattended-reboot.j2
      dest: 52-unattended-reboot
  loop_control:
    label: "{{ item.dest }}"
