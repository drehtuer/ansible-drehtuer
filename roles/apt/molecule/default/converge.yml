# Values are inline rather than read from inventories/test, so the
# scenario works with a bare `molecule test` from this directory.
- name: Converge
  hosts: all
  vars:
    apt:
      # Overriding the role's top-level dict *replaces* its defaults,
      # so every key the role requires has to be repeated here - a
      # missing one fails the argument spec, not the task that uses it.
      # See doc/STATUS.adoc.
      unattended:
        updates: true
        reboot: false
        reboot_with_users: false
        reboot_time: "04:00"
      packages:
        - bash
        - python3
  roles:
    - apt
