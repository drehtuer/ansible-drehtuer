argument_specs:
  main:
    short_description: Refresh apt and install base packages
    description:
      - Refreshes the apt cache and installs the base package set.
        A full package upgrade is available behind the
        `package-upgrade` tag.
    options:
      apt:
        type: dict
        required: true
        description: Apt settings.
        options:
          unattended:
            type: dict
            required: true
            description: Unattended-upgrade behaviour.
            options:
              updates:
                type: bool
                required: true
                description:
                  - Also install from the -updates pocket, not only
                    -security. Ubuntu sometimes ships a security fix
                    there first.
              reboot:
                type: bool
                required: true
                description: Reboot automatically when an update needs it.
              reboot_with_users:
                type: bool
                required: true
                description: Reboot even when users are logged in.
              reboot_time:
                type: str
                required: true
                description: Time of day for the reboot, HH:MM.
          packages:
            type: list
            elements: str
            required: true
            description: Packages installed on every host.
