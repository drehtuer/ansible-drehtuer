argument_specs:
  main:
    short_description: Set hostname, hosts file and system locales
    description:
      - Sets the system hostname, writes /etc/hosts, and generates
        the configured locales.
    options:
      hostname_fqdn:
        type: str
        required: true
        description:
          - Fully qualified domain name to set as the system
            hostname.
      hostname:
        type: str
        required: true
        description:
          - Short hostname, written to /etc/hosts after the fully
            qualified name.
      ip_v4:
        type: str
        required: true
        description:
          - The host's IPv4 address. Written to /etc/hosts only if the
            host actually holds it.
      ip_v6:
        type: str
        required: true
        description:
          - The host's IPv6 address. Written to /etc/hosts only if the
            host actually holds it - the lab guests declare one they do
            not have.
      system:
        type: dict
        required: true
        description: System settings.
        options:
          extra_names:
            type: list
            elements: str
            required: true
            description:
              - Extra names for this host's own addresses, written
                beside the hostname. Empty on a host whose served names
                are in public DNS; populated on one where they are not,
                so that the host can resolve the vhosts it serves.
          locales:
            type: dict
            required: true
            description: Locale settings.
            options:
              locale:
                type: str
                required: true
                description: Default locale, used for LANG.
              locale_time:
                type: str
                required: true
                description: Locale used for LC_TIME.
              locale_gen:
                type: list
                elements: str
                required: true
                description: Locales to generate.
