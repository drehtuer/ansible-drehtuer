argument_specs:
  main:
    short_description: Dovecot IMAP/LMTP/Sieve
    description:
      - Installs Dovecot core/IMAP/LMTP/Sieve and deploys Sieve-pipe
        scripts that call RSpamd's ham/spam learning API, so moving
        mail into or out of the Spam folder trains the filter.
      - Accounts are domainless. `auth_username_format = %n` strips the
        domain from every auth request, login and LMTP recipient
        lookup alike, so all of this host's domains share one inbox per
        account instead of one per domain.
    options:
      domain:
        type: str
        required: true
        description: Primary domain, used as the LMTP postmaster address.
      domain_aliases:
        type: list
        elements: str
        required: true
        description:
          - Secondary domains this host also serves. Not configured
            anywhere in Dovecot - accounts have no domain at all - and
            read only to record in dovecot.conf which domains the
            stripped-username rule is covering. The mail role is what
            decides which of them reach LMTP.
      hostname_fqdn:
        type: str
        required: true
        description: Fully qualified host name, used to locate the TLS cert.
      imap:
        type: dict
        required: true
        description: IMAP settings.
        options:
          conf:
            type: dict
            required: true
            description: Dovecot config settings.
            options:
              maildir:
                type: str
                required: true
                description:
                  - Mail store location, as Dovecot's mail_location
                    expects it (e.g. `~/.mail`). Also read by the
                    maildir-import tool, so that importing an account
                    from another server cannot write it somewhere
                    Dovecot does not read.
              logfile:
                type: str
                required: true
                description:
                  - Dovecot's `log_path`, which takes it off syslog and
                    onto a file of its own. Read by the logrotate
                    template too, so rotation cannot be pointed at a
                    file Dovecot is not writing.
              ssl:
                type: dict
                required: true
                description: TLS settings.
                options:
                  cert:
                    type: str
                    required: true
                    description: Certificate path.
                  key:
                    type: str
                    required: true
                    description: Private key path.
                  ca:
                    type: str
                    required: true
                    description: CA chain path.
          metrics:
            type: dict
            required: true
            description:
              - Dovecot's own openmetrics endpoint, scraped by
                Prometheus. Dovecot exports these itself; there is no
                exporter to install.
            options:
              enabled:
                type: bool
                required: true
                description: Whether to open the listener at all.
              listen_address:
                type: str
                required: true
                description: Address to bind. Loopback.
              port:
                type: int
                required: true
                description: Port to bind.
          logrotate:
            type: dict
            required: true
            description:
              - Rotation for `imap.conf.logfile`. Dovecot's package
                ships none, because by default it logs to syslog and
                has nothing of its own to rotate.
            options:
              frequency:
                type: str
                required: true
                description:
                  - A logrotate interval keyword, e.g. `daily` or
                    `weekly`, emitted verbatim into the config.
              rotate:
                type: int
                required: true
                description: How many rotated files to keep.
      spam:
        type: dict
        required: true
        description:
          - Shared with the spam role. Three keys are read here -
            spam.http_port (RSpamd's controller, used to submit
            learn-ham/learn-spam calls), spam.controller_password, and
            spam.fuzzy_flag, the flag those same calls file body hashes
            under, which has to match the fuzzy_check rule the spam
            role writes.
            Deliberately declared without suboptions - listing them
            would make validation reject every other key the spam role
            itself requires.
