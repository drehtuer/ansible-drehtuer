imap:  # noqa: var-naming[no-role-prefix] - see doc/STATUS.adoc
  conf:
    # Where mail is stored, in the form Dovecot's mail_location wants.
    # Read by maildir-import as well, so that a migration cannot put
    # mail somewhere Dovecot is not looking.
    maildir: ~/.mail
    # Takes Dovecot off syslog and onto a file of its own. Read by the
    # logrotate template as well, so rotation cannot end up pointed at
    # a file Dovecot is not writing - and note that roles/fail2ban's
    # `dovecot` jail reads this same path, set independently in its own
    # `logpath`. Three places, one value here for two of them.
    logfile: /var/log/dovecot.log
    ssl:
      cert: /etc/letsencrypt/live/{{ hostname_fqdn }}/fullchain.pem
      key: /etc/letsencrypt/live/{{ hostname_fqdn }}/privkey.pem
      ca: /etc/letsencrypt/live/{{ hostname_fqdn }}/chain.pem
  # ManageSieve (RFC 5804) - the protocol a mail client uses to read
  # and write the user's *own* sieve script on the server, which is
  # what makes filtering self-service instead of an inventory edit.
  # Nextcloud Mail's filter editor speaks it, as do the desktop
  # ManageSieve clients; no Android mail client does.
  #
  # On rather than off: the listener inherits `listen = *, ::` like
  # every other one here, so what decides who can reach it is
  # roles/firewall - which opens 993 and deliberately does not open
  # this port. The host still reaches its own public address over
  # `lo`, which is how Nextcloud connects from this same machine.
  managesieve:
    enabled: true
    port: 4190
    # Caps on what a user can store, because this is the one part of
    # Dovecot's configuration a user can write to. Ten scripts and
    # 64k each is far beyond any hand-written filter set and still
    # bounded.
    max_scripts: 10
    max_script_size: 64k
  # Rotation for the log above. Dovecot's own package ships none,
  # because out of the box it logs to syslog and has nothing of its own
  # to rotate - diverting it is this role's decision, so rotating it is
  # this role's job.
  # Dovecot's built-in Prometheus export, on by default. Nothing else
  # in the inventory overrides this role, so the default *is* the
  # production value - and the listener is loopback-only and costs a
  # few counters, so a host that nothing scrapes loses nothing by
  # having it. Whether it is scraped is roles/monitoring's decision.
  metrics:
    enabled: true
    listen_address: 127.0.0.1
    port: 9166
  logrotate:
    # Weekly rather than daily, and kept for half a year: this log is
    # low-volume (roughly 1 MB a week on the production host) and its
    # value is in looking *back*. The brute-force campaign that made
    # the point ran from March to August, so a month of retention would
    # have thrown away most of the evidence while saving nothing worth
    # saving.
    frequency: weekly
    rotate: 26
