- name: Install IMAP (dovecot)
  ansible.builtin.apt:
    install_recommends: false
    name:
      - dovecot-core
      - dovecot-imapd
      - dovecot-lmtpd
      - dovecot-sieve
      # ManageSieve. Installed unconditionally even though
      # `imap.managesieve.enabled` can switch the protocol off: the
      # package only adds a binary Dovecot starts when `protocols`
      # names sieve, so a disabled host carries the package and
      # listens on nothing.
      - dovecot-managesieved
      - curl
      # Required by the maildir-import tool below. Present on the
      # current host anyway, but nothing declared it, so a from-scratch
      # provision would only find out at migration time.
      - rsync
  notify:
    - Restart dovecot
- name: Maildir import script
  # Companion to rspamd-train-bulk (roles/spam): that one seeds the
  # classifier from a corpus already on disk, this one is what gets the
  # corpus - and the rest of the account's mail - off another server.
  # Not run by the role; a tool the administrator invokes when
  # migrating an account onto this host.
  #
  # Holds no secret, unlike the sieve-pipe scripts below, so it is
  # readable and runnable by the mail user - which is who has to run
  # it, since the imported files must end up owned by them.
  ansible.builtin.template:
    src: templates/maildir-import.sh.j2
    dest: /usr/local/bin/maildir-import
    owner: root
    group: root
    mode: '0755'

- name: Rotate the dovecot log
  # dovecot.conf's `log_path` takes Dovecot off syslog and onto its own
  # file, which nothing else then rotates - see the template for what
  # that cost before it was noticed. No handler: logrotate reads this
  # directory afresh on every run, so there is no service to reload.
  ansible.builtin.template:
    src: templates/logrotate/dovecot.j2
    dest: /etc/logrotate.d/dovecot
    owner: root
    group: root
    # logrotate refuses to act on a config that is group- or
    # world-writable, and silently skips it.
    mode: '0644'

- name: Create sieve-pipe directory
  ansible.builtin.file:
    path: /etc/dovecot/sieve-pipe
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Create sieve directory
  ansible.builtin.file:
    path: /etc/dovecot/sieve
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Copy rspam learn ham script
  ansible.builtin.template:
    src: templates/rspamd-learn-ham.sh.j2
    dest: /etc/dovecot/sieve-pipe/rspamd-learn-ham.sh
    owner: root
    group: dovecot
    # Embeds the controller password, so not world-readable. Dovecot
    # runs sieve pipes as the mail user, which needs execute only.
    mode: '0750'
- name: Copy rspam learn spam script
  ansible.builtin.template:
    src: templates/rspamd-learn-spam.sh.j2
    dest: /etc/dovecot/sieve-pipe/rspamd-learn-spam.sh
    owner: root
    group: dovecot
    # Embeds the controller password, so not world-readable. Dovecot
    # runs sieve pipes as the mail user, which needs execute only.
    mode: '0750'
- name: Copy learn-ham sieve script
  ansible.builtin.copy:
    src: files/learn-ham.sieve
    dest: /etc/dovecot/sieve/learn-ham.sieve
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload dovecot
- name: Copy learn-spam sieve script
  ansible.builtin.copy:
    src: files/learn-spam.sieve
    dest: /etc/dovecot/sieve/learn-spam.sieve
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload dovecot
- name: Copy spam-to-folder sieve script
  ansible.builtin.copy:
    src: files/spam-to-folder.sieve
    dest: /etc/dovecot/sieve/spam-to-folder.sieve
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload dovecot
- name: Configure dovecot
  ansible.builtin.template:
    src: templates/dovecot.conf.j2
    dest: /etc/dovecot/dovecot.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload dovecot
- name: Compile sieve scripts
  # Ordered after `Configure dovecot`, not before it: sievec reads
  # dovecot.conf to learn which sieve plugins exist, and the learn
  # scripts open with `require ["imapsieve"]`. Compiling first meant
  # a host whose dovecot.conf predated sieve_imapsieve could never
  # converge: the compile failed, and the task that would have fixed
  # the config ran afterwards.
  #
  # A task rather than a handler, and unconditional. As handlers these
  # only ran when the script file itself changed, so a first compile
  # that failed - or any change made elsewhere, such as loading the
  # imapsieve plugin - left no .svbin behind at all. Dovecot then tries
  # to compile at delivery/IMAP time as the *user*, cannot write into
  # /etc/dovecot/sieve, and silently does nothing: the training scripts
  # never run and no error reaches the playbook.
  #
  # Compiling is deterministic and cheap, so it is not reported as a
  # change; the copy tasks above are what notify the reload.
  #
  # `-c` is load-bearing and was missing. Without it sievec does not
  # read dovecot.conf at all - it compiles against a standalone default
  # set of extensions - so `sieve_plugins` and `sieve_extensions` are
  # never applied and both training scripts fail to compile:
  #
  #   error: require command: unknown Sieve capability `vnd.dovecot.pipe'
  #   error: require command: unknown Sieve capability `imapsieve'
  #
  # which is not a missing package. The plugins are installed and
  # `doveconf plugin/sieve_plugins` reports them correctly; only the
  # compiler was looking somewhere else. Found on a from-scratch VM
  # provision, where it fails the whole role - the ordering comment
  # above addresses a different, earlier failure of the same task.
  ansible.builtin.command:
    cmd: >-
      sievec -c /etc/dovecot/dovecot.conf
      /etc/dovecot/sieve/{{ item }}.sieve
  changed_when: false
  loop:
    - learn-ham
    - learn-spam
    - spam-to-folder
