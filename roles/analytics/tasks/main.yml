# Needs roles/http (nginx, and the certificate covering
# analytics.subdomain) and the access log it writes. Needs roles/nsd
# too, less obviously: the vhost's name has to resolve publicly before
# roles/http next renews, or certbot fails the challenge for it and
# loses the whole certificate. playbooks/site-web.yml records the
# order; doc/STATUS.adoc records why it is not interchangeable.
- name: Install goaccess
  ansible.builtin.apt:
    install_recommends: false
    name:
      - goaccess
# Geolocation. All four are gated on the same flag rather than on a
# block, so that `--tags` and `--check` report each of them by name.
- name: Refuse to report on a database that is never downloaded
  # A typo here is otherwise silent in the way that costs most: the
  # file simply does not exist, the report script skips it with a line
  # in the journal nobody reads, and the panel is absent rather than
  # wrong. Caught at deploy time instead, the same stance as `nginx
  # -t` and `bash -n` elsewhere in this repo.
  ansible.builtin.assert:
    that:
      - analytics_geoip_undownloaded | length == 0
    fail_msg: >-
      analytics.geoip.report_editions names
      {{ analytics_geoip_undownloaded | join(', ') }}, which
      geoipupdate is not asked to download - add it to
      analytics.geoip.editions or drop it from report_editions.
    success_msg: every reported edition is downloaded
  vars:
    analytics_geoip_undownloaded: >-
      {{ analytics.geoip.report_editions
         | difference(analytics.geoip.editions) | list }}
  when: analytics.geoip.enabled

- name: Install geoipupdate
  ansible.builtin.apt:
    install_recommends: false
    name:
      - geoipupdate
  when: analytics.geoip.enabled

- name: Configure geoipupdate
  # `no_log`, because this file carries a MaxMind licence key and a
  # template task shows its diff - so `invoke check-drift` would print
  # the credential every time the file changed. Same separation
  # roles/monitoring makes for Grafana's admin password.
  ansible.builtin.template:
    src: templates/GeoIP.conf.j2
    dest: /etc/GeoIP.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: analytics.geoip.enabled

- name: Enable the GeoIP update timer
  # The packaged timer and service, not ones of this role's: upstream
  # already runs it Wed and Sat with a three-hour jitter and
  # Persistent=true, under tighter sandboxing than anything here, and
  # with an ExecCondition that skips the run when no account is
  # configured. There is nothing to improve on.
  #
  # The package also ships /etc/cron.d/geoipupdate, which is NOT
  # removed - unlike the stale cron job roles/nsd deletes. It guards
  # itself with `test ! -d /run/systemd/system`, so on this host it
  # can never run, and deleting a package's own conffile to prevent
  # something that cannot happen would be a change to explain forever.
  ansible.builtin.systemd_service:
    name: geoipupdate.timer
    state: started
    enabled: true
  when: analytics.geoip.enabled

- name: Download the GeoIP databases
  # Without this the Geo Location panel is empty until the timer's
  # first Wednesday. `creates` keeps it to once per host; the timer
  # owns every later refresh.
  ansible.builtin.command:
    cmd: geoipupdate
    creates: >-
      {{ analytics.geoip.database_dir }}/{{
         analytics.geoip.report_edition }}.mmdb
  when: analytics.geoip.enabled

- name: Create the report directory
  ansible.builtin.file:
    path: "{{ analytics.report_dir }}"
    state: directory
    owner: root
    group: root
    # Served by nginx as www-data, written by the timer as root.
    mode: "0755"
- name: Deploy the report script
  ansible.builtin.template:
    src: templates/analytics-report.sh.j2
    dest: /usr/local/bin/analytics-report
    owner: root
    group: root
    mode: "0755"
    # Caught before it is installed rather than at twenty past the
    # hour, the same stance as `nginx -t` here and `bash -n` in
    # roles/backup. It parses without running, so it finds the
    # unbalanced quote a Jinja loop can introduce - and nothing about
    # what the script would do.
    validate: bash -n %s
- name: Deploy the systemd units
  ansible.builtin.template:
    src: templates/{{ item }}.j2
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ analytics_units }}"
  notify:
    - Reload systemd
- name: Enable the report timer
  # Flush first: a timer cannot be started from a unit file systemd
  # has not read yet, and the handler above is what makes it read it.
  ansible.builtin.systemd_service:
    name: analytics.timer
    state: started
    enabled: true
    daemon_reload: true
- name: Build the first report
  # Without this the vhost answers 404 until twenty past the hour, and
  # a deploy that looks finished but serves nothing is the kind of
  # thing that gets debugged as a broken vhost. `creates` is what
  # keeps it a one-off: every later run belongs to the timer, and this
  # task reports changed exactly once per host.
  ansible.builtin.command:
    cmd: /usr/local/bin/analytics-report
    creates: "{{ analytics.report_dir }}/{{ analytics.report_file }}"
- name: Add htaccess for the analytics report
  # Vault-encrypted and decrypted at deploy time, the same pattern as
  # the spam and fail2ban_ui credentials. `copy` compares content, so
  # replacing the credential is picked up without a separate checksum.
  ansible.builtin.copy:
    src: files/nginx/analytics.htpasswd.aes256
    dest: /etc/nginx/sites-available/analytics.htpasswd
    decrypt: true
    owner: root
    group: root
    mode: "0644"
- name: Enable the analytics htpasswd in nginx
  ansible.builtin.file:
    src: /etc/nginx/sites-available/analytics.htpasswd
    dest: /etc/nginx/sites-enabled/analytics.htpasswd
    state: link
  notify:
    - Reload nginx
- name: Add the analytics site in nginx
  ansible.builtin.template:
    src: templates/nginx/analytics.conf.j2
    dest: /etc/nginx/sites-available/analytics.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx
- name: Enable the analytics site in nginx
  ansible.builtin.file:
    src: /etc/nginx/sites-available/analytics.conf
    dest: /etc/nginx/sites-enabled/analytics.conf
    state: link
  notify:
    - Reload nginx
- name: Validate nginx configuration
  # Same stance as the http, cloud and fail2ban_ui roles: a reload of
  # a broken config leaves the old one serving, so the run would go
  # green with the vhost not actually loaded.
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
