# Override with own variables
fail2ban:  # noqa: var-naming[no-role-prefix] - see doc/STATUS.adoc
  # Applied to every jail unless the jail overrides it.
  defaults:
    bantime: 1h
    findtime: 10m
    maxretry: 5
  jails:
    # `backend` decides where fail2ban looks for failures, and it has
    # to match how the service actually logs. sshd and postfix go to
    # the journal; dovecot and nginx are configured by their roles to
    # write to files, so those jails have to poll the file instead.
    # Escalation for hosts that come back after their ban expires.
    # Without it a persistent scanner is banned for an hour, returns,
    # and is banned for an hour again - indefinitely, at no cost to
    # them. This jail reads fail2ban's own log, so it catches repeat
    # offenders across every jail below.
    - name: recidive
      # Every port: a host that keeps coming back has earned a block on
      # all of them, not just the service it happened to probe last.
      port: all
      filter: recidive
      # Reads fail2ban's own log, not a service's, so it catches repeat
      # offenders across every jail below.
      backend: auto
      logpath: /var/log/fail2ban.log
      bantime: 1w
      findtime: 1d
      maxretry: 3
    - name: sshd
      port: ssh
      filter: sshd
      backend: systemd
    - name: postfix
      port: smtp,submission
      filter: postfix
      backend: systemd
      options:
        mode: normal
        # Overrides the journal match the *packaged* filter ships,
        # which is `_SYSTEMD_UNIT=postfix.service` and can never match
        # on Debian or Ubuntu. Both run Postfix as the instantiated
        # template unit `postfix@-.service`; `postfix.service` is only
        # a wrapper that starts it and then says nothing. The
        # difference is not marginal - measured on the host, the
        # wrapper emitted 14 journal lines in a fortnight and zero
        # authentication failures, while `postfix@-.service` emitted
        # 26186 lines and 399 failures.
        #
        # So the jail was reading a unit with no failures in it and
        # reporting `Total failed: 0` on a host with hundreds of real
        # ones. `fail2ban-regex` against the journal makes it stark:
        # 0 lines and 0 matched with the packaged value, 281429 lines
        # and 9897 matched with this one.
        #
        # Set here rather than in a filter.d override because the
        # packaged filter is not ours to edit - `.conf` files belong to
        # the distribution - and because a per-jail `journalmatch` is
        # what fail2ban documents for exactly this case.
        journalmatch: _SYSTEMD_UNIT=postfix@-.service
    # A second jail over the same service and the same journal, and it
    # has to be a second one rather than a mode change on the jail
    # above. The postfix filter selects *one* `mdre-<mode>` set rather
    # than combining them, so `mode = auth` would trade the delivery
    # rejects for the authentication failures instead of adding them.
    # Measured against the real journal with `fail2ban-regex`: mode
    # `normal` matches 4402 lines, mode `auth` matches 17160, and they
    # are different lines.
    #
    # What was going uncounted was the whole SMTP-AUTH brute force -
    # 9357 failures in a fortnight against 0 successes. Temper the
    # expectation, though: it arrived from 1672 distinct addresses, so
    # per-address banning only reaches the persistent ones (the
    # busiest managed 240). `recidive` is what catches the rest.
    - name: postfix-auth
      port: smtp,submission
      filter: postfix
      backend: systemd
      options:
        mode: auth
        # Same correction as the jail above: Debian and Ubuntu run
        # Postfix as the instantiated template unit, and the packaged
        # `postfix.service` says almost nothing.
        journalmatch: _SYSTEMD_UNIT=postfix@-.service
    - name: dovecot
      port: imaps
      filter: dovecot
      backend: auto
      # Set by roles/imap (dovecot.conf.j2 `log_path`).
      logpath: /var/log/dovecot.log
    - name: nginx-http-auth
      port: https
      filter: nginx-http-auth
      backend: auto
      # Set by roles/http (nginx.conf `error_log`).
      logpath: /var/log/nginx/error.log
    - name: nginx-404
      port: https
      # Not shipped by the fail2ban package, deployed by this role.
      filter: nginx-404
      backend: auto
      # Set by roles/http (nginx.conf `access_log`).
      logpath: /var/log/nginx/access.log
      maxretry: 20
