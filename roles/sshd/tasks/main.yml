- name: Install sshd
  ansible.builtin.apt:
    install_recommends: false
    name:
      - openssh-server
# `copy` compares the decrypted source against the destination, so it
# is already idempotent - no separate checksum probe is needed.
- name: Copy sshd host keys
  ansible.builtin.copy:
    src: "files/ssh_{{ hostname }}_{{ item }}_key.aes256"
    dest: "/etc/ssh/ssh_{{ hostname }}_{{ item }}_key"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ sshd.host_keys }}"
  notify: Restart sshd
- name: Copy sshd moduli
  # Small DH moduli are stripped from this file, as per the
  # ssh-audit hardening guide.
  ansible.builtin.copy:
    src: files/moduli
    dest: /etc/ssh/moduli
    owner: root
    group: root
    mode: "0644"  # NOSONAR
  notify: Restart sshd
- name: Ensure the privilege separation directory exists
  # Normally created by sshd's own service startup. Validating the
  # config below needs it to exist first, and nothing has started the
  # service yet at this point in the role.
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"  # NOSONAR
- name: SSHd config
  ansible.builtin.template:
    src: templates/sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0644"  # NOSONAR
    # Refuse to install a config sshd cannot parse. Without this a
    # typo here locks everyone out of the host on the next restart.
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart sshd
- name: Systemd enable sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: started
    enabled: true
