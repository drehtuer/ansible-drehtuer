# Ansible managed
#
# Maps the client's Upgrade header onto the Connection header nginx
# should send upstream, which is what a WebSocket proxy needs. Lives in
# conf.d because a `map` is only valid in the http context, and the
# vhost that uses it is a server block.
#
# Written as a map rather than a literal `Connection: upgrade` in the
# vhost so that ordinary requests - everything except the WebSocket
# handshake - still get `Connection: close` instead of being told to
# upgrade a connection they never asked to upgrade.
#
# Owned by roles/http, which is where this file's own earlier note said
# it belonged once a second vhost needed it. Four do now - cloud,
# fail2ban_ui, monitoring and valheim. It cannot be owned by any one of
# them: defining the same map twice is an nginx startup error, not a
# warning, so it lives with the role that owns nginx itself and each
# consumer simply uses $connection_upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
