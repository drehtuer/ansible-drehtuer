argument_specs:
  main:
    short_description: nginx, PHP-FPM and Let's Encrypt certificates
    description:
      - Installs nginx, certbot and PHP-FPM, obtains a certificate
        covering every configured domain, and renders the static
        vhosts. Application roles add their own vhost rather than
        appearing in `sites`.
    options:
      domain:
        type: str
        required: true
        description: Primary domain, the first entry in http.domains.
      domain_aliases:
        type: list
        elements: str
        required: true
        description:
          - Secondary domains this host also serves. Appended to
            http.domains by default, so they reach the certificate and
            every vhost. The mail role reads the same fact.
      hostname_fqdn:
        type: str
        required: true
        description:
          - Fully qualified host name. Included in the certificate and
            used as its lineage name.
      http:
        type: dict
        required: true
        description: HTTP settings.
        options:
          port_http:
            type: int
            required: true
            description:
              - Plain HTTP port, serving the ACME challenge and the
                redirect.
          port_https:
            type: int
            required: true
            description: HTTPS port.
          stub_status:
            type: dict
            required: true
            description:
              - nginx's own status page, read by
                prometheus-nginx-exporter. Bound to loopback on a port
                of its own rather than exposed inside a served vhost.
            options:
              enabled:
                type: bool
                required: true
                description: Whether to serve it at all.
              listen_address:
                type: str
                required: true
                description: Address to bind. Loopback.
              port:
                type: int
                required: true
                description: Port to bind.
              path:
                type: str
                required: true
                description: Path the exporter scrapes.
          domains:
            type: list
            elements: str
            required: true
            description:
              - Every domain served by this host. Extends both the
                certificate and every vhost.
          letsencrypt:
            type: dict
            required: true
            description: Certificate settings.
            options:
              email:
                type: str
                required: true
                description: Registration contact address.
              webroot_path:
                type: str
                required: true
                description: Directory served at /.well-known/acme-challenge.
              cert_name:
                type: str
                required: true
                description:
                  - Lineage name, i.e. the directory under
                    /etc/letsencrypt/live that other roles read.
              subdomains:
                type: list
                elements: str
                required: true
                description:
                  - Subdomains added to the certificate for every
                    domain.
          sites:
            type: list
            elements: dict
            required: true
            description: Static vhosts to render.
            options:
              name:
                type: str
                required: true
                description: Config file name under sites-available.
              subdomains:
                type: list
                elements: str
                required: true
                description:
                  - Subdomains this vhost answers for, per domain.
                    An empty string means the domain itself.
              root:
                type: str
                required: true
                description: Document root.
              spa_fallback:
                type: bool
                default: false
                description:
                  - Serve /index.html for paths that do not exist,
                    instead of 404. Only for a site that routes in the
                    browser; it makes every probe answer 200 and stops
                    the nginx-404 jail seeing anything.
              include_locations:
                type: bool
                default: false
                description:
                  - Include locations-enabled/*.conf, i.e. location
                    blocks contributed by other roles.
