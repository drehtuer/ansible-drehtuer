- name: Install nginx, certbot, php-fpm
  ansible.builtin.apt:
    install_recommends: false
    name:
      - nginx
      - apache2-utils
      # `letsencrypt` is only a transitional package for this.
      - certbot
      - php-fpm
      # Needed by the Nextcloud cron jobs, and to detect the version
      # below. Was previously relied on without ever being installed.
      - php-cli
  notify:
    - Restart nginx
    - Restart php-fpm
# Everything PHP is versioned - the service, the pool socket and the
# config paths. Hardcoding 8.3 meant the whole stack broke silently on
# a release upgrade, which this repo has a dedicated role for.
- name: Detect PHP version
  ansible.builtin.command:
    cmd: php -r "echo PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;"
  changed_when: false
  # Runs in check mode too. It is a read-only `php -r`, and every
  # later task that names a service or a config path depends on the
  # fact it sets - so skipping it (which check mode does to `command`
  # by default) left the version empty and made `invoke check-drift`
  # fail with "Could not find the requested service php-fpm" instead
  # of reporting drift. Same reason the certificate SAN read below
  # opts out.
  check_mode: false
  register: http_php_version_cmd
- name: Set PHP version fact
  ansible.builtin.set_fact:
    http_php_version: "{{ http_php_version_cmd.stdout | trim }}"
- name: Create nginx configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/nginx/conf-server
    # Was /etc/sites-available, which created a stray directory at the
    # top of /etc and never the one nginx reads.
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
    - /etc/nginx/locations-available
    - /etc/nginx/locations-enabled
- name: Create directory for certbot webroot
  ansible.builtin.file:
    path: "{{ http.letsencrypt.webroot_path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
- name: Create DH parameters for nginx (may take a while)
  ansible.builtin.command:
    cmd: >
      openssl dhparam -out /etc/nginx/dhparam.pem 4096
  args:
    creates: /etc/nginx/dhparam.pem
- name: Remove packaged nginx site configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/conf.d/default.conf
- name: Configuration for nginx
  ansible.builtin.copy:
    src: files/nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx
- name: Shared configuration snippets for nginx
  ansible.builtin.copy:
    src: "files/{{ item }}"
    dest: "/etc/nginx/conf-server/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - general.conf
    - security.conf
    - php-fpm.conf
  notify:
    - Reload nginx
    - Restart php-fpm
- name: Shared ssl configuration for nginx
  ansible.builtin.template:
    src: templates/ssl.conf.j2
    dest: /etc/nginx/conf-server/ssl.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx
- name: PHP-FPM upstream for nginx
  ansible.builtin.template:
    src: templates/php_fpm_upstream.conf.j2
    dest: /etc/nginx/conf.d/php_fpm_upstream.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx
# The port 80 vhost goes up before certbot runs: it serves the ACME
# challenge, so it must work without a certificate.
- name: Forward http2https for nginx
  ansible.builtin.template:
    src: templates/http_to_https.conf.j2
    dest: /etc/nginx/sites-available/http_to_https.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx
- name: Enable http2https site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/http_to_https.conf
    dest: /etc/nginx/sites-enabled/http_to_https.conf
    state: link
  notify:
    - Reload nginx
- name: Catch-all for names this host does not serve
  # Deployed here, beside the redirect vhost and before the first
  # `nginx -t`, because the two are one decision: this file takes
  # `server_name _` over from that one. Neither half depends on a
  # certificate existing - the 443 block rejects the handshake rather
  # than presenting one - so this is safe on a host certbot has never
  # run on.
  ansible.builtin.template:
    src: templates/default_server.conf.j2
    dest: /etc/nginx/sites-available/default_server.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx
- name: Enable the catch-all
  ansible.builtin.file:
    src: /etc/nginx/sites-available/default_server.conf
    dest: /etc/nginx/sites-enabled/default_server.conf
    state: link
  notify:
    - Reload nginx
- name: Validate nginx configuration before serving the ACME challenge
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
- name: Ensure nginx is running
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true
- name: Let's Encrypt configuration for certbot
  ansible.builtin.copy:
    src: files/letsencrypt_cli.ini
    dest: /etc/letsencrypt/cli.ini
    owner: root
    group: root
    mode: "0644"
- name: WebSocket upgrade map for nginx
  # A `map` is only valid in the http context, so it lives in conf.d
  # rather than in the vhosts that use it - and it is owned here rather
  # than by either consumer, because defining the same map twice is an
  # nginx startup error. Both roles/fail2ban_ui and roles/talk proxy
  # WebSockets and simply use $connection_upgrade.
  ansible.builtin.copy:
    src: files/nginx/websocket_upgrade_map.conf
    dest: /etc/nginx/conf.d/websocket_upgrade_map.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx

- name: Create certbot deploy hook directory
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Reload services after certificate renewal
  ansible.builtin.copy:
    src: files/certbot-deploy-hook.sh
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-services.sh
    owner: root
    group: root
    mode: "0755"
- name: Build the list of names the certificate has to cover
  ansible.builtin.set_fact:
    # The host FQDN, each domain itself, and every subdomain of every
    # domain. Sorted and deduplicated so the comparison below is
    # independent of the order certbot happens to store them in.
    http_cert_names: >-
      {{ ([hostname_fqdn] + (http.domains | list)
          + (http.domains | product(http.letsencrypt.subdomains)
             | map('reverse') | map('join', '.') | list))
         | unique | sort }}
- name: Check for an existing certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ http.letsencrypt.cert_name }}/cert.pem"
  register: http_cert
- name: Read the names on the existing certificate
  ansible.builtin.command:
    cmd: >-
      openssl x509 -noout -ext subjectAltName
      -in /etc/letsencrypt/live/{{ http.letsencrypt.cert_name }}/cert.pem
  register: http_cert_san
  changed_when: false
  # Reads nothing but the certificate already on disk, and the task
  # below needs its output to decide anything at all in check mode.
  check_mode: false
  when: http_cert.stat.exists
- name: Collect the names on the existing certificate
  ansible.builtin.set_fact:
    http_cert_current: >-
      {{ http_cert_san.stdout | default('')
         | regex_findall('DNS:([^,\s]+)') | unique | sort }}
- name: Issue or expand the certificate
  # Deliberately not guarded with `creates:` on the lineage. That only
  # answers whether *a* certificate exists, not whether it covers the
  # names this host now serves - so adding a domain to http.domains
  # rendered vhosts for it and then served them with a certificate
  # that did not match, with the run reporting success. Comparing the
  # SANs is what makes adding a domain a one-line inventory change.
  #
  # --expand is what lets certbot extend the existing lineage
  # non-interactively; it is a no-op on a first issuance.
  ansible.builtin.command:
    cmd: >
      certbot certonly
      --cert-name {{ http.letsencrypt.cert_name }}
      -w {{ http.letsencrypt.webroot_path }}
      {{ http_cert_names | map('regex_replace', '^', '-d ') | join(' ') }}
      --expand
      --non-interactive
      --agree-tos
      --email {{ http.letsencrypt.email }}
  when: >-
    not http_cert.stat.exists
    or http_cert_names | symmetric_difference(http_cert_current) | length > 0
  # Only runs when the two sets actually differ, so it always did
  # something when it ran. The deploy hook installed above reloads
  # nginx, postfix and dovecot afterwards.
  changed_when: true
- name: Enable certbot renewal timer
  # certbot.service is a oneshot without an [Install] section - it can
  # be neither enabled nor reloaded. The timer is what schedules
  # renewal.
  ansible.builtin.systemd_service:
    name: certbot.timer
    state: started
    enabled: true
# TLS vhosts come last: they reference the certificate, so nginx
# cannot load them until certbot has produced it.
- name: Status page for prometheus-nginx-exporter
  # /etc/nginx/conf.d rather than sites-available: this is not a vhost
  # for a domain this host serves, it is a loopback listener for the
  # exporter, and http.sites builds server_name from the domain list.
  ansible.builtin.template:
    src: templates/stub_status.conf.j2
    dest: /etc/nginx/conf.d/stub_status.conf
    owner: root
    group: root
    mode: "0644"
  when: http.stub_status.enabled
  notify:
    - Reload nginx

- name: Remove the status page where it is not wanted
  ansible.builtin.file:
    path: /etc/nginx/conf.d/stub_status.conf
    state: absent
  when: not http.stub_status.enabled
  notify:
    - Reload nginx

- name: Sites for nginx
  ansible.builtin.template:
    src: templates/site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ http.sites }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    site: "{{ item }}"
  notify:
    - Reload nginx
- name: Enable sites for nginx
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item.name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ item.name }}.conf"
    state: link
  loop: "{{ http.sites }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Reload nginx
- name: Validate nginx configuration
  # nginx keeps serving the old config if a reload fails, but the next
  # restart would not come back up. Fail here instead.
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
