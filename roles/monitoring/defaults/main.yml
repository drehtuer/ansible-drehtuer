monitoring:  # noqa: var-naming[no-role-prefix] - see doc/STATUS.adoc
  # Collection and mail alerting (phase 1) plus the Grafana frontend
  # at status.<domain> (phase 2). Every listener is still on loopback
  # and roles/firewall opens no port for any of them - nginx is the
  # only way in, and only to Grafana.
  #
  # The live values are in inventories/group_vars/all/monitoring.yml,
  # which exists because the Grafana admin password belongs in
  # inventory rather than in a role default. That file REPLACES this
  # dict rather than merging into it, so anything added here has to be
  # added there too or the role stops seeing it. See doc/STATUS.adoc.
  # The vhost all three of these are served under. Promoted out of
  # the grafana block once Prometheus and Alertmanager joined it there:
  # it names the site, not any one of the apps on it.
  subdomain: status
  prometheus:
    # Served at this path under the vhost above. Prometheus derives its
    # route prefix from the external URL, so this moves *every* one of
    # its paths - which is why the self-scrape below names
    # <path>metrics rather than /metrics.
    path: /prometheus/
    # The packaged binary listens on 0.0.0.0:9090 - read out of the
    # .deb rather than assumed - so this override is the only thing
    # keeping it off the public addresses until nginx is in front of
    # it. Same stance roles/database takes with MariaDB and Redis:
    # the binding is owned here rather than inherited from the
    # package, where an upgrade could change it with nothing to
    # notice.
    listen_address: 127.0.0.1
    port: 9090
    scrape_interval: 15s
    evaluation_interval: 15s
    # Prometheus keeps 15 days if neither retention flag is given.
    # Time bounds how far back a question can be asked; size bounds
    # what a runaway series count can cost the same disk that holds
    # 104 GB of Nextcloud data. Whichever is reached first wins.
    retention_time: 90d
    retention_size: 8GB
    # A dpkg conffile the role takes over. Nothing load-bearing is
    # lost by replacing it - the packaged file only scrapes
    # Prometheus itself - which is what makes this safe where
    # replacing Redis's config file was not.
    # Installed from the upstream release rather than the archive:
    # the packaged server carries no modern web UI at all - see
    # tasks/main.yml - and 24.04 is four minor releases behind.
    # Checksums are the sha256 from upstream's own
    # sha256sums.txt, one per build.
    version: "3.14.0"
    checksums:
      amd64: f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d
      arm64: 077f3781ab7245dc04c9a3c9b78ba120fc8e41aa0dc97489b0af67247e50ba83
    install_dir: /opt
    # The path the packaged binary defaulted to, kept so that the
    # history collected under the package carries over.
    data_dir: /var/lib/prometheus/metrics2
    config_file: /etc/prometheus/prometheus.yml
    # Owned entirely by this role, unlike the file above.
    rules_dir: /etc/prometheus/rules
  # Collectors that write into node_exporter's textfile directory,
  # for things nothing exports: fail2ban's jail counters, the packet
  # filter's own per-rule counters, and nsd's zone serials and
  # signature expiry. Each reads something an unprivileged process
  # cannot, so all run from a timer as root rather than being scraped
  # directly. Each carries its own interval - see `nsd` below, which
  # is the one that leaves the host.
  textfile:
    fail2ban:
      enabled: false
      interval: 1min
    packetfilter:
      enabled: false
      interval: 1min
    # Zone serials, the serials the delegated nameservers are actually
    # serving, and DNSSEC signature expiry - the checks roles/nsd makes
    # at deploy time, made continuous. Between deploys nothing watched
    # any of them, and every one of those failures is silent: this host
    # goes on answering correctly while the world holds something
    # stale.
    #
    # A far longer interval than the other two, and deliberately: this
    # one leaves the host to ask Hetzner's nameservers, where the
    # others read local state. A transfer takes minutes to settle, so
    # asking every minute would cost traffic to measure nothing new.
    nsd:
      enabled: false
      interval: 15min
  # Per-service exporters. Everything here binds loopback, is scraped
  # over loopback, and is opened in no firewall - the same stance as
  # the servers above.
  #
  # All off by default. An exporter for a service the host does not
  # run is a unit that fails at every boot, and this role is deployed
  # to hosts that run different subsets; the inventory turns on what
  # is actually there.
  exporters:
    listen_address: 127.0.0.1
    nginx:
      enabled: false
      port: 9113
      # Served by roles/http as http.stub_status - the two have to
      # agree, and nothing enforces it.
      status_url: http://127.0.0.1:8080/stub_status
    mysqld:
      enabled: false
      port: 9104
      # Authenticates through the unix socket as the prometheus system
      # user, so no password exists to store or rotate. Creating the
      # account needs MariaDB's root credentials, which the inventory
      # wires from the database role rather than duplicating.
      user: prometheus
      socket: /var/run/mysqld/mysqld.sock
      my_cnf: /etc/prometheus/mysqld-exporter.my.cnf
      root_user: root
      root_password: ""
    redis:
      enabled: false
      port: 9121
      addr: redis://127.0.0.1:6379
    postfix:
      enabled: false
      port: 9154
      logfile: /var/log/mail.log
      showq: /var/spool/postfix/public/showq
    # No exporter to install: Dovecot exports Prometheus metrics
    # itself, from imap.metrics. That port and this one have to agree.
    dovecot:
      enabled: false
      port: 9166
    # Likewise RSpamd, whose controller serves /metrics. It answers
    # only to a Password header - not basic auth, which it rejects -
    # so the scrape config sends one.
    rspamd:
      enabled: false
      port: 11334
      password: ""
  # End-to-end probes, via the packaged blackbox exporter. Everything
  # else in this role measures a service from the inside - a process
  # that is running, a counter that moves - and none of that says the
  # name answers, with the right certificate, from a client's side of
  # the socket. This is the only part that asks.
  #
  # It also brings certificate expiry with it: every TLS probe reports
  # probe_ssl_earliest_cert_expiry, so the certificate is measured
  # where it is *served* rather than where it is stored.
  blackbox:
    enabled: false
    # Loopback, like every other exporter here. The packaged ARGS set
    # no bind address at all, so the default is every interface.
    listen_address: 127.0.0.1
    port: 9115
    # A dpkg conffile this role takes over. The packaged version holds
    # only examples - pop3, grpc, irc, ssh, icmp - so nothing the
    # distribution set is lost by owning it.
    config_file: /etc/prometheus/blackbox.yml
    # Per probe, and well inside the scrape interval: a probe that has
    # not answered in five seconds is a finding, not a slow network.
    timeout: 5s
    web:
      # Subdomains expected to answer 2xx, crossed with http.domains.
      # The empty string is the apex. These are names, not URLs - the
      # role builds the URL.
      public:
        - ""
        - www
        - mail
        - cloud
      # Subdomains behind the shared basic-auth credential, expected
      # to answer 401. Checking for 401 rather than for "200 or 401"
      # is deliberate: the weaker check cannot tell a working gate
      # from a missing one.
      guarded:
        - spam
        - f2b
        - status
    mail:
      # One Postfix and one Dovecot serve every domain, so the probes
      # name the host the certificate is served under rather than
      # repeating themselves per domain.
      host: ""
      # STARTTLS: plain ESMTP first, TLS negotiated. 25 is the MX, 587
      # submission. Both are opened by roles/firewall.
      starttls_ports:
        - 25
        - 587
      # TLS from the first byte. 465 is deliberately absent - this
      # host does not offer it, and the firewall opens no such port.
      imaps_ports:
        - 993
    dns:
      authoritative:
        # NSD answering for each zone on the public address. Note this
        # is the *hidden primary*, so a failure here does not take a
        # domain down - the secondaries answer from their own copies -
        # but it does stop every future change propagating, which is
        # the failure that went unnoticed for 21 hours in 2026-08.
        enabled: false
        # Address and port NSD binds. Not loopback, which is
        # unbound's. The port is written out rather than left to
        # blackbox's default so that the `instance` label on every
        # resulting series names what was actually queried.
        server: ""
        # Wired from nsd.zones by the inventory rather than repeated,
        # the same stance the mysqld and rspamd exporters take with
        # credentials that belong to another role.
        zones: []
        # Individual names that must exist, as opposed to zones that
        # must answer. A zone answers its SOA perfectly well with a
        # record missing from it, so the zone checks above cannot see
        # this class of failure at all. Empty by default: which names
        # matter is a property of the host, not of the role.
        records: []
      recursive:
        # unbound on loopback. Answering the control socket proves the
        # process is alive, not that recursion works - and roles/spam
        # points RSpamd's resolver here, so a broken unbound silently
        # turns off every SPF, DKIM, DMARC and RBL check with nothing
        # logged anywhere.
        enabled: false
        server: 127.0.0.1:53
        # A name outside every zone this host is authoritative for, so
        # the answer can only come from recursion. Deliberately not a
        # name belonging to this infrastructure.
        query_name: one.one.one.one
  alertmanager:
    # Deliberately not served through the vhost, unlike Prometheus and
    # Grafana: it stays on loopback with no route prefix. Its web
    # interface adds little over the alert list Prometheus already
    # shows, and the one thing it does add - creating silences - is
    # exactly the thing worth keeping off a page guarded by a single
    # shared credential. Silences are made with `amtool` on the host.
    listen_address: 127.0.0.1
    port: 9093
    config_file: /etc/prometheus/alertmanager.yml
    mail:
      # Delivered through the Postfix this repo already configures,
      # over loopback, so there is no credential and no TLS to
      # arrange. Note the circularity that buys: an alert about
      # Postfix cannot be mailed by Postfix. The Watchdog alert is
      # the only answer available on a single host.
      smarthost: 127.0.0.1:25
      from: "monitoring@{{ domain }}"
      # `root` already forwards to the administrator through
      # mail.aliases, so this needs no new alias and leaves one place
      # to change where alerts land.
      to: "root@{{ domain }}"
      # Loopback to a Postfix that offers STARTTLS opportunistically;
      # requiring it here would fail the send for no gain in
      # confidentiality, the traffic never leaving the host.
      require_tls: false
    # Wait before the first mail for a new alert group, before a
    # newly firing alert joins an existing group's mail, and before
    # an alert that is still firing is mailed again.
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 24h
    resolve_timeout: 5m
    # The always-firing Watchdog alert is mailed on this interval and
    # its *absence* is the signal. It is the only proof available on
    # one host that scraping, rule evaluation, routing and the mail
    # path are all still working - the same reasoning as the nsd
    # re-signing timer, where scheduling a job proves it started and
    # nothing more.
    watchdog_interval: 24h
  node_exporter:
    listen_address: 127.0.0.1
    port: 9100
    # Enabled explicitly rather than relied upon: the systemd
    # collector is off by default in node_exporter 1.7 (Ubuntu 24.04)
    # and on by default in 1.10 (26.04), and passing the flag is a
    # no-op where it is already on. It is what turns "no unit is in
    # the failed state" into a continuously checked invariant instead
    # of something someone remembers to run - see the
    # unbound-resolvconf story in doc/STATUS.adoc.
    collectors:
      - systemd
    # Where a script may drop a .prom file for anything that has no
    # exporter of its own - NSD serials, DNSSEC signature expiry,
    # fail2ban jail counts. Nothing writes here in phase 1; the
    # directory is created so the collector does not log an error on
    # every scrape.
    textfile_dir: /var/lib/prometheus/node-exporter
  grafana:
    # The one piece of this stack that is not in the Ubuntu archive,
    # which is the whole reason it is a container while Prometheus,
    # Alertmanager and node_exporter are packages. Pinned by tag *and*
    # multi-arch index digest, the stance roles/fail2ban_ui and
    # roles/talk take: a tag can be moved under you, a digest cannot.
    # Bumping the version means editing both, which is the point.
    image: grafana/grafana-oss
    tag: "13.0.2"
    digest: >-
      sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    # Compose file, provisioning and the admin credential. Kept apart
    # from the data directory below, which the container writes and
    # which must survive a recreate - the same split as
    # roles/fail2ban_ui.
    compose_dir: /etc/grafana
    data_dir: /opt/grafana
    # The image runs as this uid and does not change it. The data
    # directory has to be owned by it or Grafana cannot write its
    # database, which it reports as a failed migration at startup
    # rather than as a permission error.
    uid: 472
    # Loopback only, reached through the vhost below and never
    # directly. See the compose template for why host networking makes
    # that literally true rather than merely intended. Its own setting
    # rather than borrowing the Prometheus one: they happen to share a
    # value, and coupling them would move Grafana if that ever changed.
    listen_address: 127.0.0.1
    port: 3000
    admin_user: admin
    # Real value in inventories/group_vars/all/monitoring.yml, the
    # same promotion roles/spam does with its controller password.
    admin_password: ""
    # Referenced by the provisioned dashboards, so it is a setting
    # rather than a literal in two files that could drift apart.
    datasource_uid: prometheus
  alerts:
    # roles/backup writes the metrics these read, and nothing else
    # does. Enabled by default because the role's defaults have to
    # satisfy its own argument spec - a host that does not run
    # roles/backup turns this off in inventory, which is what stops a
    # rule sitting over a metric no exporter produces.
    backup:
      enabled: true
      # 36h rather than 24 for a daily backup: the timer carries a
      # randomized delay and Persistent=true catches up after a
      # reboot, so a day and a half is the first figure that means
      # something went wrong rather than something ran late.
      stale_hours: 36
      # `restic check` is weekly, so this is a missed run plus
      # margin rather than a tight bound.
      unverified_days: 10
    # Per-service thresholds. Both are deliberately generous: these
    # exist to catch a state that persists, not to report a busy
    # hour.
    services:
      # Messages in the deferred queue before it counts as a backlog.
      deferred_queue: 50
      # Failed Dovecot authentications per minute, averaged over a
      # quarter of an hour.
      auth_failures_per_minute: 30
    zones:
      # How long a delegated nameserver may disagree with this host
      # before it counts as a failed transfer rather than one still in
      # flight. A NOTIFY normally settles in seconds, but the
      # collector's own interval is coarse and a retry after a missed
      # NOTIFY waits out the zone's refresh.
      propagation_for: 1h
    probes:
      # Days of certificate life left. Certbot renews at 30 days
      # remaining, so 14 means renewal has already failed for a
      # fortnight and 5 means it is nearly out of road. Measured on
      # the certificate each service actually *serves*, not on the
      # file - which is what makes the pair below meaningful.
      cert_expiry_warning_days: 14
      cert_expiry_critical_days: 5
      # How far the certificates served by nginx, Postfix and Dovecot
      # may drift apart before it counts as a failed reload. They come
      # from one lineage, so any real gap means certbot renewed and
      # something did not pick it up.
      cert_skew_hours: 24
    disk:
      # Percentage of a filesystem still free.
      warning_percent: 10
      critical_percent: 5
      # A falling trend is more useful than any fixed line because it
      # answers "when", and / grows here with every Nextcloud upload.
      # Fit over predict_window, extrapolate predict_horizon_days
      # ahead, alert if that lands below zero. Restricted to
      # filesystems already under predict_below_percent free, so a
      # half-empty disk having a busy afternoon does not qualify.
      predict_window: 6h
      predict_horizon_days: 4
      predict_below_percent: 30
    inodes:
      # A Maildir is one file per message and Nextcloud's data
      # directory is millions of small ones, so this host can
      # plausibly exhaust inodes with space to spare - a failure that
      # presents as "disk full" while df shows room.
      warning_percent: 10
    memory:
      available_percent: 10
    load:
      # node_load15 divided by the number of CPUs.
      per_cpu: 2.0
    clock:
      # roles/time manages ntpsec, so drift means it stopped working
      # rather than that it was never set up.
      max_offset_seconds: 0.05
    network:
      # The interface facing the internet. Same fact and the same
      # reasoning as firewall.docker.wan_interface, and deliberately
      # without a fallback for the same reason: a wrong name makes
      # the rule match nothing, silently.
      interface: "{{ ansible_facts['default_ipv4'].interface }}"
      # Sustained throughput in megabits per second, averaged over
      # `window`. These are placeholders until this host has a
      # baseline to set them from - the right number cannot be known
      # in advance, so treat the first weeks as warn-only and tune.
      # Egress is the interesting direction: an abused relay, a
      # compromised account or a bulk copy of the data directory all
      # look like sustained outbound traffic.
      egress_mbit: 500
      ingress_mbit: 800
      window: 15m
