argument_specs:
  main:
    short_description: Metrics, mail alerting and the status frontend
    description:
      - Installs Prometheus, Alertmanager and node_exporter from the
        Ubuntu archive, binds all three to loopback, deploys the
        alert rules, and routes firing alerts to mail through the
        Postfix this repo already configures.
      - Runs Grafana as a container behind an nginx vhost at
        status.<domain>, which is the only part reachable from off the
        host and only through basic auth.
    options:
      monitoring:
        type: dict
        required: true
        description: Monitoring settings.
        options:
          subdomain:
            type: str
            required: true
            description:
              - The vhost all of this is served under,
                <subdomain>.<domain> for every entry in http.domains.
                Must also appear in http.letsencrypt.subdomains, which
                nothing enforces - the standing trap roles/spam and
                roles/fail2ban_ui both carry.
          prometheus:
            type: dict
            required: true
            description: The metrics server itself.
            options:
              path:
                type: str
                required: true
                description:
                  - Path under the vhost. Prometheus derives its route
                    prefix from this, so it moves every one of its own
                    paths - including /metrics, which is why the
                    self-scrape names <path>metrics.
              listen_address:
                type: str
                required: true
                description:
                  - Address to bind to. The packaged default is
                    0.0.0.0; keep this on loopback while no reverse
                    proxy is in front of it.
              port:
                type: int
                required: true
                description: Port to bind to.
              scrape_interval:
                type: str
                required: true
                description: How often targets are scraped.
              evaluation_interval:
                type: str
                required: true
                description: How often alert rules are evaluated.
              retention_time:
                type: str
                required: true
                description:
                  - How long samples are kept. Prometheus keeps 15d
                    if neither retention setting is given.
              retention_size:
                type: str
                required: true
                description:
                  - Ceiling on the size of the series database,
                    whichever limit is reached first.
              config_file:
                type: str
                required: true
                description: Generated Prometheus configuration.
              version:
                type: str
                required: true
                description:
                  - Upstream release to install. The archive's package
                    ships no modern web UI, so the server comes from
                    the release tarball instead.
              checksums:
                type: dict
                required: true
                description:
                  - sha256 of the release tarball, keyed by Go
                    architecture, from upstream's sha256sums.txt.
                options:
                  amd64:
                    type: str
                    required: true
                    description: Checksum of the amd64 build.
                  arm64:
                    type: str
                    required: true
                    description: Checksum of the arm64 build.
              install_dir:
                type: str
                required: true
                description:
                  - Where the release is unpacked; a versioned
                    directory with a stable symlink beside it.
              data_dir:
                type: str
                required: true
                description: TSDB path.
              rules_dir:
                type: str
                required: true
                description:
                  - Directory holding the generated *.rules.yml, read
                    by Prometheus as a glob.
          textfile:
            type: dict
            required: true
            description:
              - Collectors writing into node_exporter's textfile directory,
                for what nothing exports. Both run as root from a timer,
                since both read something an unprivileged process cannot.
            options:
              fail2ban:
                type: dict
                required: true
                description:
                  - fail2ban's jail counters, including the failed SSH
                    logins nothing else on this host measures.
                options:
                  enabled:
                    type: bool
                    required: true
                    description: Whether to run it.
                  interval:
                    type: str
                    required: true
                    description: How often it runs.
              packetfilter:
                type: dict
                required: true
                description:
                  - Per-rule packet and byte counters from iptables and
                    ip6tables.
                options:
                  enabled:
                    type: bool
                    required: true
                    description: Whether to run it.
                  interval:
                    type: str
                    required: true
                    description: How often it runs.
              nsd:
                type: dict
                required: true
                description:
                  - Zone serials, the serials the delegated nameservers
                    are actually serving, and DNSSEC signature expiry.
                    The checks roles/nsd makes at deploy time, made
                    continuous - between deploys nothing watched them,
                    and each failure is silent because this host goes on
                    answering correctly.
                options:
                  enabled:
                    type: bool
                    required: true
                    description: Whether to run it.
                  interval:
                    type: str
                    required: true
                    description:
                      - How often it runs. Coarser than the others,
                        because this is the one collector that queries
                        off-host.
              wireguard:
                type: dict
                required: true
                description:
                  - Whether the tunnel interface is up, and when each
                    peer last completed a handshake. The wg-quick unit
                    reports success for a tunnel no peer can use, so a
                    unit state does not answer this.
                options:
                  enabled:
                    type: bool
                    required: true
                    description: Whether to run it.
                  interval:
                    type: str
                    required: true
                    description: systemd timer interval.
          exporters:
            type: dict
            required: true
            description:
              - Per-service exporters, all bound to loopback and scraped over
                it. Each is switched on per host, since an exporter for a
                service the host does not run is a unit that fails at every
                boot.
            options:
              listen_address:
                type: str
                required: true
                description: Address every exporter binds. Loopback.
              nginx:
                type: dict
                required: true
                description: nginx, via its stub_status page.
                options:
                  enabled:
                    type: bool
                    required: true
                    description: Whether this host runs it.
                  port:
                    type: int
                    required: true
                    description: Port the exporter binds.
                  status_url:
                    type: str
                    required: true
                    description:
                      - Where nginx serves stub_status, which
                        http.stub_status has to agree with.
              mysqld:
                type: dict
                required: true
                description:
                  - MariaDB. The exporter authenticates through the unix
                    socket as the prometheus system user, so there is no
                    password; creating the account needs root, which the
                    inventory wires from the database role.
                options:
                  enabled:
                    type: bool
                    required: true
                    description: Whether this host runs it.
                  port:
                    type: int
                    required: true
                    description: Port the exporter binds.
                  user:
                    type: str
                    required: true
                    description: Account the exporter connects as.
                  socket:
                    type: str
                    required: true
                    description: MariaDB's unix socket.
                  my_cnf:
                    type: str
                    required: true
                    description: Credentials file the exporter reads.
                  root_user:
                    type: str
                    required: true
                    description: Account used to create the above.
                  root_password:
                    type: str
                    required: true
                    description: Its password.
              redis:
                type: dict
                required: true
                description: Redis.
                options:
                  enabled:
                    type: bool
                    required: true
                    description: Whether this host runs it.
                  port:
                    type: int
                    required: true
                    description: Port the exporter binds.
                  addr:
                    type: str
                    required: true
                    description: Redis URL, on loopback.
              postfix:
                type: dict
                required: true
                description: Postfix, from its log and its showq socket.
                options:
                  enabled:
                    type: bool
                    required: true
                    description: Whether this host runs it.
                  port:
                    type: int
                    required: true
                    description: Port the exporter binds.
                  logfile:
                    type: str
                    required: true
                    description: Mail log the exporter tails.
                  showq:
                    type: str
                    required: true
                    description: Postfix's showq socket.
              dovecot:
                type: dict
                required: true
                description:
                  - Dovecot, which exports Prometheus metrics itself. Nothing
                    is installed for it; the port must match
                    imap.metrics.port.
                options:
                  enabled:
                    type: bool
                    required: true
                    description: Whether to scrape it.
                  port:
                    type: int
                    required: true
                    description: Port Dovecot's stats listener binds.
              rspamd:
                type: dict
                required: true
                description:
                  - RSpamd, whose controller serves /metrics behind a Password
                    header rather than basic auth.
                options:
                  enabled:
                    type: bool
                    required: true
                    description: Whether to scrape it.
                  port:
                    type: int
                    required: true
                    description: Controller port.
                  password:
                    type: str
                    required: true
                    description: Controller password.
          blackbox:
            type: dict
            required: true
            description:
              - End-to-end probes via the packaged blackbox exporter.
                The only part of this role that measures a service from
                a client's side of the socket rather than from inside
                the host, and the source of certificate expiry as
                actually served.
            options:
              enabled:
                type: bool
                required: true
                description: Whether this host runs it.
              listen_address:
                type: str
                required: true
                description: Address the exporter binds. Loopback.
              port:
                type: int
                required: true
                description: Port the exporter binds.
              config_file:
                type: str
                required: true
                description: Module definitions, written by this role.
              timeout:
                type: str
                required: true
                description: Per-probe timeout, inside the scrape interval.
              web:
                type: dict
                required: true
                description:
                  - Subdomains to probe over HTTPS, each crossed with
                    http.domains exactly as roles/http builds
                    server_name.
                options:
                  public:
                    type: list
                    elements: str
                    required: true
                    description:
                      - Names expected to answer 2xx. The empty string
                        is the apex.
                  guarded:
                    type: list
                    elements: str
                    required: true
                    description:
                      - Names behind the shared basic-auth credential,
                        expected to answer 401. Expecting 401 rather
                        than accepting 200-or-401 is what makes a
                        missing gate visible.
              mail:
                type: dict
                required: true
                description:
                  - Postfix and Dovecot, probed on the name the
                    certificate is served under. One of each answers for
                    every domain, so probing per domain would repeat
                    itself.
                options:
                  host:
                    type: str
                    required: true
                    description: Name to connect to.
                  starttls_ports:
                    type: list
                    elements: int
                    required: true
                    description:
                      - Ports reaching TLS through STARTTLS, i.e. the MX
                        and submission.
                  imaps_ports:
                    type: list
                    elements: int
                    required: true
                    description: Ports serving TLS from the first byte.
              dns:
                type: dict
                required: true
                description: The two DNS servers this host runs.
                options:
                  authoritative:
                    type: dict
                    required: true
                    description:
                      - NSD, on the public address. A failure does not
                        take a zone down - the secondaries answer from
                        their own copies - but it stops every change
                        propagating.
                    options:
                      enabled:
                        type: bool
                        required: true
                        description: Whether to probe it.
                      server:
                        type: str
                        required: true
                        description:
                          - Address and port NSD binds. Not loopback, which is
                            unbound's.
                      zones:
                        type: list
                        elements: str
                        required: true
                        description:
                          - Zones to ask for a SOA, wired from
                            nsd.zones rather than repeated. One probe
                            module per zone, since the queried name is a
                            module setting.
                      records:
                        type: list
                        elements: dict
                        required: false
                        default: []
                        description:
                          - Individual names that must exist, as
                            opposed to zones that must answer. A zone
                            answers its SOA correctly with a record
                            missing from it, so the zone probes cannot
                            see that class of failure at all.
                        options:
                          name:
                            type: str
                            required: true
                            description: Fully qualified name to ask for.
                          type:
                            type: str
                            required: true
                            description: Record type, e.g. A or AAAA.
                  recursive:
                    type: dict
                    required: true
                    description:
                      - unbound, on loopback. RSpamd's resolver points
                        here, so a break turns off every SPF, DKIM,
                        DMARC and RBL check silently.
                    options:
                      enabled:
                        type: bool
                        required: true
                        description: Whether to probe it.
                      server:
                        type: str
                        required: true
                        description: Address and port to query.
                      query_name:
                        type: str
                        required: true
                        description:
                          - A name outside every zone this host holds,
                            so only recursion can answer it.
          alertmanager:
            type: dict
            required: true
            description: Alert routing and delivery.
            options:
              listen_address:
                type: str
                required: true
                description:
                  - Address to bind to. As with Prometheus, the
                    packaged default is every interface.
              port:
                type: int
                required: true
                description: Port to bind to.
              config_file:
                type: str
                required: true
                description: Generated Alertmanager configuration.
              mail:
                type: dict
                required: true
                description: Where alerts are delivered.
                options:
                  smarthost:
                    type: str
                    required: true
                    description:
                      - host:port of the SMTP server. The local
                        Postfix, over loopback.
                  from:
                    type: str
                    required: true
                    description: Envelope and header sender.
                  to:
                    type: str
                    required: true
                    description:
                      - Recipient. An address mail.aliases already
                        resolves, so alerts follow the same forward
                        as everything else sent to root.
                  require_tls:
                    type: bool
                    required: true
                    description:
                      - Whether STARTTLS is mandatory. False over
                        loopback, where the traffic never leaves the
                        host.
              group_wait:
                type: str
                required: true
                description:
                  - How long a new alert group is held before its
                    first mail, so related alerts arrive together.
              group_interval:
                type: str
                required: true
                description:
                  - How long before an alert added to an existing
                    group produces another mail.
              repeat_interval:
                type: str
                required: true
                description:
                  - How long before an alert that is still firing is
                    mailed again.
              resolve_timeout:
                type: str
                required: true
                description:
                  - How long an alert with no end time is considered
                    firing after its last evaluation.
              watchdog_interval:
                type: str
                required: true
                description:
                  - How often the always-firing Watchdog alert is
                    mailed. Its absence is the signal that the
                    monitoring pipeline has stopped.
          node_exporter:
            type: dict
            required: true
            description: Host metrics.
            options:
              listen_address:
                type: str
                required: true
                description: Address to bind to.
              port:
                type: int
                required: true
                description: Port to bind to.
              collectors:
                type: list
                elements: str
                required: true
                description:
                  - Collectors enabled on top of the defaults.
                    Passing one already enabled is harmless, which is
                    what makes this safe across the 1.7 and 1.10
                    packages.
              textfile_dir:
                type: str
                required: true
                description:
                  - Directory scanned for *.prom files, for metrics
                    that have no exporter of their own.
          grafana:
            type: dict
            required: true
            description:
              - The frontend served at status.<domain>. A container,
                unlike the rest of this stack, because Grafana is not
                packaged for Ubuntu.
            options:
              image:
                type: str
                required: true
                description: Image repository.
              tag:
                type: str
                required: true
                description: Image tag, pinned alongside the digest.
              digest:
                type: str
                required: true
                description:
                  - Multi-arch index digest. A tag can be moved under
                    you; a digest cannot.
              compose_dir:
                type: str
                required: true
                description:
                  - Holds the compose file, the provisioning tree and
                    the admin credential. Owned by this repo.
              data_dir:
                type: str
                required: true
                description:
                  - Grafana's own database, written by the container
                    and preserved across a recreate.
              uid:
                type: int
                required: true
                description:
                  - The uid the image runs as, which data_dir must be
                    owned by.
              listen_address:
                type: str
                required: true
                description:
                  - Address the container binds. Loopback, since the
                    nginx vhost is the only way in.
              port:
                type: int
                required: true
                description:
                  - Loopback port the container binds, reached only
                    through the nginx vhost.
              admin_user:
                type: str
                required: true
                description: Grafana's own admin account.
              admin_password:
                type: str
                required: true
                description:
                  - Password for that account. Empty in the role
                    defaults; the real value is vault-encrypted in
                    inventory.
              datasource_uid:
                type: str
                required: true
                description:
                  - Fixed uid for the provisioned Prometheus
                    datasource, referenced by the dashboards. A
                    generated one would leave every panel pointed at a
                    datasource that does not exist, which renders as
                    an empty panel rather than an error.
          alerts:
            type: dict
            required: true
            description: Thresholds the rules are rendered from.
            options:
              backup:
                type: dict
                required: true
                description: Thresholds for the roles/backup alerts.
                options:
                  enabled:
                    type: bool
                    required: true
                    description:
                      - Whether to deploy them. Off for a host that
                        does not run roles/backup, since a rule over a
                        metric nothing produces can never fire and
                        reports nothing wrong forever.
                  stale_hours:
                    type: int
                    required: true
                    description:
                      - Hours without a successful backup before
                        warning. Above the timer's period plus its
                        randomized delay, or a run that merely ran
                        late would alert.
                  unverified_days:
                    type: int
                    required: true
                    description:
                      - Days without a passing `restic check` before
                        warning. A separate failure from the backup
                        itself, since backups can keep succeeding into
                        a repository that will not restore.
              zones:
                type: dict
                required: true
                description: Thresholds for the nsd zone alerts.
                options:
                  propagation_for:
                    type: str
                    required: true
                    description:
                      - How long a delegated nameserver may disagree
                        with this host before it counts as a failed
                        transfer rather than one still in flight.
              probes:
                type: dict
                required: true
                description: Thresholds for the blackbox probe alerts.
                options:
                  cert_expiry_warning_days:
                    type: int
                    required: true
                    description:
                      - Days of certificate life left before warning.
                        Certbot renews at 30, so this firing means
                        renewal has already been failing.
                  cert_expiry_critical_days:
                    type: int
                    required: true
                    description: Days left before it is critical.
                  cert_skew_hours:
                    type: int
                    required: true
                    description:
                      - How far the certificates served by nginx,
                        Postfix and Dovecot may drift apart. They read
                        one lineage, so a gap means a reload was missed.
              disk:
                type: dict
                required: true
                description: Filesystem space.
                options:
                  warning_percent:
                    type: int
                    required: true
                    description: Free space below which to warn.
                  critical_percent:
                    type: int
                    required: true
                    description: Free space treated as critical.
                  predict_window:
                    type: str
                    required: true
                    description:
                      - Range the fill trend is fitted over.
                  predict_horizon_days:
                    type: int
                    required: true
                    description:
                      - How far ahead the trend is extrapolated when
                        asking whether the filesystem will fill.
                  predict_below_percent:
                    type: int
                    required: true
                    description:
                      - Only filesystems with less than this much
                        free are judged on the trend, so a mostly
                        empty disk is not alerted on for one busy
                        afternoon.
              inodes:
                type: dict
                required: true
                description: Inode exhaustion.
                options:
                  warning_percent:
                    type: int
                    required: true
                    description: Free inodes below which to warn.
              memory:
                type: dict
                required: true
                description: Memory pressure.
                options:
                  available_percent:
                    type: int
                    required: true
                    description:
                      - Available memory below which to warn.
              load:
                type: dict
                required: true
                description: Run queue.
                options:
                  per_cpu:
                    type: float
                    required: true
                    description:
                      - node_load15 per CPU above which to warn.
              services:
                type: dict
                required: true
                description: Per-service thresholds.
                options:
                  deferred_queue:
                    type: int
                    required: true
                    description:
                      - Messages in Postfix's deferred queue before it
                        counts as a backlog.
                  auth_failures_per_minute:
                    type: int
                    required: true
                    description:
                      - Failed Dovecot authentications per minute,
                        averaged over fifteen minutes.
              clock:
                type: dict
                required: true
                description: Time synchronisation.
                options:
                  max_offset_seconds:
                    type: float
                    required: true
                    description:
                      - Absolute NTP offset above which to warn.
              network:
                type: dict
                required: true
                description: Throughput on the internet-facing NIC.
                options:
                  interface:
                    type: str
                    required: true
                    description:
                      - Interface the traffic rules are scoped to. A
                        wrong name makes them match nothing, so this
                        deliberately has no fallback.
                  egress_mbit:
                    type: int
                    required: true
                    description:
                      - Sustained outbound megabits per second above
                        which to warn.
                  ingress_mbit:
                    type: int
                    required: true
                    description:
                      - Sustained inbound megabits per second above
                        which to warn.
                  window:
                    type: str
                    required: true
                    description:
                      - Range the throughput rate is averaged over.
