---
# Upstream names its release archives by Go's architecture, which is
# not what uname reports. Only the two this repo could run on are
# mapped; anything else fails loudly at the download rather than
# silently fetching an amd64 build.
monitoring_arch_map:
  x86_64: amd64
  aarch64: arm64

# The packaged exporters this role manages, in one table so that
# installing, configuring and enabling them cannot drift apart. Note
# the flag styles differ between them - redis-exporter takes single
# dashes, the rest double - which is the sort of thing that is
# obvious in one place and invisible spread across four.
#
# Dovecot and RSpamd are deliberately absent: both export Prometheus
# metrics themselves, so there is nothing to install for them. They
# appear in prometheus.yml as scrape jobs and nowhere else.
monitoring_exporters:
  - name: nginx
    enabled: "{{ monitoring.exporters.nginx.enabled }}"
    args:
      - >-
        --web.listen-address={{ monitoring.exporters.listen_address
        }}:{{ monitoring.exporters.nginx.port }}
      - --nginx.scrape-uri={{ monitoring.exporters.nginx.status_url }}
  - name: mysqld
    enabled: "{{ monitoring.exporters.mysqld.enabled }}"
    args:
      - >-
        --web.listen-address={{ monitoring.exporters.listen_address
        }}:{{ monitoring.exporters.mysqld.port }}
      - --config.my-cnf={{ monitoring.exporters.mysqld.my_cnf }}
  - name: redis
    enabled: "{{ monitoring.exporters.redis.enabled }}"
    args:
      - >-
        -web.listen-address={{ monitoring.exporters.listen_address
        }}:{{ monitoring.exporters.redis.port }}
      - -redis.addr={{ monitoring.exporters.redis.addr }}
  - name: postfix
    enabled: "{{ monitoring.exporters.postfix.enabled }}"
    args:
      - >-
        --web.listen-address={{ monitoring.exporters.listen_address
        }}:{{ monitoring.exporters.postfix.port }}
      - --postfix.logfile_path={{ monitoring.exporters.postfix.logfile }}
      - --postfix.showq_path={{ monitoring.exporters.postfix.showq }}

# The textfile collectors, in one table for the same reason as the
# exporters above.
# Each carries its own interval because they are not alike: two read
# local state and cost nothing, while `nsd` queries the delegated
# nameservers over the internet and has no business doing so every
# minute.
monitoring_collectors:
  - name: fail2ban
    enabled: "{{ monitoring.textfile.fail2ban.enabled }}"
    interval: "{{ monitoring.textfile.fail2ban.interval }}"
  - name: packetfilter
    enabled: "{{ monitoring.textfile.packetfilter.enabled }}"
    interval: "{{ monitoring.textfile.packetfilter.interval }}"
  - name: nsd
    enabled: "{{ monitoring.textfile.nsd.enabled }}"
    interval: "{{ monitoring.textfile.nsd.interval }}"
  - name: wireguard
    enabled: "{{ monitoring.textfile.wireguard.enabled }}"
    interval: "{{ monitoring.textfile.wireguard.interval }}"
