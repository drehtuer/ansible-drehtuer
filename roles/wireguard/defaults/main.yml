wireguard:  # noqa: var-naming[no-role-prefix] - see doc/STATUS.adoc
  interface: wg0
  # The registered WireGuard port. `redirect_port` below is the
  # fallback for networks that allow nothing but 443 outbound; the
  # firewall role redirects it here, so the tunnel still listens once.
  listen_port: 51820
  redirect_port: 443
  # 1420 = 1500 - 80, the overhead of an IPv6 outer header (40), UDP
  # (8) and WireGuard's own (32). Correct on a 1500-byte path either
  # way, since the IPv4 outer header is smaller. Drop to 1280 if a
  # mobile network with a lower path MTU stalls on large transfers -
  # the symptom is a handshake that succeeds and a download that
  # hangs, not a tunnel that fails to come up.
  mtu: 1420
  # Addressing inside the tunnel.
  #
  # 10.7.0.0/24 deliberately avoids 192.168.0.0/16 and 10.0.0.0/24,
  # which home routers hand out: a peer whose local network overlaps
  # the tunnel cannot reach both, and full-tunnel clients keep using
  # their own LAN.
  #
  # The IPv6 half is a ULA rather than a slice of the host's global
  # /64, because Hetzner puts that /64 on-link - the upstream router
  # expects this host to answer NDP for every address in it, so a
  # range handed to wg0 is not reachable without proxying NDP for it.
  # Peers are masqueraded onto the host's global address instead; see
  # the firewall role. The global ID is random, per RFC 4193, so the
  # prefix does not collide if two private networks are ever joined.
  network:
    ip4: 10.7.0.0/24
    ip6: fd9c:a40e:a2a8::/64
  server:
    ip4: 10.7.0.1
    ip6: fd9c:a40e:a2a8::1
    # Generated by roles/wireguard/scripts/generate_keys.sh and stored
    # as a vaulted inventory value. Empty by default so the role
    # cannot silently configure a tunnel with no key.
    private_key: ""
  # Handed to peers as their resolver. Points at unbound on this host,
  # reachable only through the tunnel - so a roaming client resolves
  # through its own validating recursor rather than whatever the
  # network it is sitting on advertises.
  dns:
    - 10.7.0.1
    - fd9c:a40e:a2a8::1
  # One entry per device. `public_key` and `preshared_key` come from
  # roles/wireguard/scripts/new-peer.sh, which is run on the device so
  # its private key never reaches this repository or the server - or,
  # for a device that cannot run it (a Windows box, a phone), from
  # new-peer-local.sh, which generates the configuration on the
  # controller and leaves it in the gitignored roles/wireguard/keys/.
  peers: []
