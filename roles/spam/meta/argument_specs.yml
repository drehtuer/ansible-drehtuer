argument_specs:
  main:
    short_description: RSpamd, reverse-proxied web UI
    description:
      - Installs RSpamd, wires it to the shared Redis instance and the
        local DNS resolver, and reverse-proxies its password-protected
        controller UI through nginx at spam.<domain>, for every domain
        this host serves.
    options:
      domain:
        type: str
        required: true
        description:
          - Primary domain. Used by the DKIM key generation script,
            which is still commented out in tasks/main.yml.
      http:
        type: dict
        required: true
        description:
          - Shared HTTP settings, owned by the http role. This vhost
            reads `http.port_https` and `http.domains`, serving
            spam.<domain> for each.
          - Deliberately declared without suboptions. Listing them
            would make validation reject every other key the http role
            puts in this dict, which fails the role outright.
      spam:
        type: dict
        required: true
        description: Spam filtering settings.
        options:
          controller_password:
            type: str
            required: true
            description:
              - Password for RSpamd's controller, required for the web
                UI and for every learn request. Read by the imap role's
                training scripts too.
          dkim:
            type: dict
            required: true
            description: Outbound DKIM signing.
            options:
              selector:
                type: str
                required: true
                description:
                  - Selector name, which becomes
                    <selector>._domainkey.<domain> in DNS.
              bits:
                type: int
                required: true
                description: RSA key size.
          milter_port:
            type: int
            required: true
            description:
              - Port RSpamd's milter/proxy worker listens on. Read by
                the mail role to wire Postfix's smtpd_milters to it.
          http_port:
            type: int
            required: true
            description:
              - Port RSpamd's controller worker listens on. Read by
                the imap role's ham/spam learning scripts.
          fuzzy_port:
            type: int
            required: true
            description:
              - Port this host's own fuzzy storage worker listens on,
                for the writable fuzzy_check rule that queries it. Must
                match RSpamd's own `worker "fuzzy"` bind_socket, which
                the role deliberately leaves alone.
          fuzzy_flag:
            type: int
            required: true
            description:
              - Fuzzy flag the hashes learned from the TrainSpam folder
                are stored under. Read by the imap role's learning
                scripts too, which post it to /fuzzyadd and /fuzzydel;
                a value disagreeing with the fuzzy_check rule stores
                hashes nothing looks up, without any error.
      database:
        type: dict
        required: true
        description:
          - Shared with the database role, only database.redis.ip4
            and database.redis.port are read here. Deliberately
            declared without suboptions - listing them would make
            validation reject every other key the database role
            itself requires.
