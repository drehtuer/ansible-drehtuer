# Symbol weights this host sets, where RSpamd's packaged defaults do
# not fit the mail that actually arrives here.
#
# Merged into the top level of RSpamd's own groups.conf, so each entry
# has to repeat the `group` its symbol belongs to - the group name is
# what selects which scores.d file the weight overrides.

# The Bayes ceiling.
#
# RSpamd weights BAYES_SPAM at 5.1 (scores.d/statistics_group.conf) and
# actions.conf sets add_header at 6. Those two numbers together mean a
# message the classifier is *certain* about cannot be flagged: 5.1 is
# less than 6, so Bayes at full confidence still needs another symbol
# to carry it over the line, and no amount of further training changes
# that.
#
# It matters here because of what gets through. Reviewing the 139
# messages filed by hand into TrainSpam in the month to 2026-09-04:
# 87% carried BAYES_SPAM, 80 of them at the full 5.10, and subtracting
# the Bayes contribution left a median score of -0.01. They are
# snowshoe spam - 135 sender domains for 135 messages, 119 of them a
# throwaway `<word>.<brand>.shop`, each with valid SPF, DKIM and DMARC
# - so every policy and reputation check honestly reports "clean" and
# Bayes is the only thing that sees them at all. They landed at 5.09
# against a required 6.00.
#
# 7.0 is chosen so that a confident Bayes verdict is decisive on its
# own while a lukewarm one still is not: at this weight the classifier
# has to be around 87% of the way to certain before it crosses 6.0
# unaided. Replaying that month, 98 of the 135 scored messages (73%)
# would have been filed.
#
# What makes this safer than lowering add_header - which reaches the
# same 73% - is that it cannot touch legitimate mail at all. Of the 233
# messages received in 2026 and kept, *none* has BAYES_SPAM firing;
# their scores come from HFILTER_HOSTNAME_UNKNOWN, DATE_IN_PAST and
# URIBL_GREY. Lowering the threshold instead would move the bar under
# all of them, and the highest of them - four holiday-let confirmations
# at 4.39 - would sit 0.11 away from being misfiled.
group "statistics" {
    symbols {
        "BAYES_SPAM" {
            weight = 7.0;
        }
    }
}

# Score for the local fuzzy storage's hit symbol.
#
# fuzzy_check.conf adds a second rule pointing at this host's own fuzzy
# storage, which learns from the TrainSpam folder. The symbol it emits
# is new, so nothing in scores.d gives it a weight and it would count
# for zero.
#
# Same weight as the packaged FUZZY_DENIED, and for the same reason: a
# body hash learned from a message the user filed as spam by hand is at
# least as good evidence as one learned from the public storage.
group "fuzzy" {
    symbols {
        "LOCAL_FUZZY_DENIED" {
            weight = 12.0;
            description = "Body matches a hash learned from the TrainSpam folder";
        }
    }
}
