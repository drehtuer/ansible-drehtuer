# Two sender patterns that, on this host, only spam has ever matched.
#
# Both come from the same review of the 139 messages filed by hand into
# TrainSpam in the month to 2026-09-04 - a snowshoe campaign with one
# throwaway domain per message, every one of them authenticating
# correctly, so SPF, DKIM, DMARC and every reputation list report
# "clean" and Bayes is left carrying the verdict alone.
#
# The counts below are the reason these are worth having, and the
# reason they are scored rather than made a prefilter: checked against
# every message in every folder except Spam/TrainSpam/Trash/Junk - 11932
# messages, the whole archive rather than a recent window - each map
# matches exactly one, and that one is a message from this same
# campaign sitting unread in the INBOX. There is no legitimate
# correspondent behind either pattern.
#
# 3.0 each is deliberately not decisive on its own. Two-thirds of the
# threshold means a message needs company to be filed - in practice
# Bayes, which agrees on 87% of these - so a correspondent who one day
# does write from a .shop domain is not filed for that alone. Both
# together still fall short of 6.
#
# `header`/From rather than `from`: the envelope sender and the header
# From agree on only 96% of these, and the header is the one the
# measurement above was made against.

local_sender_domain {
  type = "header";
  header = "From";
  filter = "email:domain";
  regexp = true;
  map = "/etc/rspamd/local.d/maps.d/sender_domain_suspect.map";
  symbol = "LOCAL_SENDER_DOMAIN_SUSPECT";
  description = "Sender domain matches a pattern only spam uses here";
  score = 3.0;
  one_shot = true;
}

local_sender_localpart {
  type = "header";
  header = "From";
  filter = "email:user";
  regexp = true;
  map = "/etc/rspamd/local.d/maps.d/sender_localpart_suspect.map";
  symbol = "LOCAL_SENDER_LOCALPART_SUSPECT";
  description = "Sender local part matches a pattern only spam uses here";
  score = 3.0;
  one_shot = true;
}
