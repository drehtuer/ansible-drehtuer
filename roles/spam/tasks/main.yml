- name: Install rspamd
  ansible.builtin.apt:
    install_recommends: false
    name:
      - rspamd
    update_cache: true
  notify:
    - Restart rspamd
- name: Copy DKIM key script
  ansible.builtin.template:
    src: templates/rspamd/dkim_keygen.sh.j2
    dest: /usr/local/bin/dkim_keygen.sh
    owner: root
    group: root
    mode: "0755"
- name: Generate DKIM keys
  # No `creates:` guard - one would name a single domain's key, and
  # this host signs for several. The script is idempotent instead: it
  # leaves an existing key alone and prints what it generated, which
  # is what the changed state below reads.
  ansible.builtin.command:
    cmd: /usr/local/bin/dkim_keygen.sh
  register: spam_dkim_keygen
  changed_when: "'generated ' in spam_dkim_keygen.stdout"
  notify:
    - Reload rspamd
- name: Configure rspamd (milter_headers.conf)
  ansible.builtin.copy:
    src: files/rspamd/milter_headers.conf
    dest: /etc/rspamd/local.d/milter_headers.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload rspamd
- name: Bulk training script
  # For seeding the Bayes classifier from a collection of messages
  # exported from somewhere else. Not run by the role - it is a tool
  # the administrator invokes with a corpus.
  ansible.builtin.template:
    src: templates/rspamd/train-bulk.sh.j2
    dest: /usr/local/bin/rspamd-train-bulk
    owner: root
    group: root
    # Embeds the controller password; run it with sudo.
    mode: "0750"
- name: Configure rspamd (actions.conf)
  ansible.builtin.copy:
    src: files/rspamd/actions.conf
    dest: /etc/rspamd/local.d/actions.conf
    owner: root
    group: root
    mode: "0644"
- name: Configure rspamd (force_actions.conf)
  ansible.builtin.copy:
    src: files/rspamd/force_actions.conf
    dest: /etc/rspamd/local.d/force_actions.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload rspamd
- name: Configure rspamd (options.inc)
  # Points RSpamd's own DNS resolution at the local caching resolver
  # from roles/dns, rather than whatever the host's /etc/resolv.conf
  # says.
  ansible.builtin.copy:
    src: files/rspamd/options.inc
    dest: /etc/rspamd/local.d/options.inc
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload rspamd
- name: Configure rspamd (redis.conf)
  ansible.builtin.template:
    src: templates/rspamd/redis.conf.j2
    dest: /etc/rspamd/local.d/redis.conf
    owner: root
    group: root
    mode: "0644"
- name: Remove the old local.d controller config
  # It was merged with the packaged defaults rather than replacing
  # them; leaving it behind would reintroduce secure_ip.
  ansible.builtin.file:
    path: /etc/rspamd/local.d/worker-controller.inc
    state: absent
  notify:
    - Restart rspamd
- name: Configure rspamd (worker-controller.inc)
  ansible.builtin.template:
    src: templates/rspamd/worker-controller.inc.j2
    # override.d, not local.d: local.d *merges* with the packaged
    # config, so the `secure_ip = 127.0.0.1` RSpamd ships would survive
    # and keep treating every request arriving through nginx as
    # trusted. override.d replaces the section outright, which is the
    # only way to drop a default.
    dest: /etc/rspamd/override.d/worker-controller.inc
    owner: root
    group: _rspamd
    # Contains the controller password, so not world-readable like the
    # rest of local.d.
    mode: "0640"
  notify:
    - Restart rspamd
