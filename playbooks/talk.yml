# Depends on roles/docker for the engine, roles/http for nginx and a
# certificate covering talk.<domain>, and roles/cloud for the Nextcloud
# this backend serves - occ is what registers it. See doc/STATUS.adoc.
- name: Talk role
  hosts: all
  gather_facts: false
  roles:
    - role: talk
      tags:
        - talk
    # Runs after the role above, so a component that failed to
    # deploy is never recorded as deployed. Carries the same tag,
    # so `--tags talk` stamps what it deployed.
    - role: deploy_stamp
      vars:
        deploy_stamp_component: talk
      tags:
        - talk
