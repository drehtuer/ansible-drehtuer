# Authoritative DNS. Runs alongside the `dns` role's unbound, which
# stays loopback-only - see roles/nsd/templates/nsd.conf.j2 for why
# this cannot be an open resolver.
- name: Nsd role
  hosts: all
  roles:
    - role: nsd
      tags:
        - nsd
    # Runs after the role above, so a component that failed to
    # deploy is never recorded as deployed. Carries the same tag,
    # so `--tags nsd` stamps what it deployed.
    - role: deploy_stamp
      vars:
        deploy_stamp_component: nsd
      tags:
        - nsd
