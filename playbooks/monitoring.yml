# On a fresh host, run playbooks/apt.yml first - the apt role is the
# only one that refreshes the apt cache. See doc/TODO.adoc.
#
# gather_facts stays on (the default) here:
# monitoring.alerts.network.interface defaults to
# ansible_facts['default_ipv4'].interface, the same fact and the same
# reason as playbooks/firewall.yml.
- name: Monitoring role
  hosts: all
  roles:
    - role: monitoring
      tags:
        - monitoring
    # Runs after the role above, so a component that failed to
    # deploy is never recorded as deployed. Carries the same tag,
    # so `--tags monitoring` stamps what it deployed.
    - role: deploy_stamp
      vars:
        deploy_stamp_component: monitoring
      tags:
        - monitoring
