# On a fresh host, run playbooks/apt.yml first - the apt role is the
# only one that refreshes the apt cache. See doc/TODO.adoc.
#
# Ordering: this wants roles/database to have run, since it dumps what
# MariaDB holds, and roles/cloud if backup.nextcloud.enabled is set,
# since it calls occ. Neither is asserted - one more constraint for the
# umbrella playbook, alongside the five already in doc/STATUS.adoc.
- name: Backup role
  hosts: all
  roles:
    - role: backup
      tags:
        - backup
    # Runs after the role above, so a component that failed to
    # deploy is never recorded as deployed. Carries the same tag,
    # so `--tags backup` stamps what it deployed.
    - role: deploy_stamp
      vars:
        deploy_stamp_component: backup
      tags:
        - backup
