# On a fresh host, run playbooks/apt.yml first - the apt role is the
# only one that refreshes the apt cache. See doc/TODO.adoc.
#
# gather_facts stays on (the default) here: firewall.docker.wan_interface
# defaults to ansible_facts['default_ipv4'].interface.
- name: Firewall role
  hosts: all
  roles:
    - role: firewall
      tags:
        - firewall
    # Runs after the role above, so a component that failed to
    # deploy is never recorded as deployed. Carries the same tag,
    # so `--tags firewall` stamps what it deployed.
    - role: deploy_stamp
      vars:
        deploy_stamp_component: firewall
      tags:
        - firewall
