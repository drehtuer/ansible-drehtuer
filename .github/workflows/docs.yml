# Renders the AsciiDoc pages and publishes them to GitHub Pages.
#
# The pages were written for this: every one of them opens with
# `include::doc/.attributes-page.adoc[]`, which has set `:backend:
# html5`, `:data-uri:` and `:toc: auto` since long before anything
# rendered them. What was missing was only the build and the publish.
#
# Deliberately separate from lint.yml, which also runs asciidoctor.
# That job renders to /dev/null to find faults and gates every pull
# request; this one produces artefacts and runs on `main` alone. A
# failure here means the site is stale, not that the branch is bad.
name: Documentation

"on":
  push:
    branches:
      - main
  # So the site can be rebuilt without an empty commit, e.g. after
  # enabling Pages for the first time.
  workflow_dispatch:

# Least privilege: `pages` and `id-token` are what deploy-pages needs,
# and `contents: read` is what checkout needs. Nothing here writes to
# the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and never cancel one in flight - a cancelled
# deployment can leave Pages serving a half-uploaded artefact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Render
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # Node for Antora. The runner ships one, but naming the
      # version keeps this build and the Dev Container on the same
      # major - Ubuntu 26.04 packages 22 there.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Keep the version in step with ANTORA_VERSION in
      # .devcontainer/Dockerfile. The CLI and the site generator are
      # separate packages and must match, or the run fails with
      # "generator not found".
      - name: Install Antora
        run: |
          npm install --global --no-fund --no-audit \
            @antora/cli@3.1.15 @antora/site-generator@3.1.15

      # kramdoc converts the Markdown skill definitions to AsciiDoc,
      # which is what lets Antora render them at all - it reads
      # AsciiDoc and nothing else. Keep in step with KRAMDOC_VERSION
      # in .devcontainer/Dockerfile.
      - name: Install kramdoc
        run: sudo gem install --no-document kramdown-asciidoc -v 2.1.1

      # invoke drives the build rather than the workflow calling
      # antora itself, so that `invoke docs` locally and the published
      # site are produced by one piece of code. The task also
      # assembles the Antora component from the sources, which a bare
      # antora call has nothing to work from without.
      - name: Install invoke
        run: sudo apt-get install --no-install-recommends --yes python3-invoke

      - name: Render the pages
        run: invoke docs

      - name: Upload the artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
