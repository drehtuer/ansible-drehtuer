# SonarQube Cloud analysis of `main` and of every pull request. The
# project key, organization and ignore rules are in
# sonar-project.properties. Automatic analysis has to stay off in the
# project: SonarQube Cloud fails a CI analysis while it is on.
name: SonarQube Cloud

"on":
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

# One scan per branch at a time. SonarQube Cloud dates an analysis by
# when its scan started and rejects one older than the last it accepted,
# so overlapping scans - merging several pull requests in a row - would
# fail whichever finishes last. A running scan is never cancelled; GitHub
# keeps only the newest waiting one, which is the commit worth analysing.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan
    # GitHub does not give a fork's pull request the token, so the scan
    # could only fail there.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    steps:
      # Full history, which the new-code comparison and blame need.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned to a commit, since this step is given the token. Renovate
      # keeps the version comment on the line below in step with it.
      - name: Run the scan
        # yamllint disable-line rule:line-length
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4  # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
