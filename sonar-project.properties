# Read by .github/workflows/sonar.yml.
sonar.projectKey=drehtuer_ansible-drehtuer
sonar.organization=drehtuer
sonar.python.version=3.12

# Fail the CI check on a rejected report or a failed quality gate. Without
# this the check only confirms the upload, and a rejected report stays green.
sonar.qualitygate.wait=true

# Coverage is not measured: the static and molecule tests produce no report,
# so every line would count as uncovered and the gate could never pass.
sonar.coverage.exclusions=**/*

# The Dockerfile's apt list is grouped by purpose, with comments saying
# why each group is there. The finding is on a continuation line, where
# a trailing NOSONAR would break the RUN, so it is ignored here instead.
sonar.issue.ignore.multicriteria=dockerAptOrder
sonar.issue.ignore.multicriteria.dockerAptOrder.ruleKey=docker:S7018
sonar.issue.ignore.multicriteria.dockerAptOrder.resourceKey=.devcontainer/Dockerfile
